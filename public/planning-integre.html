// ═══════════════════════════════════════════════════════════════
// TIMELINE GRID CALCULATION
// ═══════════════════════════════════════════════════════════════
let GRID = null;

function timelineLabelW() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--label-w'), 10) || 200;
}

function buildGrid(year, scale) {
  // Always render the FULL year — headers always present when scrolling
  const rangeStart = new Date(year, 0, 1);
  const rangeEnd   = new Date(year, 11, 31);

  // Focus range: what to scroll to initially
  let focusStart, focusEnd;
  if(scale === 'q') {
    const qIdx = (STATE.selectedQuarter||1) - 1;
    focusStart = new Date(year, qIdx*3, 1);
    focusEnd   = new Date(year, qIdx*3+3, 0);
  } else if(scale === 'month') {
    const m = STATE.selectedMonth != null ? STATE.selectedMonth : 0;
    focusStart = new Date(year, m, 1);
    focusEnd   = new Date(year, m+1, 0);
  } else {
    focusStart = rangeStart;
    focusEnd   = rangeEnd;
  }

  const totalDays = Math.round((rangeEnd - rangeStart)/864e5) + 1;
  const focusStartDay = Math.round((focusStart - rangeStart)/864e5);
  const focusEndDay   = Math.round((focusEnd   - rangeStart)/864e5);
  const focusDays     = focusEndDay - focusStartDay + 1;

  const quarters = [
    {label:'T1', start:new Date(year,0,1),  end:new Date(year,2,31)},
    {label:'T2', start:new Date(year,3,1),  end:new Date(year,5,30)},
    {label:'T3', start:new Date(year,6,1),  end:new Date(year,8,30)},
    {label:'T4', start:new Date(year,9,1),  end:new Date(year,11,31)},
  ].map(q => ({...q, visStart:q.start, visEnd:q.end,
    inRange: q.start <= focusEnd && q.end >= focusStart}));

  const months = [];
  for(let m=0; m<12; m++) {
    const ms = new Date(year,m,1), me = new Date(year,m+1,0);
    const startDay = Math.round((ms - rangeStart)/864e5);
    const days = Math.round((me - ms)/864e5)+1;
    months.push({
      label: ms.toLocaleDateString('fr-FR',{month:'short'}),
      startDay, days, month:m,
      inRange: ms <= focusEnd && me >= focusStart
    });
  }

  const weeks = [];
  let d = new Date(rangeStart);
  const seen = new Set();
  for(let i=0; i<totalDays; i++) {
    const w = isoWeek(d);
    const key = `${d.getFullYear()}-${w}`;
    if(!seen.has(key)) {
      seen.add(key);
      const startDay = Math.round((d - rangeStart)/864e5);
      let days = 0, dd = new Date(d);
      while(dd <= rangeEnd) {
        if(`${dd.getFullYear()}-${isoWeek(dd)}` !== key) break;
        days++; dd = addDays(dd,1);
      }
      weeks.push({
        label:`S${String(w).padStart(2,'0')}`, startDay, days, week:w,
        inRange: startDay >= focusStartDay && startDay <= focusEndDay
      });
    }
    d = addDays(d,1);
  }

  // dayPx: focus period fills the viewport, rest uses same scale.
  // Measure whichever view's scroll container is currently visible,
  // since the hidden one reports clientWidth = 0.
  const tlRoot = document.getElementById('timeline-scroll-root');
  const cvRoot = document.getElementById('canal-scroll-root');
  const container = (tlRoot && tlRoot.clientWidth > 0) ? tlRoot
                   : (cvRoot && cvRoot.clientWidth > 0) ? cvRoot
                   : (tlRoot || cvRoot);
  // Largeur utile = largeur visible moins la colonne des libellés (vue Année : tout tient à
  // l'écran, sans défilement horizontal). Pendant un export PDF, largeur fixe.
  const labelW = container === cvRoot ? 150 : timelineLabelW();
  const avail = (window.__exportWidth || (container ? container.clientWidth : 0)) - labelW - 1;
  const viewW = Math.max(600, avail || 800);
  const dayPx = scale === 'year' ? viewW / totalDays : viewW / focusDays;

  return {
    start: rangeStart, end: rangeEnd, totalDays, dayPx,
    quarters, months, weeks,
    focusStartDay, focusEndDay, focusDays,
    year, scale
  };
}

function dateToX(dateStr, grid) {
  const d = parseDate(dateStr);
  if(!d) return 0;
  const days = (d - grid.start) / 864e5;
  return Math.max(0, days * grid.dayPx);
}

function durationToPx(startStr, endStr, grid) {
  const s = parseDate(startStr), e = parseDate(endStr);
  if(!s||!e) return 20;
  return Math.max(20, ((e-s)/864e5+1)*grid.dayPx);
}

// ═══════════════════════════════════════════════════════════════
// RENDER HEADER
// ═══════════════════════════════════════════════════════════════
// Build a single sticky header row element
function buildHeaderRow(id, stickyTop, labelText, cells, extraCls) {
  const row = ce('div', 'tl-header-row' + (extraCls?' '+extraCls:''));
  row.id = id;
  row.style.top = stickyTop + 'px';

  const lbl = ce('div','tl-label-col');
  lbl.style.minHeight = '22px';
  if(labelText) { lbl.textContent = labelText; lbl.style.fontWeight='700'; lbl.style.fontSize='11px'; }
  row.appendChild(lbl);

  const cellsWrap = ce('div','header-cells');
  cells.forEach(c => cellsWrap.appendChild(c));
  row.appendChild(cellsWrap);
  return row;
}

function renderHeader(grid, root) {
  const isMonth = grid.scale === 'month';
  const today = new Date();
  const todayDay = Math.round((today - grid.start)/864e5);
  const DAY_NAMES = ['Di','Lu','Ma','Me','Je','Ve','Sa'];
  const scaleLabel = grid.scale==='q' ? ` · T${STATE.selectedQuarter||1}` :
                     isMonth ? ` · ${grid.months[STATE.selectedMonth||0]?.label||''}` : '';
  const labelTitle = STATE.currentYear + scaleLabel;

  // Q row (top: 0)
  const qCells = grid.quarters.map(q => {
    const days = Math.round((q.end - q.start)/864e5)+1;
    const cls = 'header-cell q' + (grid.scale!=='year' ? (q.inRange ? ' in-range' : ' out-of-range') : '');
    const c = ce('div', cls); c.style.width=(days*grid.dayPx)+'px'; c.textContent=q.label; return c;
  });
  const qRow = buildHeaderRow('tl-hrow-q', 0, labelTitle, qCells);
  addTodayFlag(qRow, grid);
  root.appendChild(qRow);

  // M row (top: 22)
  const mCells = grid.months.map(m => {
    const cls = 'header-cell m' + (grid.scale!=='year' ? (m.inRange ? ' in-range' : ' out-of-range') : '');
    const c = ce('div', cls); c.style.width=(m.days*grid.dayPx)+'px'; c.textContent=m.label; return c;
  });
  root.appendChild(buildHeaderRow('tl-hrow-m', 22, '', mCells));

  // W row (top: 44)
  const wCells = grid.weeks.map(w => {
    const isT = todayDay>=w.startDay && todayDay<w.startDay+w.days;
    const cls = 'header-cell w' + (isT?' today-col':'') + (grid.scale!=='year' ? (w.inRange ? ' in-range' : ' out-of-range') : '');
    const c = ce('div', cls);
    c.style.width=(w.days*grid.dayPx)+'px';
    if(w.days*grid.dayPx>14) c.textContent=w.label;
    return c;
  });
  root.appendChild(buildHeaderRow('tl-hrow-w', 44, '', wCells));

  // D row (top: 66) — only in month view
  if(isMonth) {
    const dCells = [];
    let d = new Date(grid.start);
    for(let i=0;i<grid.totalDays;i++) {
      const isT = i===todayDay;
      const isWE = d.getDay()===0||d.getDay()===6;
      const c = ce('div','header-cell d'+(isT?' today-col':'')+(isWE?' weekend':''));
      c.style.width = grid.dayPx+'px';
      c.innerHTML = `<span style="font-weight:700">${d.getDate()}</span><span style="opacity:0.6;font-size:8px">${DAY_NAMES[d.getDay()]}</span>`;
      dCells.push(c);
      d = addDays(d,1);
    }
    root.appendChild(buildHeaderRow('tl-hrow-d', 66, '', dCells));
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER TIMELINE ROWS
// ═══════════════════════════════════════════════════════════════
function renderTimelineRows(grid, root) {
  const d = data();
  const totalPx = grid.totalDays * grid.dayPx;
  const today = new Date();
  const todayDay = Math.round((today - grid.start)/864e5);
  const isMonth = grid.scale === 'month';

  // Precompute milestone x-positions to draw dashed lines on all rows.
  const milestoneCxs = (d.milestones||[])
    .map(m => dateToX(m.date, grid) + grid.dayPx/2)
    .filter(cx => cx >= 0 && cx <= totalPx);

  // Helper: build background stripes inside a tl-grid-cell
  function buildBgStripes(cellEl) {
    // Dim out-of-focus area when not in year view
    if(grid.scale !== 'year') {
      // Left out-of-range
      if(grid.focusStartDay > 0) {
        const dim = ce('div','');
        dim.style.cssText=`position:absolute;top:0;bottom:0;left:0;width:${grid.focusStartDay*grid.dayPx}px;background:rgba(0,0,0,0.06);pointer-events:none;z-index:1`;
        cellEl.appendChild(dim);
      }
      // Right out-of-range
      if(grid.focusEndDay < grid.totalDays-1) {
        const rightStart = (grid.focusEndDay+1)*grid.dayPx;
        const dim = ce('div','');
        dim.style.cssText=`position:absolute;top:0;bottom:0;left:${rightStart}px;right:0;background:rgba(0,0,0,0.06);pointer-events:none;z-index:1`;
        cellEl.appendChild(dim);
      }
    }
    grid.months.forEach(m => {
      const stripe = ce('div','row-bg-stripe');
      stripe.style.left = (m.startDay*grid.dayPx)+'px';
      stripe.style.width = (m.days*grid.dayPx)+'px';
      cellEl.appendChild(stripe);
    });
    if(isMonth) {
      for(let i=0;i<grid.totalDays;i++) {
        const dd = addDays(grid.start, i);
        if(dd.getDay()===0||dd.getDay()===6) {
          const s = ce('div','');
          s.style.cssText=`position:absolute;top:0;bottom:0;left:${i*grid.dayPx}px;width:${grid.dayPx}px;background:var(--bg3);pointer-events:none;opacity:0.4`;
          cellEl.appendChild(s);
        }
      }
    }
    if(todayDay>=0 && todayDay<grid.totalDays) {
      const s = ce('div','row-bg-stripe today');
      s.style.left=(todayDay*grid.dayPx)+'px';
      s.style.width=grid.dayPx+'px';
      cellEl.appendChild(s);
    }
    // Dashed milestone lines across every row
    milestoneCxs.forEach(cx => {
      const line = ce('div','milestone-dash-line');
      line.style.left = cx+'px';
      cellEl.appendChild(line);
    });
  }

  // Helper: create a data row = label col + grid cell
  function makeDataRow(extraRowCls, labelContent, minH) {
    const row = ce('div','tl-data-row'+(extraRowCls?' '+extraRowCls:''));
    row.style.minWidth = (timelineLabelW() + totalPx) + 'px';
    if(minH) row.style.minHeight = minH+'px';

    const lbl = ce('div','tl-label-col'+(extraRowCls&&extraRowCls.includes('season')?' season':''));
    lbl.innerHTML = labelContent;
    row.appendChild(lbl);

    const cell = ce('div','tl-grid-cell');
    cell.style.width = totalPx + 'px';
    buildBgStripes(cell);
    row.appendChild(cell);
    return {row, lbl, cell};
  }

  // ─── ROW: SAISONNALITÉ ───
  if(STATE.displayOpts.showSeason) {
    let lblHtml = `<span>🗓</span><span>Saisonnalité<br><small style="font-weight:400;color:var(--text3)">Événements</small></span>`;
    if(STATE.isAdmin) {
      lblHtml += `<button class="row-add-btn" title="Ajouter un jalon" onclick="openMilestoneModal(null)">＋</button>
                  <button class="row-add-btn" title="Ajouter une période" style="margin-left:2px" onclick="openPeriodModal(null)">◼</button>`;
    }
    const {row, lbl, cell} = makeDataRow('season-row', lblHtml, 44);
    // Sticky season row below header (top = 66px year view, 98px month view)
    row.style.top = (grid.scale === 'month' ? 98 : 66) + 'px';

    // Greedy placement of periods.
    const periods = d.periods||[];
    const pLevels = [];
    const PERIOD_ROW = 22, P_GAP = 2;
    periods.forEach(p => {
      const x1 = dateToX(p.start, grid);
      const w = durationToPx(p.start, p.end, grid);
      if(x1 > totalPx || x1+w < 0) return;
      let level = 0;
      while(pLevels[level] !== undefined && pLevels[level] > x1) level++;
      pLevels[level] = x1 + w;
      const el = ce('div','season-period');
      el.style.cssText=`left:${x1}px;width:${Math.max(20,w)}px;top:${4+level*(PERIOD_ROW+P_GAP)}px;background:${p.color||'#94a3b8'};color:${isContrastDark(p.color||'#94a3b8')?'#000':'#fff'}`;
      el.textContent=p.title;
      el.title=`${esc(p.title)} (${fmtDate(p.start)} → ${fmtDate(p.end)})`;
      el.onclick = () => openPeriodModal(p, !STATE.isAdmin);
      if(STATE.isAdmin) el.addEventListener('contextmenu',ev=>{ev.preventDefault();openPeriodModal(p);});
      cell.appendChild(el);
    });

    // Greedy placement of milestones in a dedicated band below periods.
    const MS_ICON = 26, MS_GAP = 4, MS_ROW = MS_ICON + MS_GAP;
    const mLevels = [];
    const msPlaced = [];
    const msSorted = (d.milestones||[]).slice()
      .map(m => ({ m, cx: dateToX(m.date, grid) + grid.dayPx/2 }))
      .filter(x => x.cx >= 0 && x.cx <= totalPx)
      .sort((a,b) => a.cx - b.cx);
    msSorted.forEach(({m, cx}) => {
      const leftEdge = cx - MS_ICON/2 - 2;
      const rightEdge = cx + MS_ICON/2 + 2;
      let level = 0;
      while(mLevels[level] !== undefined && mLevels[level] > leftEdge) level++;
      mLevels[level] = rightEdge;
      msPlaced.push({m, cx, level});
    });
    const msTopBase = 4 + pLevels.length * (PERIOD_ROW + P_GAP);
    msPlaced.forEach(({m, cx, level}) => {
      const top = msTopBase + level * MS_ROW;
      const el = ce('div','milestone-marker');
      el.style.left = cx+'px';
      el.style.top = top + 'px';
      const icon = ce('div','milestone-icon', m.icon||'📌');
      icon.title=`${m.title} (${fmtDate(m.date)})`;
      el.appendChild(icon);
      el.onclick = () => openMilestoneModal(m, !STATE.isAdmin);
      cell.appendChild(el);
    });

    const msH = mLevels.length ? (mLevels.length - 1) * MS_ROW + MS_ICON : 0;
    const seasonH = Math.max(44, 8 + pLevels.length * (PERIOD_ROW + P_GAP) + msH + 4);
    row.style.minHeight = seasonH+'px';
    lbl.style.minHeight = seasonH+'px';
    cell.style.minHeight = seasonH+'px';
    root.appendChild(row);
  }

  // ─── STRATEGY ROWS (Réglementaire / Acquisition / Fidélisation) ───
  if(STATE.displayOpts.showRegulatory) {
    renderStrategyRowNew(grid, root, 'reglementaire', totalPx, makeDataRow);
  }
  renderStrategyRowNew(grid, root, 'acquisition', totalPx, makeDataRow);
  renderStrategyRowNew(grid, root, 'fidelisation', totalPx, makeDataRow);
}  




function renderStrategyRowNew(grid, root, type, totalPx, makeDataRow) {
  const d = data();
  const STRAT_META = {
    acquisition:   { label: 'Stratégie Acquisition',  badgeCls: 'badge-acq', badgeTxt: 'ACQ', icon: '🎯' },
    fidelisation:  { label: 'Stratégie Fidélisation',  badgeCls: 'badge-fid', badgeTxt: 'FID', icon: '💎' },
    reglementaire: { label: 'Réglementaire',           badgeCls: 'badge-reg', badgeTxt: 'REG', icon: '⚠️' }
  };
  const meta = STRAT_META[type] || STRAT_META.acquisition;
  const label = meta.label, badgeCls = meta.badgeCls, badgeTxt = meta.badgeTxt;
  const adminBtn = STATE.isAdmin ? `<button class="row-add-btn" title="Nouvelle campagne" onclick="openCampaignModal(null,'${type}')">＋</button>` : '';
  const lblHtml = `<span>${meta.icon}</span>
    <div style="flex:1;min-width:0;overflow:hidden">
      <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px">${label}</div>
      <span class="row-type-badge ${badgeCls}">${badgeTxt}</span>
    </div>${adminBtn}`;
  const {row, lbl, cell} = makeDataRow('', lblHtml, 56);
  
  // Filter campaigns
  let campaigns = (d.campaigns||[]).filter(c => c.type === type);
  
  // Apply filters
  if(STATE.filters.campaigns.length) campaigns = campaigns.filter(c=>STATE.filters.campaigns.includes(c.id));
  if(STATE.filters.types.length) campaigns = campaigns.filter(c=>STATE.filters.types.includes(c.type));
  if(STATE.filters.colors && STATE.filters.colors.length) campaigns = campaigns.filter(c=>STATE.filters.colors.some(col=>col.toLowerCase()===(c.color||'').toLowerCase()));
  if(STATE.filters.kpiStatus==='achieved') campaigns = campaigns.filter(campaignAtteinte);
  if(STATE.filters.kpiStatus==='unachieved') campaigns = campaigns.filter(c=>!campaignAtteinte(c));
  if(!STATE.displayOpts.showAchieved) campaigns = campaigns.filter(c=>!campaignAtteinte(c));
  if(!STATE.displayOpts.showUnachieved) campaigns = campaigns.filter(c=>campaignAtteinte(c));
  campaigns = campaigns.filter(c => matchesSearch(c, d));
  
  const placed = []; // tracks right-edge x per level
  const levelHeights = []; // final height per level (computed first pass)

  // Sort by start date so the greedy level-packing places non-overlapping
  // campaigns on the same level instead of needlessly stacking them
  const sortedCampaigns = campaigns.filter(c => c.startDate).slice().sort((a,b) => {
    const da = parseDate(a.startDate), db = parseDate(b.startDate);
    return (da||0) - (db||0);
  });

  // ── PASS 1: assign levels & compute cardH for each campaign ──
  const campData = sortedCampaigns.map(camp => {
    const x1 = dateToX(camp.startDate, grid);
    const w  = Math.max(60, durationToPx(camp.startDate, camp.endDate||camp.startDate, grid));
    let level = 0;
    while(placed[level] !== undefined && placed[level] > x1 + 4) level++;
    placed[level] = x1 + w;

    const expanded = STATE.expandedCampaigns.has(camp.id);
    const actions  = (d.actions||[]).filter(a=>a.campaignId===camp.id);
    const CARD_H   = 48 + (STATE.displayOpts.showKpi && getProgress(camp)!==null ? 20 : 0);
    let expandedExtraH = 0;
    if(expanded && actions.length) {
      const byChannel = {};
      actions.forEach(a => {
        const ch = (data().channels.find(c=>c.id===a.channelId)||{}).name||'–';
        if(!byChannel[ch]) byChannel[ch]=[];
        byChannel[ch].push(a);
      });
      actions.forEach(a => {
        expandedExtraH += 22;
        if(STATE.expandedActions.has(a.id)) expandedExtraH += (a.imageData?230:0)+(a.kpis||[]).length*22+14;
      });
      expandedExtraH += Object.keys(byChannel).length * 18 + 8;
    }
    const cardH = CARD_H + expandedExtraH;
    if(!levelHeights[level] || levelHeights[level] < cardH) levelHeights[level] = cardH;
    return { camp, x1, w, level, cardH, actions };
  });

  // ── PASS 2: render each campaign at correct topOffset ──
  const CARD_SPACING = 8;
  campData.forEach(({ camp, x1, w, level, cardH, actions }) => {
    // topOffset = 8 + sum of heights of all levels above this one
    let topOffset = 8;
    for(let l = 0; l < level; l++) topOffset += (levelHeights[l]||48) + CARD_SPACING;

    const color    = camp.color||'#54D89C';
    const atteinte = campaignAtteinte(camp);
    const prog     = getProgress(camp);
    const expanded = STATE.expandedCampaigns.has(camp.id);
    
    // Build expanded actions html
    let expandedHtml = '';
    if(expanded && actions.length) {
      const byChannel = {};
      actions.forEach(a => {
        const ch = (data().channels.find(c=>c.id===a.channelId)||{}).name||'–';
        if(!byChannel[ch]) byChannel[ch]=[];
        byChannel[ch].push(a);
      });
      expandedHtml += `<div style="border-top:1px solid var(--cc-border);background:rgba(255,255,255,0.35);padding:4px 6px;">`;
      Object.entries(byChannel).forEach(([chName, acts]) => {
        expandedHtml += `<div style="font-size:9px;font-weight:700;text-transform:uppercase;opacity:0.6;margin:4px 0 2px;letter-spacing:.5px">${chName}</div>`;
        acts.forEach(a => {
          const aOpen = STATE.expandedActions.has(a.id);
          const aAchieved = (a.kpis||[]).some(k=>k.objectif&&Number(k.realise||0)>=Number(k.objectif));
          expandedHtml += `<div class="action-expand-row" data-aid="${a.id}" style="border-radius:3px;margin-bottom:2px;background:rgba(255,255,255,0.12);cursor:pointer;">
            <div style="display:flex;align-items:center;gap:4px;padding:3px 5px;font-size:10px;font-weight:600;">
              <span style="opacity:0.7">${aOpen?'▾':'▸'}</span>
              ${aAchieved?'<span style="color:var(--star);font-size:9px">★</span>':''}
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title||'Action')}</span>
              <span style="opacity:0.6;font-size:9px;flex-shrink:0">${fmtDate(a.startDate||a.date)}</span>
            </div>`;
          if(aOpen) {
            expandedHtml += `<div style="padding:3px 5px 5px 14px;font-size:10px;border-top:1px solid rgba(0,0,0,0.1);">`;
            if(a.endDate&&a.endDate!==(a.startDate||a.date)) expandedHtml += `<div style="opacity:0.75;margin-bottom:3px">📅 ${fmtDate(a.startDate||a.date)} → ${fmtDate(a.endDate)}</div>`;
            if(a.imageData) expandedHtml += `<img src="${safeImgSrc(a.imageData)}" class="clickable-img" style="width:100%;height:auto;max-height:220px;object-fit:contain;border-radius:4px;margin-bottom:4px;display:block;" onclick="event.stopPropagation();openImageLightbox('${safeImgSrc(a.imageData)}')" alt="">`;
            (a.kpis||[]).forEach(k => {
              if(!k.type) return;
              const pct = k.objectif?Math.round(Number(k.realise||0)/Number(k.objectif)*100):null;
              expandedHtml += `<div style="margin-bottom:2px"><div style="display:flex;justify-content:space-between"><span style="opacity:0.8">${k.type}</span><span style="font-weight:700;color:${pct>=100?'#047857':'#e11d48'}">${k.realise||0}/${k.objectif||'–'}${pct!==null?` (${pct}%)`:''}</span></div>${pct!==null?`<div style="height:3px;background:rgba(0,0,0,0.2);border-radius:2px;margin-top:1px"><div style="height:100%;width:${Math.min(pct,100)}%;background:${pct>=100?'#4ade80':'#f87171'};border-radius:2px"></div></div>`:''}</div>`;
            });
            expandedHtml += `</div>`;
          }
          expandedHtml += `</div>`;
        });
      });
      expandedHtml += `</div>`;
    }

    const el = ce('div','campaign-card');
    el.dataset.id = camp.id;
    el.style.cssText = `left:${x1}px;width:${w}px;top:${topOffset}px;z-index:${3+level};--cc:${color};--cc-border:${hexToRgba(color,0.35)};background:linear-gradient(${hexToRgba(color,0.18)},${hexToRgba(color,0.10)}),var(--surface);color:var(--text);min-height:48px`;
    el.title = `${camp.title||'Campagne'} · ${fmtDate(camp.startDate)}${camp.endDate&&camp.endDate!==camp.startDate?' → '+fmtDate(camp.endDate):''}${actions.length?` · ${actions.length} action${actions.length>1?'s':''}`:''}`;

    let html = `<div class="campaign-card-header" style="min-height:32px;padding:5px 8px;flex-direction:column;align-items:flex-start;gap:1px;">
      <div style="display:flex;align-items:center;gap:4px;width:100%">
        ${atteinte?`<span class="campaign-star">★</span>`:''}
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px;font-weight:700">${esc(camp.title||'Campagne')}</span>
      </div>
      <div style="font-size:9.5px;color:var(--text3);font-weight:500">${fmtDate(camp.startDate)}${camp.endDate&&camp.endDate!==camp.startDate?` → ${fmtDate(camp.endDate)}`:''}</div>
    </div>`;
    
    if(STATE.displayOpts.showKpi && prog!==null) {
      const pct = Math.min(prog,100);
      const fillCls = prog>=100?'green':'red';
      const overAmt = prog>100 ? `+${prog-100}%` : `${prog}%`;
      html += `<div class="campaign-card-kpi" style="padding:3px 8px 5px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="kpi-label" style="font-size:9px;opacity:0.75">${esc(camp.kpi?.type||'')}</div>
          <div style="font-size:9px;font-weight:700;color:${prog>=100?'#047857':'#e11d48'}">${overAmt}</div>
        </div>
        <div class="progress-bar" style="margin-top:2px"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>
      </div>`;
    }
    
    html += expandedHtml;
    el.innerHTML = html;
    
    // Click on card: if narrow → open readable popup, else toggle expand
    el.onclick = (ev) => {
      ev.stopPropagation();
      // If clicking on an action row toggle
      const actionRow = ev.target.closest('.action-expand-row');
      if(actionRow) {
        const aid = actionRow.dataset.aid;
        if(STATE.expandedActions.has(aid)) STATE.expandedActions.delete(aid);
        else STATE.expandedActions.add(aid);
        renderTimeline();
        return;
      }
      // If card is too narrow to read (< 120px), open a full popup
      if(w < 120) {
        openCampaignPopup(camp);
        return;
      }
      if(STATE.expandedCampaigns.has(camp.id)) STATE.expandedCampaigns.delete(camp.id);
      else STATE.expandedCampaigns.add(camp.id);
      renderTimeline();
    };
    el.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if(STATE.isAdmin) openCampaignModal(camp);
    });
    
    cell.appendChild(el);
  });
  
  // Total row height: sum of all level heights + spacing
  let totalRowH = 56;
  if(placed.length > 0) {
    totalRowH = 8;
    for(let l=0; l<placed.length; l++) totalRowH += (levelHeights[l]||48) + 6;
    totalRowH += 8;
  }
  row.style.minHeight = totalRowH+'px';
  lbl.style.minHeight = totalRowH+'px';
  cell.style.minHeight = totalRowH+'px';
  
  root.appendChild(row);
}

// ═══════════════════════════════════════════════════════════════
// CANAL VIEW
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// CANAL VIEW — div-based architecture (mirrors Timeline: sticky
// header rows + sticky label column + absolute-positioned content
// inside a single relative grid-cell per row). This guarantees
// uniform week columns, continuous vertical grid lines on every
// row, and lets overlapping bubbles stack freely without ever
// being artificially split.
// ═══════════════════════════════════════════════════════════════
function renderCanalView() {
  const d = data();
  const root = document.getElementById('canal-scroll-root');
  root.innerHTML = '';

  const grid = GRID || buildGrid(STATE.currentYear, STATE.activeScale);
  const isMonth = grid.scale === 'month';
  const totalPx = grid.totalDays * grid.dayPx;
  const today = new Date();
  const todayDay = Math.round((today - grid.start)/864e5);
  const DAY_NAMES = ['Di','Lu','Ma','Me','Je','Ve','Sa'];

  // ── HEADER ROWS (sticky top, same dayPx scale as Timeline) ──
  const scaleLabel = grid.scale==='q' ? ` · T${STATE.selectedQuarter||1}` :
                     isMonth ? ` · ${grid.months[STATE.selectedMonth||0]?.label||''}` : '';
  const labelTitle = 'Canal' + scaleLabel;

  function buildCvHeaderRow(id, stickyTop, labelText, cells) {
    const row = ce('div','canal-header-row');
    row.id = id;
    row.style.top = stickyTop + 'px';
    row.style.width = (150 + totalPx) + 'px';
    const lbl = ce('div','cv-label-col');
    lbl.textContent = labelText || '';
    row.appendChild(lbl);
    const cellsWrap = ce('div','header-cells');
    cellsWrap.style.width = totalPx + 'px';
    cells.forEach(c => cellsWrap.appendChild(c));
    row.appendChild(cellsWrap);
    return row;
  }

  // Q row
  const qCells = grid.quarters.map(q => {
    const days = Math.round((q.end - q.start)/864e5) + 1;
    const cls = 'canal-week-cell' + (grid.scale!=='year' ? (q.inRange ? '' : '') : '');
    const c = ce('div', cls);
    c.style.width = (days*grid.dayPx) + 'px';
    c.textContent = q.label;
    if(grid.scale==='q') c.style.opacity = q.inRange ? '1' : '0.5';
    return c;
  });
  const cvQRow = buildCvHeaderRow('cv-hrow-q', 0, labelTitle, qCells);
  addTodayFlag(cvQRow, grid);
  root.appendChild(cvQRow);

  // M row
  const mCells = grid.months.map(m => {
    const c = ce('div','canal-week-cell');
    c.style.width = (m.days*grid.dayPx) + 'px';
    c.textContent = m.label.toUpperCase();
    if(grid.scale!=='year') c.style.opacity = m.inRange ? '1' : '0.5';
    return c;
  });
  root.appendChild(buildCvHeaderRow('cv-hrow-m', 22, '', mCells));

  // W row (or D row in month view)
  if(isMonth) {
    const dCells = [];
    let dd = new Date(grid.start);
    for(let i=0; i<grid.totalDays; i++) {
      const isT = i===todayDay;
      const isWE = dd.getDay()===0||dd.getDay()===6;
      const c = ce('div','canal-day-cell'+(isWE?' weekend':''));
      c.style.width = grid.dayPx+'px';
      if(isT) c.style.background = 'rgba(84,216,156,0.2)';
      c.innerHTML = `<span style="font-weight:700">${dd.getDate()}</span><span style="opacity:0.6;font-size:8px">${DAY_NAMES[dd.getDay()]}</span>`;
      dCells.push(c);
      dd = addDays(dd,1);
    }
    root.appendChild(buildCvHeaderRow('cv-hrow-w', 44, '', dCells));
  } else {
    const wCells = grid.weeks.map(w => {
      const isT = todayDay>=w.startDay && todayDay<w.startDay+w.days;
      const c = ce('div','canal-week-cell' + (isT?' today-col':''));
      c.style.width = (w.days*grid.dayPx)+'px';
      if(w.days*grid.dayPx > 14) c.textContent = w.label;
      if(grid.scale!=='year') c.style.opacity = w.inRange ? '1' : '0.5';
      return c;
    });
    root.appendChild(buildCvHeaderRow('cv-hrow-w', 44, '', wCells));
  }

  // ── DATA ROWS ──
  const milestoneCxs = (d.milestones||[])
    .map(m => dateToX(m.date, grid) + grid.dayPx/2)
    .filter(cx => cx >= 0 && cx <= totalPx);

  function buildBgStripes(cellEl) {
    grid.months.forEach(m => {
      const stripe = ce('div','cv-week-stripe');
      stripe.style.left = (m.startDay*grid.dayPx)+'px';
      stripe.style.width = (m.days*grid.dayPx)+'px';
      cellEl.appendChild(stripe);
    });
    if(isMonth) {
      for(let i=0;i<grid.totalDays;i++) {
        const dt = addDays(grid.start, i);
        if(dt.getDay()===0||dt.getDay()===6) {
          const s = ce('div','cv-week-stripe weekend');
          s.style.left = (i*grid.dayPx)+'px';
          s.style.width = grid.dayPx+'px';
          cellEl.appendChild(s);
        }
      }
    }
    if(todayDay>=0 && todayDay<grid.totalDays) {
      const s = ce('div','cv-week-stripe');
      s.style.left = (todayDay*grid.dayPx)+'px';
      s.style.width = grid.dayPx+'px';
      s.style.background = 'transparent';
      s.style.borderLeft = '2px solid var(--today)';
      s.style.opacity = '1';
      s.style.zIndex = '4';
      s.style.boxShadow = '2px 0 0 rgba(22,163,74,0.35)';
      s.style.zIndex = '3';
      cellEl.appendChild(s);
    }
    milestoneCxs.forEach(cx => {
      const line = ce('div','milestone-dash-line');
      line.style.left = cx+'px';
      cellEl.appendChild(line);
    });
  }

  function makeDataRow(extraCls, labelHtml, minH) {
    const row = ce('div','cv-data-row'+(extraCls?' '+extraCls:''));
    row.style.width = (150 + totalPx) + 'px';
    if(minH) row.style.minHeight = minH+'px';
    const lbl = ce('div','cv-label-col');
    lbl.innerHTML = labelHtml;
    row.appendChild(lbl);
    const cell = ce('div','cv-grid-cell');
    cell.style.width = totalPx + 'px';
    buildBgStripes(cell);
    row.appendChild(cell);
    return { row, lbl, cell };
  }

  // ── EVENTS ROW (Saisonnalité) ──
  if(STATE.displayOpts.showSeason) {
    const { row, lbl, cell } = makeDataRow('cv-season-row', '<span>🗓</span><span>Événements</span>', 44);
    // Sticky season row below header (66px year view, 98px month view)
    row.style.top = (grid.scale === 'month' ? 98 : 66) + 'px';

    // Greedy period placement.
    const periods = d.periods||[];
    const pLevels = [];
    const PERIOD_ROW2 = 22, P_GAP2 = 2;
    periods.forEach(p => {
      const x1 = dateToX(p.start, grid);
      const w = durationToPx(p.start, p.end, grid);
      if(x1 > totalPx || x1+w < 0) return;
      let level = 0;
      while(pLevels[level] !== undefined && pLevels[level] > x1) level++;
      pLevels[level] = x1 + w;
      const el = ce('div','cv-period-pill');
      el.style.cssText = `left:${x1}px;width:${Math.max(20,w)}px;top:${4+level*(PERIOD_ROW2+P_GAP2)}px;background:${p.color||'#94a3b8'};color:${isContrastDark(p.color||'#94a3b8')?'#000':'#fff'}`;
      el.textContent = p.title;
      el.title = `${esc(p.title)} (${fmtDate(p.start)} → ${fmtDate(p.end)})`;
      el.onclick = () => openPeriodModal(p, !STATE.isAdmin);
      if(STATE.isAdmin) el.addEventListener('contextmenu', ev => { ev.preventDefault(); openPeriodModal(p); });
      cell.appendChild(el);
    });

    // Greedy milestone placement below periods.
    const MS_ICON2 = 26, MS_GAP2 = 4, MS_ROW2 = MS_ICON2 + MS_GAP2;
    const mLevels2 = [];
    const msPlaced2 = [];
    const msSorted2 = (d.milestones||[]).slice()
      .map(m => ({ m, cx: dateToX(m.date, grid) + grid.dayPx/2 }))
      .filter(x => x.cx >= 0 && x.cx <= totalPx)
      .sort((a,b) => a.cx - b.cx);
    msSorted2.forEach(({m, cx}) => {
      const leftEdge = cx - MS_ICON2/2 - 2;
      const rightEdge = cx + MS_ICON2/2 + 2;
      let level = 0;
      while(mLevels2[level] !== undefined && mLevels2[level] > leftEdge) level++;
      mLevels2[level] = rightEdge;
      msPlaced2.push({m, cx, level});
    });
    const msTopBase = 4 + pLevels.length * (PERIOD_ROW2 + P_GAP2);
    msPlaced2.forEach(({m, cx, level}) => {
      const top = msTopBase + level * MS_ROW2;
      const el = ce('div','milestone-marker');
      el.style.left = cx+'px';
      el.style.top = top + 'px';
      const icon = ce('div','milestone-icon', m.icon||'📌');
      icon.title = `${m.title} (${fmtDate(m.date)})`;
      el.appendChild(icon);
      el.onclick = () => openMilestoneModal(m, !STATE.isAdmin);
      cell.appendChild(el);
    });

    const msH2 = mLevels2.length ? (mLevels2.length - 1) * MS_ROW2 + MS_ICON2 : 0;
    const seasonH = Math.max(44, 8 + pLevels.length * (PERIOD_ROW2 + P_GAP2) + msH2 + 4);
    row.style.minHeight = seasonH+'px';
    lbl.style.minHeight = seasonH+'px';
    cell.style.minHeight = seasonH+'px';
    root.appendChild(row);
  }

  // ── CHANNEL ROWS ──
  let channels = d.channels || [];
  if(STATE.filters.channels.length) channels = channels.filter(c=>STATE.filters.channels.includes(c.id));

  channels.forEach(channel => {
    const labelHtml = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(channel.name)}</span>` +
      (STATE.isAdmin ? `<button class="row-add-btn" title="Nouvelle action" onclick="openActionModal(null,null,'${channel.id}')">＋</button>` : '');
    const { row, lbl, cell } = makeDataRow('', labelHtml, 36);

    const channelActions = (d.actions||[]).filter(a => a.channelId === channel.id && actionMatchesSearch(a, d));

    // ── PASS 1: assign levels & compute each pill's height ──
    const PILL_H_COLLAPSED = 26;
    const PILL_SPACING = 4;
    const placed = []; // right-edge x per level
    const levelHeights = []; // tallest pill height per level
    const pillData = [];

    channelActions.forEach(action => {
      const aStart = action.startDate||action.date;
      const aEnd = action.endDate||action.date||action.startDate;
      if(!aStart) return;
      const x1 = dateToX(aStart, grid);
      const w = durationToPx(aStart, aEnd, grid);
      if(x1 > totalPx || x1+w < 0) return;
      let level = 0;
      while(placed[level] !== undefined && placed[level] > x1) level++;
      placed[level] = x1 + w;

      const isOpen = STATE.expandedActions.has(action.id);
      let pillH = PILL_H_COLLAPSED;
      if(isOpen) {
        pillH = 44; // header + date line
        if(action.imageData) pillH += 230;
        pillH += (action.kpis||[]).length * 24;
        if(!action.imageData && !(action.kpis||[]).length) pillH += 18;
      }
      if(!levelHeights[level] || levelHeights[level] < pillH) levelHeights[level] = pillH;
      pillData.push({ action, x1, w, level, pillH });
    });

    // ── PASS 2: render each pill at its correct top offset ──
    pillData.forEach(({ action, x1, w, level, pillH }) => {
      let top = 4;
      for(let l = 0; l < level; l++) top += (levelHeights[l]||PILL_H_COLLAPSED) + PILL_SPACING;
      const pill = appendActionPillAbs(cell, action, d, x1, w, top);
      pill.style.minHeight = pillH+'px';
    });

    // Row height = sum of all level heights + spacing
    let rowH = 36;
    if(levelHeights.length) {
      rowH = 8;
      for(let l = 0; l < levelHeights.length; l++) rowH += (levelHeights[l]||PILL_H_COLLAPSED) + PILL_SPACING;
      rowH += 4;
    }
    row.style.minHeight = rowH+'px';
    lbl.style.minHeight = rowH+'px';
    cell.style.minHeight = rowH+'px';
    root.appendChild(row);
  });

  // Scroll to focus period (mirrors Timeline behavior)
  if(grid.scale !== 'year') {
    requestAnimationFrame(() => {
      root.scrollLeft = Math.max(0, grid.focusStartDay * grid.dayPx - 20);
    });
  }
}

// Helper: absolutely-positioned action pill for the Canal view
function appendActionPillAbs(cell, action, d, x1, w, top) {
  const camp = (d.campaigns||[]).find(c=>c.id===action.campaignId);
  const color = camp ? (camp.color||'#54D89C') : '#94a3b8';
  const achieved = (action.kpis||[]).some(k=>k.objectif && Number(k.realise||0)>=Number(k.objectif));
  const dateStr = fmtDate(action.startDate||action.date);
  const endDateStr = action.endDate && action.endDate !== (action.startDate||action.date) ? fmtDate(action.endDate) : null;
  const isOpen = STATE.expandedActions.has(action.id);

  const pill = ce('div','cv-action-pill'+(isOpen?' cv-action-pill-open':''));
  pill.style.left = x1+'px';
  const pillW = isOpen ? Math.max(220, w) : Math.max(60, w);
  pill.style.width = pillW+'px';
  pill.style.top = top+'px';
  pill.style.borderLeftColor = color;

  let html = `
    <div style="display:flex;align-items:flex-start;gap:4px">
      <div style="flex:1;min-width:0">
        <div class="cap-campaign" style="color:${color};font-size:9px;font-weight:700;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${camp?.title||'–'}</div>
        <div class="cap-title" style="font-size:11px;font-weight:600;font-family:var(--font-head);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:${isOpen?'normal':'nowrap'};margin-top:1px">${achieved?'<span style="color:var(--star)">★</span> ':''}${esc(action.title||'Action')}</div>
      </div>
      <span class="cv-expand-toggle" data-aid="${action.id}" style="cursor:pointer;opacity:0.6;font-size:11px;flex-shrink:0;padding:1px 3px" title="${isOpen?'Réduire':'Déplier'}">${isOpen?'▾':'▸'}</span>
    </div>
    <div class="cap-date" style="font-size:9px;color:var(--text3);margin-top:1px;display:${isOpen?'block':'none'}">${dateStr}${endDateStr?` → ${endDateStr}`:''}</div>`;

  if(isOpen) {
    html += `<div style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px">`;
    if(action.imageData) {
      html += `<img src="${safeImgSrc(action.imageData)}" class="clickable-img" style="width:100%;height:auto;max-height:220px;object-fit:contain;border-radius:4px;display:block;margin-bottom:4px;" onclick="event.stopPropagation();openImageLightbox('${safeImgSrc(action.imageData)}')" alt="">`;
    }
    (action.kpis||[]).forEach(k => {
      if(!k.type) return;
      const pct = k.objectif ? Math.round(Number(k.realise||0)/Number(k.objectif)*100) : null;
      html += `<div style="margin-bottom:3px">
        <div style="display:flex;justify-content:space-between;font-size:10px">
          <span style="color:var(--text3)">${k.type}</span>
          <span style="font-weight:700;color:${pct>=100?'var(--success)':'var(--danger)'}">${k.realise||0}/${k.objectif||'–'}${pct!==null?` (${pct}%)`:''}</span>
        </div>
        ${pct!==null?`<div style="height:3px;background:var(--border);border-radius:2px;margin-top:1px"><div style="height:100%;width:${Math.min(pct,100)}%;background:${pct>=100?'var(--success)':'var(--danger)'};border-radius:2px"></div></div>`:''}
      </div>`;
    });
    if(!action.imageData && !(action.kpis||[]).length) {
      html += `<div style="font-size:10px;color:var(--text3)">Aucun détail supplémentaire</div>`;
    }
    html += `</div>`;
  }

  pill.innerHTML = html;

  const toggle = pill.querySelector('.cv-expand-toggle');
  toggle.onclick = (ev) => {
    ev.stopPropagation();
    if(STATE.expandedActions.has(action.id)) STATE.expandedActions.delete(action.id);
    else STATE.expandedActions.add(action.id);
    render();
  };

  if(!isOpen) {
    pill.addEventListener('mouseenter', () => { pill.querySelector('.cap-date').style.display = 'block'; if(action.imageData) showTooltipImg2(pill, action); });
    pill.addEventListener('mouseleave', () => { pill.querySelector('.cap-date').style.display = 'none'; hideTooltip(); });
  }
  pill.onclick = (ev) => {
    if(ev.target === toggle) return;
    openActionDetailModal(action);
  };
  cell.appendChild(pill);

  // Return the actual height so the caller can size the row correctly
  return pill;
}
function showTooltipImg2(el, action) {
  if(!action.imageData) return;
  const rect = el.getBoundingClientRect();
  const fakeEvent = { clientX: rect.left, clientY: rect.bottom };
  showTooltipImg(fakeEvent, action);
}

function openImageLightbox(src) {
  if(!src) return;
  openImageLightboxSet([src], 0);
}
// Multi-image lightbox with prev/next navigation (arrow keys + on-screen buttons).
function openImageLightboxSet(images, startIdx) {
  const list = (images || []).filter(Boolean);
  if(!list.length) return;
  let idx = Math.max(0, Math.min(startIdx||0, list.length-1));

  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';

  const img = document.createElement('img');
  img.className = 'lightbox-img';
  img.alt = 'Image en grand';

  const counter = document.createElement('div');
  counter.style.cssText = 'position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.4);padding:4px 10px;border-radius:12px;font-size:12px;font-family:var(--font-head);pointer-events:none';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'lightbox-close';
  prevBtn.innerHTML = '‹';
  prevBtn.setAttribute('aria-label', 'Précédent');
  prevBtn.style.cssText = 'left:16px;right:auto;font-size:28px;line-height:1';

  const nextBtn = document.createElement('button');
  nextBtn.className = 'lightbox-close';
  nextBtn.innerHTML = '›';
  nextBtn.setAttribute('aria-label', 'Suivant');
  nextBtn.style.cssText = 'left:auto;right:64px;font-size:28px;line-height:1';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'lightbox-close';
  closeBtn.innerHTML = '✕';
  closeBtn.setAttribute('aria-label', 'Fermer');

  function refresh() {
    img.src = safeImgSrc(list[idx]);
    counter.textContent = `${idx+1} / ${list.length}`;
    prevBtn.style.display = list.length>1 ? '' : 'none';
    nextBtn.style.display = list.length>1 ? '' : 'none';
    counter.style.display = list.length>1 ? '' : 'none';
  }
  refresh();

  overlay.appendChild(img);
  overlay.appendChild(counter);
  overlay.appendChild(prevBtn);
  overlay.appendChild(nextBtn);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  function close() {
    overlay.classList.add('lb-closing');
    overlay.style.animation = 'lb-fade-in 0.12s ease reverse';
    img.style.animation = 'lb-zoom-in 0.12s ease reverse';
    setTimeout(() => { if(overlay.parentNode) document.body.removeChild(overlay); }, 120);
    document.removeEventListener('keydown', onKey);
  }
  function next(){ idx = (idx+1) % list.length; refresh(); }
  function prev(){ idx = (idx-1+list.length) % list.length; refresh(); }
  closeBtn.onclick = (e) => { e.stopPropagation(); close(); };
  prevBtn.onclick = (e) => { e.stopPropagation(); prev(); };
  nextBtn.onclick = (e) => { e.stopPropagation(); next(); };
  overlay.onclick = close;
  img.onclick = (e) => { e.stopPropagation(); next(); };
  const onKey = (e) => {
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowRight') next();
    else if(e.key === 'ArrowLeft') prev();
  };
  document.addEventListener('keydown', onKey);
}
// Called from inline onclick handlers rendered in HTML — resolves the current
// action's image set and opens the gallery at the clicked thumbnail.
window.openActionImageGallery = function(actionId, startIdx) {
  const d = data();
  const a = (d.actions||[]).find(x => x.id === actionId);
  if(!a) return;
  openImageLightboxSet(getActionImages(a), startIdx||0);
};

            <input type="date" class="a-start" data-aid="${a.id}" value="${a.startDate||a.date||''}" style="width:100%;padding:4px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:11px">

          <div class="a-end-wrap" data-aid="${a.id}" style="flex:1;min-width:120px;display:${a.endDate&&a.endDate!==a.startDate?'block':'none'}">
            <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:2px">DATE FIN</label>
            <input type="date" class="a-end" data-aid="${a.id}" value="${a.endDate||''}" style="width:100%;padding:4px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:11px">
          </div>
        </div>
        <div style="margin-bottom:6px">
          <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:2px">VISUEL</label>
          <div style="display:flex;align-items:center;gap:8px">
            ${a.imageData?`<img src="${safeImgSrc(a.imageData)}" style="height:40px;border-radius:4px;object-fit:cover">`:'' }
            <input type="file" class="a-image" data-aid="${a.id}" accept="image/*" style="font-size:11px">
          </div>
        </div>
        <div>
          <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px">KPI DE L'ACTION</label>
          <div class="kpi-rows" data-aid="${a.id}">${kpiRows}</div>
          <button class="btn add-kpi" data-aid="${a.id}" data-chid="${chId}" style="font-size:10px;margin-top:2px">+ KPI</button>
        </div>
      </div>`;
  }

  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${isNew?'Nouvelle carte stratégique':'Modifier la campagne'}</div>
      <button class="btn-icon close-btn" style="color:#fff;border-color:rgba(255,255,255,.3)">✕</button>
    </div>
    <div class="modal-body" style="padding:16px">
      <div style="background:var(--bg2);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:11px;color:var(--text3)">
        ℹ Canaux, actions et KPI modifiables à tout moment.
      </div>
      <div class="form-grid" style="margin-bottom:10px">
        <div class="form-row">
          <label>Type</label>
          <select id="cf-strat">
            <option value="acquisition" ${camp.type==='acquisition'?'selected':''}>Acquisition</option>
            <option value="fidelisation" ${camp.type==='fidelisation'?'selected':''}>Fidélisation</option>
            <option value="reglementaire" ${camp.type==='reglementaire'?'selected':''}>Réglementaire</option>
          </select>
        </div>
        <div class="form-row">
          <label>Nom *</label>
          <input type="text" id="cf-title" value="${escAttr(camp.title||'')}" placeholder="Ex : Offre Printemps">
        </div>
      </div>
      <div class="form-grid" style="margin-bottom:10px">
        <div class="form-row">
          <label>Début</label>
          <input type="date" id="cf-start" value="${camp.startDate||''}">
        </div>
        <div class="form-row">
          <label>Fin</label>
          <input type="date" id="cf-end" value="${camp.endDate||''}">
        </div>
      </div>
      <div class="form-row" style="margin-bottom:14px">
        <label>Couleur personnalisée</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="color" id="cf-color" value="${camp.color||'#54D89C'}" style="width:100%;height:36px;border-radius:6px;cursor:pointer;border:1px solid var(--border2)">
        </div>
        <div class="color-swatch-row" id="cf-swatches">
          ${d.campaignColors.map(c=>{
            const legendEntry = (d.colorLegend||[]).find(e=>e.hex.toLowerCase()===c.toLowerCase());
            return `<div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px">
              <div class="color-swatch${camp.color===c?' selected':''}" style="background:${c}" data-color="${c}" title="${escAttr(legendEntry?legendEntry.label:c)}"></div>
              ${legendEntry?`<span style="font-size:9px;color:var(--text3);max-width:48px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${legendEntry.label}</span>`:''}
            </div>`;
          }).join('')}
        </div>
        <div id="cf-new-color-wrap" style="margin-top:10px;padding:10px;border:1px dashed var(--border2);border-radius:8px">
          <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">+ Nouvelle couleur avec catégorie</div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="color" id="cf-new-color-picker" value="#6366f1" style="width:36px;height:32px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);padding:2px">
            <input type="text" id="cf-new-color-label" placeholder="Libellé (ex : Offre commerciale)" style="flex:1;padding:6px 8px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
            <button class="btn" id="btn-add-color-with-label" type="button">+ Ajouter</button>
          </div>
        </div>
      </div>
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;font-family:var(--font-head)">KPI DE LA CAMPAGNE (GLOBAL)</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:2;min-width:120px">
            <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:2px">TYPE</label>
            <select id="cf-kpi-type" style="width:100%;padding:6px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
              <option value="">-- Aucun --</option>
              ${d.kpiCampaignTypes.map(t=>`<option value="${escAttr(t)}" ${(camp.kpi?.type)===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div style="flex:1;min-width:80px">
            <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:2px">OBJECTIF</label>
            <input type="number" id="cf-kpi-obj" value="${camp.kpi?.objectif||''}" style="width:100%;padding:6px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
          </div>
          <div style="flex:1;min-width:80px">
            <label style="font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:2px">RÉALISÉ</label>
            <input type="number" id="cf-kpi-real" value="${camp.kpi?.realise||''}" style="width:100%;padding:6px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
          </div>
        </div>
      </div>
      <div style="font-size:12px;font-weight:700;font-family:var(--font-head);margin-bottom:8px">Canaux &amp; actions</div>
      <div id="cf-channels">${buildChannelSections()}</div>
    </div>
    <div class="modal-footer">
      ${!isNew?`<button class="btn danger" id="btn-delete-camp">🗑 Supprimer</button>`:''}
      <button class="btn" id="btn-cancel-camp">Annuler</button>
      <button class="btn active" id="btn-save-camp">✓ Valider</button>
    </div>`;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  // Color swatches
  function refreshSwatches() {
    const wrap = document.getElementById('cf-swatches');
    wrap.innerHTML = d.campaignColors.map(c=>{
      const legendEntry = (d.colorLegend||[]).find(e=>e.hex.toLowerCase()===c.toLowerCase());
      const isSel = document.getElementById('cf-color').value.toLowerCase() === c.toLowerCase();
      return `<div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px">
        <div class="color-swatch${isSel?' selected':''}" style="background:${c}" data-color="${c}" title="${escAttr(legendEntry?legendEntry.label:c)}"></div>
        ${legendEntry?`<span style="font-size:9px;color:var(--text3);max-width:48px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${legendEntry.label}</span>`:''}
      </div>`;
    }).join('');
    bindSwatchClicks();
  }

  function bindSwatchClicks() {
    modal.querySelectorAll('.color-swatch').forEach(sw => {
      sw.onclick = () => {
        modal.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
        sw.classList.add('selected');
        document.getElementById('cf-color').value = sw.dataset.color;
      };
    });
  }
  bindSwatchClicks();

  document.getElementById('btn-add-color-with-label').onclick = () => {
    const hex = document.getElementById('cf-new-color-picker').value;
    const label = document.getElementById('cf-new-color-label').value.trim();
    if(!label) { toast('Merci de renseigner un libellé pour cette couleur'); return; }
    if(!d.campaignColors.some(c=>c.toLowerCase()===hex.toLowerCase())) {
      d.campaignColors.push(hex);
    }
    if(!d.colorLegend) d.colorLegend = [];
    const existingEntry = d.colorLegend.find(e=>e.hex.toLowerCase()===hex.toLowerCase());
    if(existingEntry) existingEntry.label = label;
    else d.colorLegend.push({ hex, label });
    save();
    document.getElementById('cf-color').value = hex;
    document.getElementById('cf-new-color-label').value = '';
    refreshSwatches();
    toast('Couleur et catégorie ajoutées');
  };

  function rebuildChannels() {
    document.getElementById('cf-channels').innerHTML = buildChannelSections();
    bindChannelEvents();
  }

  function bindChannelEvents() {
    // Channel header toggle
    modal.querySelectorAll('.cf-channel-header').forEach(hdr => {
      hdr.onclick = (ev) => {
        if(ev.target.type==='checkbox') return;
        const chid = hdr.closest('.cf-channel-block').dataset.chid;
        const body = hdr.nextElementSibling;
        const check = hdr.querySelector('.cf-ch-check');
        const open = body.style.display==='block';
        body.style.display = open?'none':'block';
        hdr.querySelector('.cf-ch-toggle').textContent = open?'▸':'▾';
        hdr.style.background = open?'var(--bg2)':'rgba(84,216,156,0.1)';
        hdr.closest('.cf-channel-block').style.borderColor = open?'var(--border)':'var(--brand-green)';
        check.checked = !open;
      };
    });

    // Checkboxes
    modal.querySelectorAll('.cf-ch-check').forEach(cb => {
      cb.onchange = () => {
        const chid = cb.dataset.chid;
        const block = cb.closest('.cf-channel-block');
        const body = block.querySelector('.cf-channel-body');
        body.style.display = cb.checked?'block':'none';
        block.style.borderColor = cb.checked?'var(--brand-green)':'var(--border)';
        block.querySelector('.cf-ch-toggle').textContent = cb.checked?'▾':'▸';
        block.querySelector('.cf-channel-header').style.background = cb.checked?'rgba(84,216,156,0.1)':'var(--bg2)';
      };
    });

    // Date type toggle per action
    modal.querySelectorAll('.a-datetype').forEach(sel => {
      sel.onchange = () => {
        const aid = sel.dataset.aid;
        const wrap = modal.querySelector(`.a-end-wrap[data-aid="${aid}"]`);
        if(wrap) wrap.style.display = sel.value==='range'?'block':'none';
      };
    });

    // Image upload
    modal.querySelectorAll('.a-image').forEach(inp => {
      inp.onchange = function() {
        const aid = this.dataset.aid;
        const file = this.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          const a = campActions.find(x=>x.id===aid);
          if(a) {
            a.imageData = e.target.result;
            if(!Array.isArray(a.imageDatas)) a.imageDatas = [];
            a.imageDatas[0] = e.target.result;
          }
        };
        reader.readAsDataURL(file);
      };
    });

    // Add action button
    modal.querySelectorAll('[data-add-action]').forEach(btn => {
      btn.onclick = () => {
        const chid = btn.dataset.addAction;
        const newA = {id:uid(), channelId:chid, campaignId:camp.id, title:'', kpis:[], startDate:'', endDate:''};
        campActions.push(newA);
        rebuildChannels();
        // Scroll to new action
        setTimeout(() => btn.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
      };
    });

    // Delete action
    modal.querySelectorAll('.del-action').forEach(btn => {
      btn.onclick = () => {
        campActions = campActions.filter(a=>a.id!==btn.dataset.aid);
        rebuildChannels();
      };
    });

    // Add KPI
    modal.querySelectorAll('.add-kpi').forEach(btn => {
      btn.onclick = () => {
        const a = campActions.find(x=>x.id===btn.dataset.aid);
        const ch = d.channels.find(c=>c.id===btn.dataset.chid);
        if(a) { a.kpis.push({type:ch?.kpis?.[0]||d.kpiCampaignTypes[0]||'',objectif:'',realise:''}); rebuildChannels(); }
      };
    });

    // Delete KPI
    modal.querySelectorAll('.del-kpi').forEach(btn => {
      btn.onclick = () => {
        const a = campActions.find(x=>x.id===btn.dataset.aid);
        if(a) { a.kpis.splice(parseInt(btn.dataset.ki),1); rebuildChannels(); }
      };
    });

    // Live-update action fields
    modal.querySelectorAll('.a-title').forEach(inp => { inp.oninput = e => { const a=campActions.find(x=>x.id===inp.dataset.aid); if(a) a.title=e.target.value; }; });
    modal.querySelectorAll('.a-start').forEach(inp => { inp.onchange = e => { const a=campActions.find(x=>x.id===inp.dataset.aid); if(a){a.startDate=e.target.value;a.date=e.target.value;} }; });
    modal.querySelectorAll('.a-end').forEach(inp => { inp.onchange = e => { const a=campActions.find(x=>x.id===inp.dataset.aid); if(a) a.endDate=e.target.value; }; });
    modal.querySelectorAll('.a-kpi-type').forEach(sel => { sel.onchange = e => { const a=campActions.find(x=>x.id===sel.dataset.aid); if(a&&a.kpis[sel.dataset.ki]) a.kpis[sel.dataset.ki].type=e.target.value; }; });
    modal.querySelectorAll('.a-kpi-obj').forEach(inp => { inp.oninput = e => { const a=campActions.find(x=>x.id===inp.dataset.aid); if(a&&a.kpis[inp.dataset.ki]) a.kpis[inp.dataset.ki].objectif=e.target.value; }; });
    modal.querySelectorAll('.a-kpi-real').forEach(inp => { inp.oninput = e => { const a=campActions.find(x=>x.id===inp.dataset.aid); if(a&&a.kpis[inp.dataset.ki]) a.kpis[inp.dataset.ki].realise=e.target.value; }; });
  }
  bindChannelEvents();

  function close() { document.body.removeChild(overlay); }
  modal.querySelector('.close-btn').onclick = close;
  document.getElementById('btn-cancel-camp').onclick = close;
  overlay.onclick = ev => { if(ev.target===overlay) close(); };

  document.getElementById('btn-save-camp').onclick = () => {
    const title = document.getElementById('cf-title').value.trim();
    if(!title) { alert('Le titre est obligatoire'); return; }
    camp.title = title;
    camp.type = document.getElementById('cf-strat').value;
    camp.startDate = document.getElementById('cf-start').value;
    camp.endDate = document.getElementById('cf-end').value;
    camp.color = document.getElementById('cf-color').value;
    camp.kpi = {
      type: document.getElementById('cf-kpi-type').value,
      objectif: document.getElementById('cf-kpi-obj').value,
      realise: document.getElementById('cf-kpi-real').value
    };

    if(isNew) d.campaigns.push(camp);
    else {
      const idx = d.campaigns.findIndex(c=>c.id===camp.id);
      if(idx>=0) d.campaigns[idx] = camp;
    }

    // Sync actions: remove old ones for this campaign, add new ones
    d.actions = (d.actions||[]).filter(a=>a.campaignId!==camp.id);
    campActions.forEach(a => { a.campaignId = camp.id; d.actions.push(a); });

    save(); close(); render();
    toast(isNew?'Campagne créée':'Campagne mise à jour');
    try { logAudit(isNew?'campaign.create':'campaign.update', camp.title||'Campagne'); } catch(e){}
  };

  if(!isNew) {
    document.getElementById('btn-delete-camp').onclick = () => {
      if(!confirm(`Supprimer la campagne "${esc(camp.title)}" ?`)) return;
      const t = camp.title||'Campagne';
      d.campaigns = d.campaigns.filter(c=>c.id!==camp.id);
      d.actions = (d.actions||[]).filter(a=>a.campaignId!==camp.id);
      save(); close(); render();
      toast('Campagne supprimée');
      try { logAudit('campaign.delete', t); } catch(e){}
    };
  }
}

// ═══════════════════════════════════════════════════════════════
// CAMPAIGN POPUP — for narrow cards
// ═══════════════════════════════════════════════════════════════
function openCampaignPopup(camp) {
  const d = data();
  const atteinte = campaignAtteinte(camp);
  const prog = getProgress(camp);
  const actions = (d.actions||[]).filter(a=>a.campaignId===camp.id);
  const color = camp.color||'#54D89C';

  const overlay = ce('div','modal-overlay');
  const modal = ce('div','modal');

  let actionsHtml = '';
  if(actions.length) {
    const byChannel = {};
    actions.forEach(a => {
      const ch = (d.channels.find(c=>c.id===a.channelId)||{}).name||'–';
      if(!byChannel[ch]) byChannel[ch]=[];
      byChannel[ch].push(a);
    });
    actionsHtml = Object.entries(byChannel).map(([ch, acts]) => `
      <div style="margin-bottom:10px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.4px;margin-bottom:4px;border-left:3px solid ${color};padding-left:6px">${ch}</div>
        ${acts.map(a => {
          const kpiHtml = (a.kpis||[]).map(k => {
            const pct = k.objectif?Math.round(Number(k.realise||0)/Number(k.objectif)*100):null;
            return `<span style="font-size:10px;font-weight:700;color:${pct>=100?'var(--success)':'var(--danger)'}">${k.type}: ${k.realise||0}/${k.objectif||'–'}${pct!==null?` (${pct}%)`:''}</span>`;
          }).join(' · ');
          return `<div style="padding:6px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);margin-bottom:4px">
            ${a.imageData?`<img src="${safeImgSrc(a.imageData)}" style="max-width:100%;max-height:60px;object-fit:contain;border-radius:4px;margin-bottom:4px;display:block;cursor:zoom-in" onclick="event.stopPropagation();openImageLightbox('${safeImgSrc(a.imageData)}')" alt="">` : ''}
            <div style="font-weight:600;font-size:12px">${esc(a.title||'Action')}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px">${fmtDate(a.startDate||a.date)}${a.endDate&&a.endDate!==(a.startDate||a.date)?` → ${fmtDate(a.endDate)}`:''}</div>
            ${kpiHtml?`<div style="margin-top:4px">${kpiHtml}</div>`:''}
          </div>`;
        }).join('')}
      </div>`).join('');
  }

  modal.innerHTML = `
    <div class="modal-header" style="background:${color};border-color:${color}">
      <div class="modal-title" style="color:${isContrastDark(color)?'#002828':'#fff'}">${atteinte?'★ ':''}${esc(camp.title||'Campagne')}</div>
      <button class="btn-icon close-btn" style="border-color:rgba(255,255,255,.4);color:#fff">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase">Dates</div>
          <div style="font-weight:600">${fmtDate(camp.startDate)} → ${fmtDate(camp.endDate||camp.startDate)}</div></div>
        <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase">Type</div>
          <div style="font-weight:600">${camp.campaignType||camp.type||'–'}</div></div>
      </div>
      ${prog!==null?`<div style="background:var(--bg2);border-radius:8px;padding:10px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:11px;font-weight:600">${camp.kpi?.type||'KPI'}</span>
          <span style="font-size:11px;font-weight:700;color:${prog>=100?'var(--success)':'var(--danger)'}">${prog}%${prog>100?` (+${prog-100}%)`:''}${atteinte?' ★':''}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill ${prog>=100?'green':'red'}" style="width:${Math.min(prog,100)}%"></div></div>
        <div style="font-size:10px;color:var(--text3);margin-top:4px">${camp.kpi?.realise||0} / ${camp.kpi?.objectif||0}</div>
      </div>`:''}
      ${actionsHtml || '<div style="color:var(--text3);font-size:12px">Aucune action</div>'}
    </div>
    <div class="modal-footer">
      ${STATE.isAdmin?`<button class="btn" id="popup-edit-btn">✏ Modifier</button>`:''}
      <button class="btn active" id="popup-close-btn">Fermer</button>
    </div>`;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  modal.querySelector('.close-btn').onclick = close;
  document.getElementById('popup-close-btn').onclick = close;
  overlay.onclick = ev => { if(ev.target===overlay) close(); };
  if(STATE.isAdmin) {
    document.getElementById('popup-edit-btn').onclick = () => { close(); openCampaignModal(camp); };
  }
}
function openActionModalWithReturn(existing, campaignId, onClose) {
  openActionModal(existing, campaignId, null, onClose);
}

function openActionModal(existing, campaignId, channelId, onCloseCallback) {
  const d = data();
  const isNew = !existing;
  const action = existing ? {...existing, kpis:[...(existing.kpis||[])]} : {
    id:uid(), campaignId:campaignId||'', channelId:channelId||'', kpis:[]
  };
  
  const overlay = ce('div','modal-overlay');
  const modal = ce('div','modal');
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${isNew?'Nouvelle action':'Modifier l\'action'}</div>
      <button class="btn-icon close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Titre *</label>
        <input type="text" id="af-title" value="${esc(action.title||'')}" placeholder="Nom de l'action">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Canal *</label>
          <select id="af-channel">
            <option value="">-- Choisir --</option>
            ${d.channels.map(c=>`<option value="${c.id}" ${action.channelId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <label>Campagne</label>
          <select id="af-campaign">
            <option value="">-- Aucune --</option>
            ${(d.campaigns||[]).map(c=>`<option value="${c.id}" ${action.campaignId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Type de date</label>
        <select id="af-datetype">
          <option value="single" ${!action.endDate?'selected':''}>Date unique</option>
          <option value="range" ${action.endDate?'selected':''}>Période</option>
        </select>
      </div>
      <div class="form-grid" id="af-dates">
        <div class="form-row">
          <label>Date début</label>
          <input type="date" id="af-start" value="${action.startDate||action.date||''}">
        </div>
        <div class="form-row" id="af-end-wrap">
          <label>Date fin</label>
          <input type="date" id="af-end" value="${action.endDate||''}">
        </div>
      </div>
      <div class="form-row">
        <label>Images (jusqu'à ${MAX_ACTION_IMAGES}) — cliquez sur une vignette pour la supprimer</label>
        <input type="file" id="af-image" accept="image/*" multiple style="display:none">
        <button type="button" class="btn" id="af-image-btn" style="align-self:flex-start">＋ Ajouter des images</button>
        <div id="af-image-thumbs" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">KPI</label>
        <div id="kpi-list"></div>
        <button class="btn" id="btn-add-kpi" style="margin-top:6px">+ KPI</button>
      </div>
    </div>
    <div class="modal-footer">
      ${!isNew?`<button class="btn danger" id="btn-delete-action">🗑</button>`:''}
      <button class="btn" id="btn-cancel-act">Annuler</button>
      <button class="btn active" id="btn-save-act">Enregistrer</button>
    </div>`;
  
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  
  // Date type toggle
  const afDatetype = document.getElementById('af-datetype');
  const afEndWrap = document.getElementById('af-end-wrap');
  afEndWrap.style.display = afDatetype.value==='range'?'':'none';
  afDatetype.onchange = () => { afEndWrap.style.display = afDatetype.value==='range'?'':'none'; };
  
  // Images (multi, up to MAX_ACTION_IMAGES). Migrates legacy `imageData` into
  // `imageDatas` on the working copy; the field is written back on save.
  if(!Array.isArray(action.imageDatas)) {
    action.imageDatas = action.imageData ? [action.imageData] : [];
  } else if(action.imageData && !action.imageDatas.includes(action.imageData)) {
    action.imageDatas = [action.imageData, ...action.imageDatas];
  }
  action.imageDatas = action.imageDatas.slice(0, MAX_ACTION_IMAGES);

  function refreshImageThumbs() {
    const wrap = document.getElementById('af-image-thumbs');
    if(!wrap) return;
    wrap.innerHTML = '';
    action.imageDatas.forEach((src, i) => {
      const t = document.createElement('div');
      t.style.cssText = 'position:relative;width:80px;height:60px;border-radius:4px;overflow:hidden;border:1px solid var(--border);cursor:pointer';
      t.innerHTML = `<img src="${safeImgSrc(src)}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);color:#fff;opacity:0;transition:opacity 0.15s;font-size:18px" class="thumb-x">✕</div>`;
      t.onmouseenter = () => t.querySelector('.thumb-x').style.opacity = '1';
      t.onmouseleave = () => t.querySelector('.thumb-x').style.opacity = '0';
      t.title = 'Cliquer pour supprimer cette image';
      t.onclick = () => { action.imageDatas.splice(i, 1); refreshImageThumbs(); };
      wrap.appendChild(t);
    });
  }
  refreshImageThumbs();

  const afImage = document.getElementById('af-image');
  const afImageBtn = document.getElementById('af-image-btn');
  if(afImageBtn) afImageBtn.onclick = () => {
    if(action.imageDatas.length >= MAX_ACTION_IMAGES) {
      toast(`Maximum ${MAX_ACTION_IMAGES} images — supprimez-en une avant d'ajouter`);
      return;
    }
    afImage.value = '';
    afImage.click();
  };
  afImage.addEventListener('change', function() {
    const files = Array.from(this.files || []);
    if(!files.length) return;
    const remaining = MAX_ACTION_IMAGES - action.imageDatas.length;
    if(remaining <= 0) {
      toast(`Maximum ${MAX_ACTION_IMAGES} images`);
      this.value = '';
      return;
    }
    const toRead = files.slice(0, remaining);
    if(files.length > remaining) toast(`Seules ${remaining} images ajoutées (max ${MAX_ACTION_IMAGES})`);
    let done = 0;
    toRead.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        action.imageDatas.push(e.target.result);
        done++;
        if(done === toRead.length) { refreshImageThumbs(); }
      };
      reader.onerror = () => { done++; if(done === toRead.length) refreshImageThumbs(); toast('Erreur lecture image'); };
      reader.readAsDataURL(file);
    });
    this.value = '';
  });
  
  // KPI list
  function refreshKpiList() {
    const kl = document.getElementById('kpi-list');
    kl.innerHTML = '';
    action.kpis.forEach((k,i) => {
      // Get channel KPIs
      const chId = document.getElementById('af-channel').value;
      const ch = d.channels.find(c=>c.id===chId);
      const kpiOptions = ch?.kpis||d.kpiCampaignTypes;
      
      const row = ce('div','');
      row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;align-items:center';
      row.innerHTML = `
        <select style="flex:1.5;padding:5px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
          ${kpiOptions.map(opt=>`<option value="${opt}" ${k.type===opt?'selected':''}>${opt}</option>`).join('')}
        </select>
        <input type="number" placeholder="Objectif" value="${k.objectif||''}" style="width:80px;padding:5px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
        <input type="number" placeholder="Réalisé" value="${k.realise||''}" style="width:80px;padding:5px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
        <button class="btn-icon" style="color:var(--danger)">✕</button>`;
      row.querySelectorAll('select')[0].onchange = e => { action.kpis[i].type = e.target.value; };
      row.querySelectorAll('input')[0].oninput = e => { action.kpis[i].objectif = e.target.value; };
      row.querySelectorAll('input')[1].oninput = e => { action.kpis[i].realise = e.target.value; };
      row.querySelector('.btn-icon').onclick = () => { action.kpis.splice(i,1); refreshKpiList(); };
      kl.appendChild(row);
    });
  }
  refreshKpiList();
  
  document.getElementById('btn-add-kpi').onclick = () => {
    const chId = document.getElementById('af-channel').value;
    const ch = d.channels.find(c=>c.id===chId);
    const firstKpi = ch?.kpis?.[0]||d.kpiCampaignTypes[0]||'';
    action.kpis.push({type:firstKpi,objectif:'',realise:''});
    refreshKpiList();
  };
  
  document.getElementById('af-channel').onchange = refreshKpiList;
  
  function close() { document.body.removeChild(overlay); if(onCloseCallback) onCloseCallback(); }
  function closeNoReturn() { document.body.removeChild(overlay); }
  modal.querySelector('.close-btn').onclick = closeNoReturn;
  document.getElementById('btn-cancel-act').onclick = closeNoReturn;
  overlay.onclick = ev => { if(ev.target===overlay) closeNoReturn(); };
  
  document.getElementById('btn-save-act').onclick = () => {
    const title = document.getElementById('af-title').value.trim();
    if(!title) { alert('Le titre est obligatoire'); return; }
    action.title = title;
    action.channelId = document.getElementById('af-channel').value;
    action.campaignId = document.getElementById('af-campaign').value;
    const dt = document.getElementById('af-datetype').value;
    if(dt==='single') {
      action.date = document.getElementById('af-start').value;
      action.startDate = action.date;
      action.endDate = action.date;
    } else {
      action.startDate = document.getElementById('af-start').value;
      action.endDate = document.getElementById('af-end').value;
      action.date = action.startDate;
    }
    
    // Keep legacy `imageData` in sync with the first image so existing views
    // that read `action.imageData` (canal pill, tooltips, campaign popup)
    // keep working without a migration.
    action.imageDatas = (Array.isArray(action.imageDatas) ? action.imageDatas : []).filter(Boolean).slice(0, MAX_ACTION_IMAGES);
    action.imageData = action.imageDatas[0] || null;

    if(!d.actions) d.actions = [];
    if(isNew) d.actions.push(action);
    else {
      const idx = d.actions.findIndex(a=>a.id===action.id);
      if(idx>=0) d.actions[idx] = action;
    }
    save(); render();
    toast(isNew?'Action créée':'Action mise à jour');
    try { logAudit(isNew?'action.create':'action.update', action.title||'Action'); } catch(e){}
    close(); // triggers onCloseCallback if set
  };
  
  if(!isNew) {
    document.getElementById('btn-delete-action').onclick = () => {
      if(!confirm('Supprimer cette action ?')) return;
      const t = action.title||'Action';
      d.actions = d.actions.filter(a=>a.id!==action.id);
      save(); render();
      toast('Action supprimée');
      try { logAudit('action.delete', t); } catch(e){}
      close();
    };
  }
}

// ACTION DETAIL MODAL (READ-ONLY or EDIT)
// ═══════════════════════════════════════════════════════════════
function openActionDetailModal(action) {
  const d = data();
  const channel = d.channels.find(c=>c.id===action.channelId);
  const camp = (d.campaigns||[]).find(c=>c.id===action.campaignId);
  
  const overlay = ce('div','modal-overlay');
  const modal = ce('div','modal');
  
  let kpiHtml = '';
  (action.kpis||[]).forEach(k => {
    const pct = k.objectif ? Math.round(Number(k.realise||0)/Number(k.objectif)*100) : null;
    kpiHtml += `<div class="kpi-card">
      <div class="kpi-title">${k.type}</div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <div class="kpi-value">${k.realise||0}</div>
        <div class="kpi-sub">/ ${k.objectif||0}</div>
        ${pct!==null?`<div class="kpi-sub" style="color:${pct>=100?'var(--success)':'var(--danger)'};font-weight:700">${pct}%${pct>100?` (+${pct-100}%)`:''}  ${pct>=100?'★':''}</div>`:''}
      </div>
      ${pct!==null?`<div class="progress-bar" style="margin-top:4px"><div class="progress-fill ${pct>=100?'green':'red'}" style="width:${Math.min(pct,100)}%"></div></div>`:''}
    </div>`;
  });
  
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${esc(action.title||'Action')}</div>
      <button class="btn-icon close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap">
        <div style="flex:1">
          <div style="font-size:11px;color:var(--text3);margin-bottom:2px">CANAL</div>
          <div style="font-weight:600">${channel?.name||'–'}</div>
        </div>
        <div style="flex:1">
          <div style="font-size:11px;color:var(--text3);margin-bottom:2px">CAMPAGNE</div>
          <div style="font-weight:600">${camp?.title||'–'}</div>
        </div>
        <div style="flex:1">
          <div style="font-size:11px;color:var(--text3);margin-bottom:2px">DATES</div>
          <div style="font-weight:600">${fmtDate(action.startDate||action.date)}${action.endDate&&action.endDate!==(action.startDate||action.date)?` → ${fmtDate(action.endDate)}`:''}</div>
        </div>
      </div>
      ${(() => {
        const imgs = getActionImages(action);
        if(!imgs.length) return '';
        if(imgs.length === 1) {
          return `<img src="${safeImgSrc(imgs[0])}" class="clickable-img" style="max-width:100%;max-height:320px;object-fit:contain;border-radius:6px;margin-bottom:14px;border:1px solid var(--border);display:block" onclick="openActionImageGallery('${action.id}',0)" alt="Aperçu de l'action">`;
        }
        return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">` +
          imgs.map((src,i) => `<img src="${safeImgSrc(src)}" class="clickable-img" style="width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in" onclick="openActionImageGallery('${action.id}',${i})" alt="Image ${i+1}">`).join('') +
          `</div>`;
      })()}
      ${kpiHtml||'<div style="color:var(--text3);font-size:12px">Aucun KPI défini</div>'}
    </div>
    <div class="modal-footer">
      ${STATE.isAdmin?`<button class="btn" id="btn-edit-action">✏ Modifier</button>`:''}
      <button class="btn" id="btn-close-detail">Fermer</button>
    </div>`;
  
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  
  function close() { document.body.removeChild(overlay); }
  modal.querySelector('.close-btn').onclick = close;
  document.getElementById('btn-close-detail').onclick = close;
  overlay.onclick = ev => { if(ev.target===overlay) close(); };
  
  if(STATE.isAdmin) {
    document.getElementById('btn-edit-action').onclick = () => { close(); openActionModal(action); };
  }
}

function openMilestoneModal(existing, readOnly) {
  const d = data();
