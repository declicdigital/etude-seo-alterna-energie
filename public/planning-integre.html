  const ml = existing ? {...existing} : {id:uid(), title:'', date:'', icon:'📌'};

  if(readOnly) {
    const overlay = ce('div','modal-overlay');
    const modal = ce('div','modal');
    modal.innerHTML = `<div class="modal-header"><div class="modal-title">${esc(ml.icon||'📌')} ${esc(ml.title)}</div><button class="btn-icon close-btn">✕</button></div>
    <div class="modal-body"><p style="color:var(--text2)">${fmtDate(ml.date)}</p></div>
    <div class="modal-footer"><button class="btn" id="btn-ok">Fermer</button></div>`;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    const close = () => document.body.removeChild(overlay);
    modal.querySelector('.close-btn').onclick = close;
    document.getElementById('btn-ok').onclick = close;
    overlay.onclick = ev => { if(ev.target===overlay) close(); };
    return;
  }
  
  const overlay = ce('div','modal-overlay');
  const modal = ce('div','modal');
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${isNew?'Nouveau jalon':'Modifier le jalon'}</div>
      <button class="btn-icon close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>Titre *</label><input type="text" id="ml-title" value="${escAttr(ml.title||'')}"></div>
      <div class="form-row"><label>Date *</label><input type="date" id="ml-date" value="${ml.date||''}"></div>
      <div class="form-row">
        <label>Pictogramme</label>
        <select id="ml-icon">
          ${d.pictograms.map(p=>`<option value="${p}" ${ml.icon===p?'selected':''}>${p} ${p}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-footer">
      ${!isNew?`<button class="btn danger" id="btn-del-ml">🗑</button>`:''}
      <button class="btn" id="btn-cancel-ml">Annuler</button>
      <button class="btn active" id="btn-save-ml">Enregistrer</button>
    </div>`;
  
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  
  function close() { document.body.removeChild(overlay); }
  modal.querySelector('.close-btn').onclick = close;
  document.getElementById('btn-cancel-ml').onclick = close;
  overlay.onclick = ev => { if(ev.target===overlay) close(); };
  
  document.getElementById('btn-save-ml').onclick = () => {
    ml.title = document.getElementById('ml-title').value.trim();
    ml.date = document.getElementById('ml-date').value;
    ml.icon = document.getElementById('ml-icon').value;
    if(!ml.title||!ml.date) { alert('Titre et date obligatoires'); return; }
    if(!d.milestones) d.milestones = [];
    if(isNew) d.milestones.push(ml);
    else { const i=d.milestones.findIndex(m=>m.id===ml.id); if(i>=0) d.milestones[i]=ml; }
    save(); close(); render(); toast(isNew?'Jalon créé':'Jalon mis à jour');
    try { logAudit(isNew?'milestone.create':'milestone.update', ml.title||'Jalon'); } catch(e){}
  };
  
  if(!isNew) {
    document.getElementById('btn-del-ml').onclick = () => {
      if(!confirm('Supprimer ce jalon ?')) return;
      const t = ml.title||'Jalon';
      d.milestones = d.milestones.filter(m=>m.id!==ml.id);
      save(); close(); render(); toast('Jalon supprimé');
      try { logAudit('milestone.delete', t); } catch(e){}
    };
  }
}

// ADMIN PANEL
// ═══════════════════════════════════════════════════════════════
document.getElementById('btn-admin').addEventListener('click', () => {
  // Admin mode is granted exclusively by cloud auth (see __cloudRewireAdminBtn).
  // The button is hidden for non-admins; if it's ever clicked without cloud admin, do nothing.
  if(STATE.isAdmin) {
    toggleAdminPanel();
  }
});


document.getElementById('btn-quit-admin').addEventListener('click', () => {
  STATE.isAdmin = false;
  document.getElementById('btn-admin').textContent = 'Admin';
  document.getElementById('btn-admin').classList.remove('active');
  document.getElementById('btn-quit-admin').style.display = 'none';
  document.getElementById('admin-panel').classList.remove('open');
  render();
  toast('Mode admin désactivé');
});

document.getElementById('btn-close-admin').addEventListener('click', () => {
  document.getElementById('admin-panel').classList.remove('open');
});

function toggleAdminPanel() {
  const panel = document.getElementById('admin-panel');
  if(panel.classList.contains('open')) {
    panel.classList.remove('open');
  } else {
    panel.classList.add('open');
    renderAdminPanel();
  }
}

function renderAdminPanel() {
  const d = data();
  const body = document.getElementById('admin-body');
  body.innerHTML = '';
  
  // Legacy local admin password section removed — access is controlled by cloud auth.


  
  // Channels
  const s2 = ce('div','admin-section');
  s2.innerHTML = `<h3>Canaux</h3><div id="adm-channels"></div>
    <button class="btn" id="btn-add-channel" style="margin-top:4px">+ Canal</button>`;
  body.appendChild(s2);
  
  function refreshChannels() {
    const el = document.getElementById('adm-channels');
    el.innerHTML = '';
    d.channels.forEach((ch,i) => {
      const row = ce('div','admin-list-item');
      row.innerHTML = `
        <button class="btn-icon" data-mv="-1" data-i="${i}" title="Monter">↑</button>
        <button class="btn-icon" data-mv="1" data-i="${i}" title="Descendre">↓</button>
        <input type="text" value="${esc(ch.name)}">

// EXPORT PDF
// ═══════════════════════════════════════════════════════════════
async function exportPDF() {
  const { jsPDF } = window.jspdf;
  const isCanal = STATE.activeView === 'canal';
  const isSimple = STATE.activeView === 'simple';
  const root = document.getElementById(isSimple ? 'simple-root' : isCanal ? 'canal-scroll-root' : 'timeline-scroll-root');
  if(!root) return;
  toast('Génération du PDF en cours…');
  // Export propre : toute l'année d'un coup, sur une largeur fixe, sans barres de défilement,
  // en mode clair, puis découpée en pages A3 paysage si le planning est très long.
  const prev = { scale: STATE.activeScale, theme: document.documentElement.dataset.theme,
                 style: root.getAttribute('style') || '' };
  const EXPORT_W = 1800;
  try {
    window.__exportWidth = EXPORT_W;
    STATE.activeScale = 'year';
    document.documentElement.dataset.theme = 'light';
    root.style.cssText = prev.style + `;width:${EXPORT_W}px;max-width:none;height:auto;overflow:visible;flex:none`;
    root.classList.add('exporting');
    render();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    root.querySelectorAll('.today-flag').forEach(f => f.style.display = 'none');
    const canvas = await html2canvas(root, {
      scale: 1.5, useCORS: true, backgroundColor: '#ffffff',
      width: EXPORT_W, height: root.scrollHeight,
      windowWidth: EXPORT_W, windowHeight: root.scrollHeight, scrollX: 0, scrollY: 0
    });
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3', compress: true });
    const pageW = 420, pageH = 297, margin = 12, headH = 14;
    const usableW = pageW - margin * 2;
    const usableH = pageH - margin * 2 - headH;
    const mmPerPx = usableW / canvas.width;
    const sliceH = Math.floor(usableH / mmPerPx);
    const pages = Math.max(1, Math.ceil(canvas.height / sliceH));
    const when = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    for(let i = 0; i < pages; i++) {
      if(i) pdf.addPage('a3', 'landscape');
      pdf.setTextColor(14, 116, 144); pdf.setFontSize(9);
      pdf.text('PLANNING INTÉGRÉ · DIGICOM', margin, margin + 3);
      pdf.setTextColor(15, 23, 42); pdf.setFontSize(16);
      pdf.text(`Planning commercial Alterna Énergie — ${STATE.currentYear}${isCanal ? ' (par canal)' : ''}`, margin, margin + 10);
      pdf.setTextColor(100, 116, 139); pdf.setFontSize(9);
      pdf.text(`Exporté le ${when}${pages > 1 ? ` · page ${i + 1}/${pages}` : ''}`, pageW - margin, margin + 10, { align: 'right' });
      const part = document.createElement('canvas');
      const h = Math.min(sliceH, canvas.height - i * sliceH);
      part.width = canvas.width; part.height = h;
      part.getContext('2d').drawImage(canvas, 0, i * sliceH, canvas.width, h, 0, 0, canvas.width, h);
      pdf.addImage(part.toDataURL('image/jpeg', 0.85), 'JPEG', margin, margin + headH, usableW, h * mmPerPx, undefined, 'FAST');
    }
    pdf.save(`planning_${STATE.currentYear}.pdf`);
    toast('PDF téléchargé');
  } catch(e) {
    console.error(e);
    toast('Échec de la génération PDF : ' + (e.message||e));
  } finally {
    window.__exportWidth = 0;
    STATE.activeScale = prev.scale;
    document.documentElement.dataset.theme = prev.theme;
    root.setAttribute('style', prev.style);
    root.classList.remove('exporting');
    render();
  }
}

document.getElementById('btn-export-pdf').addEventListener('click', () => exportPDF());

function renderFilterTags() {
  const el = document.getElementById('filter-tags');
  el.innerHTML = '';
  
  const TYPE_LABELS = { acquisition: '🎯 Acquisition', fidelisation: '💎 Fidélisation', reglementaire: '⚠️ Réglementaire' };
  STATE.filters.types.forEach(t => {
    const tag = ce('div','filter-tag');
    tag.innerHTML = `${esc(TYPE_LABELS[t]||t)} <span class="remove">✕</span>`;
    tag.querySelector('.remove').onclick = () => {
      STATE.filters.types = STATE.filters.types.filter(x=>x!==t);
      renderFilterTags(); render();
    };
    el.appendChild(tag);
  });
  
  STATE.filters.channels.forEach(cid => {
    const ch = data().channels.find(c=>c.id===cid);
    if(!ch) return;
    const tag = ce('div','filter-tag');
    tag.innerHTML = `${esc(ch.name)} <span class="remove">✕</span>`;
    tag.style.background = 'var(--fid)';
    tag.querySelector('.remove').onclick = () => {
      STATE.filters.channels = STATE.filters.channels.filter(x=>x!==cid);
      renderFilterTags(); render();
    };
    el.appendChild(tag);
  });

  (STATE.filters.colors||[]).forEach(hex => {
    const entry = (data().colorLegend||[]).find(e=>e.hex.toLowerCase()===hex.toLowerCase());
    const tag = ce('div','filter-tag');
    tag.style.background = hex;
    tag.style.color = isContrastDark(hex) ? '#000' : '#fff';
    tag.innerHTML = `${esc(entry?entry.label:hex)} <span class="remove">✕</span>`;
    tag.querySelector('.remove').onclick = () => {
      STATE.filters.colors = STATE.filters.colors.filter(x=>x.toLowerCase()!==hex.toLowerCase());
      renderFilterTags(); render();
    };
    el.appendChild(tag);
  });
  
  if(STATE.filters.kpiStatus!=='all') {
    const tag = ce('div','filter-tag');
    tag.style.background = STATE.filters.kpiStatus==='achieved'?'var(--success)':'var(--danger)';
    tag.innerHTML = `${STATE.filters.kpiStatus==='achieved'?'★ Atteint':'✗ Non atteint'} <span class="remove">✕</span>`;
    tag.querySelector('.remove').onclick = () => {
      STATE.filters.kpiStatus = 'all';
      renderFilterTags(); render();
    };
    el.appendChild(tag);
  }
}

// Color legend bar — shown in the filter bar, clickable to filter by color
function renderColorLegend() {
  const el = document.getElementById('color-legend-bar');
  if(!el) return;
  const legend = data().colorLegend || [];
  el.innerHTML = '';
  if(legend.length === 0) return;

  const label = ce('span','');
  label.style.cssText = 'font-size:11px;color:var(--text3);font-weight:600;margin-right:4px';
  label.textContent = 'LÉGENDE :';
  el.appendChild(label);

  legend.forEach(entry => {
    const isActive = (STATE.filters.colors||[]).some(c=>c.toLowerCase()===entry.hex.toLowerCase());
    const chip = ce('button','');
    chip.style.cssText = `display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
      border:1.5px solid ${isActive?entry.hex:'var(--border)'};background:${isActive?entry.hex:'var(--surface)'};
      color:${isActive?(isContrastDark(entry.hex)?'#000':'#fff'):'var(--text2)'};
      font-size:11px;font-weight:600;font-family:var(--font-head);cursor:pointer;transition:all .12s`;
    chip.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${entry.hex};flex-shrink:0;border:1px solid rgba(0,0,0,0.15)"></span>${esc(entry.label)}`;
    chip.title = 'Cliquer pour filtrer les campagnes de cette couleur';
    chip.onclick = () => {
      if(isActive) {
        STATE.filters.colors = (STATE.filters.colors||[]).filter(c=>c.toLowerCase()!==entry.hex.toLowerCase());
      } else {
        STATE.filters.colors = [...(STATE.filters.colors||[]), entry.hex];
      }
      renderColorLegend(); renderFilterTags(); render();
    };
    el.appendChild(chip);
  });
}

// Recherche rapide (barre du haut) : titre de la campagne ou d'une de ses actions.
function searchText() { return (STATE.searchQ || '').trim().toLowerCase(); }
function matchesSearch(camp, d) {
  const q = searchText();
  if(!q) return true;
  if((camp.title||'').toLowerCase().includes(q)) return true;
  return (d.actions||[]).some(a => a.campaignId === camp.id && (a.title||'').toLowerCase().includes(q));
}
function actionMatchesSearch(a, d) {
  const q = searchText();
  if(!q) return true;
  if((a.title||'').toLowerCase().includes(q)) return true;
  const camp = (d.campaigns||[]).find(c => c.id === a.campaignId);
  return !!camp && (camp.title||'').toLowerCase().includes(q);
}

// « Aujourd'hui » : pastille au-dessus du calendrier.
function addTodayFlag(rowEl, grid) {
  const today = new Date();
  if(today.getFullYear() !== grid.year) return;
  const day = Math.round((today - grid.start)/864e5);
  const cells = rowEl.querySelector('.header-cells');
  if(!cells) return;
  cells.style.position = 'relative';
  const f = ce('div','today-flag');
  f.textContent = "Aujourd'hui";
  f.style.left = (day*grid.dayPx + grid.dayPx/2) + 'px';
  cells.appendChild(f);
}
function scrollToToday() {
  const today = new Date();
  const sel = document.getElementById('year-sel');
  if(STATE.currentYear !== today.getFullYear() && STATE.years[today.getFullYear()] && sel) {
    sel.value = String(today.getFullYear());
    sel.dispatchEvent(new Event('change'));
  }
  if(STATE.currentYear === today.getFullYear()) {
    // Trimestre / mois : on affiche celui d'aujourd'hui.
    if(STATE.activeScale === 'q') STATE.selectedQuarter = Math.floor(today.getMonth() / 3) + 1;
    if(STATE.activeScale === 'month') STATE.selectedMonth = today.getMonth();
    if(STATE.activeScale !== 'year') { renderSubSelector(); render(); }
  }
  if(STATE.activeView === 'simple') {
    requestAnimationFrame(() => {
      const col = document.querySelector('.bd-col.now');
      const cols = document.querySelector('.bd-cols');
      if(!col || !cols) { toast("Aujourd'hui n'est pas sur cette période"); return; }
      cols.scrollTo({ left: Math.max(0, col.offsetLeft - 24), behavior: 'smooth' });
      col.classList.remove('pulse'); void col.offsetWidth; col.classList.add('pulse');
    });
    return;
  }
  requestAnimationFrame(() => {
    const root = document.getElementById(STATE.activeView === 'canal' ? 'canal-scroll-root' : 'timeline-scroll-root');
    const grid = GRID;
    if(!root || !grid || today.getFullYear() !== grid.year) { toast("Aujourd'hui n'est pas dans cette année"); return; }
    const x = Math.round((today - grid.start)/864e5) * grid.dayPx;
    if(STATE.activeScale !== 'year') root.scrollTo({ left: Math.max(0, x - root.clientWidth/3), behavior: 'smooth' });
    root.querySelectorAll('.today-flag').forEach(f => { f.classList.remove('today-pulse'); void f.offsetWidth; f.classList.add('today-pulse'); });
  });
}

function renderTimeline() {
  GRID = buildGrid(STATE.currentYear, STATE.activeScale);
  const root = document.getElementById('timeline-scroll-root');
  if(!root) return;
  root.innerHTML = '';
  renderHeader(GRID, root);
  renderTimelineRows(GRID, root);
  // Scroll to focus period (vue Année : tout est visible, on revient au début)
  if(GRID.scale === 'year') root.scrollLeft = 0;
  if(GRID.scale !== 'year') {
    requestAnimationFrame(() => {
      const scrollX = Math.max(0, GRID.focusStartDay * GRID.dayPx - 20);
      root.scrollLeft = scrollX;
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE CLAIRE — une ligne fine par campagne, regroupées par stratégie ;
// un clic ouvre le panneau de détail (actions, KPI, boutons Modifier).
// ═══════════════════════════════════════════════════════════════
const SV_TYPES = [
  { type: 'acquisition',   label: 'Acquisition',   icon: '🎯', color: '#0e7490' },
  { type: 'fidelisation',  label: 'Fidélisation',  icon: '💎', color: '#6d28d9' },
  { type: 'reglementaire', label: 'Réglementaire', icon: '⚠️', color: '#b45309' },
];
const SV_COLLAPSE_KEY = 'planning_sv_collapsed';
function svCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem(SV_COLLAPSE_KEY) || '[]')); } catch(e) { return new Set(); }
}
function svToggleSection(type) {
  const c = svCollapsed();
  c.has(type) ? c.delete(type) : c.add(type);
  try { localStorage.setItem(SV_COLLAPSE_KEY, JSON.stringify([...c])); } catch(e) {}
  renderSimple();
}
let SV_SELECTED = null;

function svRange() {
  const y = STATE.currentYear;
  if(STATE.activeScale === 'q') {
    const q = (STATE.selectedQuarter || 1) - 1;
    return { start: new Date(y, q * 3, 1), end: new Date(y, q * 3 + 3, 0) };
  }
  if(STATE.activeScale === 'month') {
    const m = STATE.selectedMonth != null ? STATE.selectedMonth : 0;
    return { start: new Date(y, m, 1), end: new Date(y, m + 1, 0) };
  }
  return { start: new Date(y, 0, 1), end: new Date(y, 11, 31) };
}

/** Campagnes d'un type après filtres, options d'affichage et recherche. */
function svCampaigns(type) {
  const d = data();
  let list = (d.campaigns || []).filter(c => c.type === type && c.startDate);
  const f = STATE.filters;
  if(f.campaigns.length) list = list.filter(c => f.campaigns.includes(c.id));
  if(f.types.length) list = list.filter(c => f.types.includes(c.type));
  if(f.colors && f.colors.length) list = list.filter(c => f.colors.some(col => col.toLowerCase() === (c.color || '').toLowerCase()));
  if(f.kpiStatus === 'achieved') list = list.filter(campaignAtteinte);
  if(f.kpiStatus === 'unachieved') list = list.filter(c => !campaignAtteinte(c));
  if(!STATE.displayOpts.showAchieved) list = list.filter(c => !campaignAtteinte(c));
  if(!STATE.displayOpts.showUnachieved) list = list.filter(c => campaignAtteinte(c));
  if(f.channels.length) list = list.filter(c => (d.actions || []).some(a => a.campaignId === c.id && f.channels.includes(a.channelId)));
  list = list.filter(c => matchesSearch(c, d));
  return list.sort((a, b) => (parseDate(a.startDate) - parseDate(b.startDate)) || (a.title || '').localeCompare(b.title || ''));
}

/** Tableau mois par mois : une colonne par mois (semaines en vue Mois), des cartes de campagne
 *  avec aperçu des visuels et des actions de la période. */
function svBuckets() {
  const y = STATE.currentYear;
  const { start, end } = svRange();
  const out = [];
  if(STATE.activeScale === 'month') {
    // semaines (lundi → dimanche) qui touchent le mois
    let d0 = new Date(start); d0.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
    while(d0 <= end) {
      const s = d0 < start ? new Date(start) : new Date(d0);
      const e0 = addDays(d0, 6); const e = e0 > end ? new Date(end) : e0;
      out.push({ start: s, end: e, title: `Semaine ${isoWeek(d0)}`, sub: `${s.getDate()} → ${e.getDate()} ${e.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')}` });
      d0 = addDays(d0, 7);
    }
  } else {
    for(let m = start.getMonth(); m <= end.getMonth(); m++) {
      const s = new Date(y, m, 1), e = new Date(y, m + 1, 0);
      const t = s.toLocaleDateString('fr-FR', { month: 'long' });
      out.push({ start: s, end: e, title: t.charAt(0).toUpperCase() + t.slice(1), sub: String(y) });
    }
  }
  return out;
}
function svTypeFilter() { try { return localStorage.getItem('planning_sv_type') || 'all'; } catch(e) { return 'all'; } }
function svSetTypeFilter(t) { try { localStorage.setItem('planning_sv_type', t); } catch(e) {} renderSimple(); }

function renderSimple() {
  const root = document.getElementById('simple-root');
  if(!root) return;
  const d = data();
  const editor = !!STATE.isAdmin;
  const today = new Date(); today.setHours(0,0,0,0);
  const typeF = svTypeFilter();
  const buckets = svBuckets();
  const { start, end } = svRange();
  const prevScroll = root.querySelector('.bd-cols') ? root.querySelector('.bd-cols').scrollLeft : null;

  const typeOf = (t) => SV_TYPES.find(x => x.type === t) || SV_TYPES[0];
  const all = SV_TYPES.filter(t => t.type !== 'reglementaire' || STATE.displayOpts.showRegulatory)
    .flatMap(t => svCampaigns(t.type));
  const counts = { all: 0 };
  SV_TYPES.forEach(t => counts[t.type] = 0);
  const inSpan = all.filter(c => parseDate(c.startDate) <= end && parseDate(c.endDate || c.startDate) >= start);
  inSpan.forEach(c => { counts.all++; counts[c.type] = (counts[c.type] || 0) + 1; });
  const camps = typeF === 'all' ? inSpan : inSpan.filter(c => c.type === typeF);
  const chName = (id) => ((d.channels || []).find(x => x.id === id) || {}).name || '';
  const actsOf = (c, s, e) => (d.actions || []).filter(a => a.campaignId === c.id
      && (!STATE.filters.channels.length || STATE.filters.channels.includes(a.channelId))
      && (() => { const ad = parseDate(a.startDate || a.date); return ad && ad >= s && ad <= e; })())
    .sort((a, b) => parseDate(a.startDate || a.date) - parseDate(b.startDate || b.date));

  const actLine = (a, color) => {
    const ad = parseDate(a.startDate || a.date);
    const img = getActionImages(a)[0];
    const ch = chName(a.channelId);
    return `<div class="bd-act" data-aid="${escAttr(a.id)}" title="${escAttr(`${a.title || 'Action'} · ${fmtDate(a.startDate || a.date)}${ch ? ' · ' + ch : ''}`)}">
      <span class="bd-act-date" style="color:${color};background:${hexToRgba(color, .12)}">${ad.getDate()}</span>
      <span class="bd-act-main"><span class="bd-act-title">${esc(a.title || 'Action')}</span>${ch ? `<span class="bd-act-ch">${esc(ch)}</span>` : ''}</span>
      ${img ? `<img class="bd-act-img" src="${safeImgSrc(img)}" alt="" loading="lazy">` : ''}
    </div>`;
  };

  const card = (c, b, continuing) => {
    const t = typeOf(c.type);
    const color = c.color || t.color;
    const acts = actsOf(c, b.start, b.end);
    const allActs = (d.actions || []).filter(a => a.campaignId === c.id);
    const prog = STATE.displayOpts.showKpi ? getProgress(c) : null;
    const dates = `${fmtDate(c.startDate)}${c.endDate && c.endDate !== c.startDate ? ' → ' + fmtDate(c.endDate) : ''}`;
    const shown = acts.slice(0, continuing ? 3 : 4);
    const more = acts.length - shown.length;
    if(continuing) {
      return `<div class="bd-card bd-cont" data-cid="${escAttr(c.id)}" style="--cc:${color}">
        <div class="bd-cont-head"><span class="bd-dot" style="background:${color}"></span><span class="bd-cont-title">${esc(c.title || 'Campagne')}</span><span class="bd-cont-tag">en cours</span></div>
        ${shown.length ? `<div class="bd-acts">${shown.map(a => actLine(a, color)).join('')}${more > 0 ? `<div class="bd-more">+ ${more} autre${more > 1 ? 's' : ''}</div>` : ''}</div>` : `<div class="bd-cont-sub">jusqu'au ${fmtDate(c.endDate || c.startDate)}</div>`}
      </div>`;
    }
    const imgs = [];
    (acts.length ? acts : allActs).forEach(a => getActionImages(a).forEach(u => { if(imgs.length < 3) imgs.push(u); }));
    const chans = [...new Set(allActs.map(a => chName(a.channelId)).filter(Boolean))];
    return `<div class="bd-card" data-cid="${escAttr(c.id)}" style="--cc:${color}">
      ${imgs.length ? `<div class="bd-imgs n${imgs.length}">${imgs.map(u => `<img src="${safeImgSrc(u)}" alt="" loading="lazy">`).join('')}</div>` : `<div class="bd-band" style="background:linear-gradient(120deg, ${color}, ${hexToRgba(color, .55)})"><span>${t.icon}</span></div>`}
      <div class="bd-body">
        <div class="bd-type" style="color:${t.color}">${t.icon} ${t.label}${c.campaignType ? ' · ' + esc(c.campaignType) : ''}</div>
        <div class="bd-title">${campaignAtteinte(c) ? '★ ' : ''}${esc(c.title || 'Campagne')}</div>
        <div class="bd-dates">📅 ${dates} · ${allActs.length} action${allActs.length > 1 ? 's' : ''}</div>
        ${prog !== null ? `<div class="bd-kpi"><div class="bd-kpi-row"><span>${esc((c.kpi && c.kpi.type) || 'Objectif')}</span><b style="color:${prog >= 100 ? '#047857' : '#be123c'}">${prog} %</b></div><div class="bd-kpi-bar"><div style="width:${Math.min(100, prog)}%;background:${prog >= 100 ? '#10b981' : color}"></div></div></div>` : ''}
        ${chans.length ? `<div class="bd-chans">${chans.slice(0, 4).map(n => `<span>${esc(n)}</span>`).join('')}${chans.length > 4 ? `<span>+${chans.length - 4}</span>` : ''}</div>` : ''}
        ${shown.length ? `<div class="bd-acts">${shown.map(a => actLine(a, color)).join('')}${more > 0 ? `<div class="bd-more">+ ${more} autre${more > 1 ? 's' : ''} ce mois-ci</div>` : ''}</div>` : ''}
      </div>
    </div>`;
  };

  const tabs = [['all', 'Toutes', '🗂']].concat(SV_TYPES.filter(t => t.type !== 'reglementaire' || STATE.displayOpts.showRegulatory).map(t => [t.type, t.label, t.icon]));
  let html = `<div class="bd${STATE.activeScale === 'year' ? '' : ' fit'}">
    <div class="bd-top">
      <div class="bd-tabs">${tabs.map(([k, l, i]) => `<button class="bd-tab${typeF === k ? ' active' : ''}" data-tf="${k}">${i} ${l} <span>${counts[k] || 0}</span></button>`).join('')}</div>
      <div class="bd-hint">Clique sur une carte pour tout voir${editor ? ' et la modifier' : ''}.</div>
    </div>
    <div class="bd-cols">`;
  buckets.forEach((b, i) => {
    const isNow = today >= b.start && today <= b.end;
    const startsHere = camps.filter(c => { const s0 = parseDate(c.startDate); return (s0 >= b.start && s0 <= b.end) || (i === 0 && s0 < b.start && parseDate(c.endDate || c.startDate) >= b.start); });
    const going = camps.filter(c => !startsHere.includes(c) && parseDate(c.startDate) < b.start && parseDate(c.endDate || c.startDate) >= b.start);
    const periods = STATE.displayOpts.showSeason ? (d.periods || []).filter(p => p.start && parseDate(p.start) <= b.end && parseDate(p.end || p.start) >= b.start) : [];
    const ms = STATE.displayOpts.showSeason ? (d.milestones || []).filter(m => m.date && parseDate(m.date) >= b.start && parseDate(m.date) <= b.end) : [];
    html += `<section class="bd-col${isNow ? ' now' : ''}" data-col="${i}">
      <header class="bd-col-head">
        <div><div class="bd-col-title">${esc(b.title)}${isNow ? ' <span class="bd-now">Maintenant</span>' : ''}</div><div class="bd-col-sub">${esc(b.sub)} · ${startsHere.length + going.length} campagne${startsHere.length + going.length > 1 ? 's' : ''}</div></div>
      </header>
      ${periods.length || ms.length ? `<div class="bd-moments">
        ${periods.map(p => `<span class="bd-period" data-pid="${escAttr(p.id)}" style="background:${hexToRgba(p.color || '#64748b', .16)};color:var(--text);box-shadow:inset 3px 0 0 ${p.color || '#64748b'}" title="${escAttr(`${p.title} · ${fmtDate(p.start)} → ${fmtDate(p.end || p.start)}`)}">${esc(p.title || '')}</span>`).join('')}
        ${ms.map(m => `<span class="bd-ms" data-mid="${escAttr(m.id)}" title="${escAttr(m.title || '')}">${esc(m.icon || '📌')} <b>${parseDate(m.date).getDate()}</b> ${esc(m.title || '')}</span>`).join('')}
      </div>` : ''}
      <div class="bd-list">
        ${startsHere.map(c => card(c, b, false)).join('')}
        ${going.length ? `<div class="bd-sep">En cours</div>${going.map(c => card(c, b, true)).join('')}` : ''}

// ═══════════════════════════════════════════════════════════════
// CLOUD SYNC (Lovable Cloud) — auth, shared state, live persistence
// ═══════════════════════════════════════════════════════════════
const CLOUD = (function() {
  // Intégré à Digicom : même base que l'outil, et la session Digicom (même origine) sert de
  // connexion. Ce client ne gère pas lui-même la session : il lit à chaque requête le jeton que
  // Digicom tient à jour, pour ne jamais entrer en conflit avec son rafraîchissement.
  const URL_ = 'https://wbcjhhvowxhscszoviqu.supabase.co';
  const KEY_ = 'sb_publishable_vpTPnvXvF187auoe0m7Vjg_BQcAJxDx';
  const AUTH_KEY = 'sb-wbcjhhvowxhscszoviqu-auth-token';
  function digicomSession() {
    try {
      const s = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      return s && s.access_token && s.user ? s : null;
    } catch (e) { return null; }
  }
  const client = window.supabase.createClient(URL_, KEY_, {
    accessToken: async () => { const s = digicomSession(); return s ? s.access_token : null; }
  });
  let userId = null, userEmail = null, isAdmin = false, saveTimer = null, saving = false, dirty = false;

  async function ensureAuth() {
    let session = digicomSession();
    // Jeton expiré : Digicom le renouvelle juste après l'ouverture, on lui laisse quelques secondes.
    for (let i = 0; i < 25 && session && session.expires_at && session.expires_at * 1000 < Date.now() + 15000; i++) {
      await new Promise(r => setTimeout(r, 200));
      session = digicomSession();
    }
    if (!session) { (window.top || window).location.replace('/auth'); return false; }
    userId = session.user.id; userEmail = session.user.email || '';
    const { data: canEdit } = await client.rpc('can_edit_planning', { _user_id: userId });
    isAdmin = canEdit === true;
    return true;
  }

  // Garde-fou : tant que le planning partagé n'a pas été lu correctement, rien n'est enregistré
  // (sinon une copie locale ancienne ou les exemples pourraient écraser le planning de tous).
  let loaded = false;
  async function loadState() {
    // Pas de copie locale d'une autre session : le planning vient uniquement de la base.
    try { localStorage.removeItem('planning_v3'); } catch(e){}
    const { data, error } = await client.from('planning_state').select('data').eq('id', 1).maybeSingle();
    if (error || !data) { console.warn('cloud load error', error); return; }
    loaded = true;
    const years = (data.data && data.data.years) || {};
    window.__allowSeed = !Object.values(years).some(y => y && (y.campaigns || []).length);
    if (data && data.data && Object.keys(data.data).length) {
      const s = data.data;
      STATE.currentYear = s.currentYear || STATE.currentYear;
      STATE.years = s.years || {};
      STATE.density = s.density || STATE.density;
      STATE.displayOpts = { ...STATE.displayOpts, ...(s.displayOpts || {}) };
      try { localStorage.setItem('planning_v3', JSON.stringify(s)); } catch(e){}
    }
    try { STATE.theme = localStorage.getItem('planning_theme') === 'dark' ? 'dark' : 'light'; } catch(e){ STATE.theme = 'light'; }
  }

  function scheduleSave() {
    if (!loaded) { showStatus('⚠ Planning non chargé : rechargez la page', true); return; }
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 150);
  }

  // Upload a base64 image to storage and return a long-lived link.
  const IMG_CACHE = new Map();
  async function uploadDataUrl(dataUrl) {
    if (IMG_CACHE.has(dataUrl)) return IMG_CACHE.get(dataUrl);
    const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
    if (!m) return dataUrl;
    const mime = m[1];
    const bin = atob(m[2]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ext = (mime.split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '').slice(0, 5);
    const path = `${new Date().getFullYear()}/${crypto.randomUUID()}.${ext}`;
    const up = await client.storage.from('planning-images').upload(path, bytes, { contentType: mime, upsert: false });
    if (up.error) throw up.error;
    const { data, error } = await client.storage.from('planning-images').createSignedUrl(path, 60 * 60 * 24 * 365 * 20);
    if (error) throw error;
    IMG_CACHE.set(dataUrl, data.signedUrl);
    return data.signedUrl;
  }

  // Replace every inline image in the planning with a storage link.
  async function externalizeImages() {
    const jobs = [];
    const walk = (node) => {
      if (!node || typeof node !== 'object') return;
      if (Array.isArray(node)) { node.forEach(walk); return; }
      for (const k of Object.keys(node)) {
        const v = node[k];
        if (typeof v === 'string' && v.startsWith('data:image')) {
          jobs.push(uploadDataUrl(v).then(u => { node[k] = u; }));
        } else if (Array.isArray(v) && (k === 'imageDatas')) {
          v.forEach((s, i) => {
            if (typeof s === 'string' && s.startsWith('data:image')) jobs.push(uploadDataUrl(s).then(u => { v[i] = u; }));
          });
        } else if (v && typeof v === 'object') walk(v);
      }
    };
    walk(STATE.years);
    if (jobs.length) { showStatus('⇪ Envoi des images…'); await Promise.all(jobs); }
  }

  let retries = 0;
  async function flush() {
    if (!dirty || saving) return;
    saving = true; dirty = false;
    let error = null;
    try {
      await externalizeImages();
      const toSave = {
        currentYear: STATE.currentYear,
        years: STATE.years,
        theme: STATE.theme,
        density: STATE.density,
        displayOpts: STATE.displayOpts
      };
      const res = await client.from('planning_state').update({
        data: toSave,
        updated_at: new Date().toISOString(),
        updated_by: userId
      }).eq('id', 1);
      error = res.error;
    } catch (e) { error = e; }
    saving = false;
    if (error) {
      console.warn('cloud save error', error);
      dirty = true;
      retries++;
      if (retries <= 5) {
        showStatus('⟳ Nouvelle tentative de sauvegarde… (' + retries + '/5)', true);
        setTimeout(flush, Math.min(2000 * retries, 10000));
      } else {
        showStatus('⚠ Sauvegarde impossible — vérifiez votre connexion', true);
        alert('⚠ Vos dernières modifications n\'ont pas pu être enregistrées.\nVérifiez votre connexion puis cliquez OK pour réessayer.');
        retries = 0;
        flush();
      }
      return;
    }
    retries = 0;
    showStatus('✓ Enregistré · ' + new Date().toLocaleTimeString('fr-FR'));
    if (dirty) flush();
  }
  window.addEventListener('beforeunload', (e) => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

  function showStatus(msg, err) {
    let el = document.getElementById('cloud-status');
    if (!el) {
      el = document.createElement('span');
      el.id = 'cloud-status';
      el.style.cssText = 'margin-left:8px;font-size:11px;opacity:.8;color:#fff';
      const bar = document.getElementById('logo-meta') || document.getElementById('topbar');
      if (bar) bar.appendChild(el);
    }
    el.style.color = err ? '#e11d48' : 'var(--text3)';
    el.textContent = msg;
  }

  async function signOut() {
    // La déconnexion se fait depuis Digicom.
    (window.top || window).location.replace('/');
  }

  // Live sync: apply remote updates from other users without reloading.
  function subscribeRealtime() {
    client.channel('planning_state_live')
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'planning_state', filter: 'id=eq.1' },
        (payload) => {
          const row = payload.new;
          if (!row || !row.data) return;
          // Ignore our own echoes while a local save is in flight or just applied
          if (saving || dirty) return;
          if (row.updated_by && row.updated_by === userId) return;
          const s = row.data;
          STATE.currentYear = s.currentYear || STATE.currentYear;
          STATE.years = s.years || {};
          STATE.density = s.density || STATE.density;
          STATE.displayOpts = { ...STATE.displayOpts, ...(s.displayOpts || {}) };
          try { localStorage.setItem('planning_v3', JSON.stringify(s)); } catch(e){}
          try { render(); } catch(e){ console.warn(e); }
          showStatus('⟳ Mis à jour · ' + new Date().toLocaleTimeString('fr-FR'));
        })
      .subscribe();
  }

  // Fire-and-forget: writes one audit entry. Silent on failure so a broken
  // network never blocks a user's action.
  async function logAction(actionType, target, year) {
    if(!userId) return;
    try {
      await client.from('planning_audit_log').insert({
        user_id: userId,
        user_email: userEmail || '',
        action_type: String(actionType || '').slice(0, 80),
        target: target ? String(target).slice(0, 240) : null,
        year: (typeof year === 'number' && !isNaN(year)) ? year : (STATE.currentYear || null)
      });
    } catch(e) { console.warn('audit log failed', e); }
  }

  async function fetchAuditLog(limit) {
    const { data, error } = await client
      .from('planning_audit_log')
      .select('user_email, action_type, target, year, created_at')
      .order('created_at', { ascending: false })
      .limit(limit || 200);
    if (error) { console.warn('audit fetch error', error); return []; }
    return data || [];
  }

  async function fetchHistory(year) {
    const { data, error } = await client
      .from('planning_history')
      .select('created_at, created_by_name, snapshot, trigger_action')
      .eq('year', year)
      .order('created_at', { ascending: false })
      .limit(50);
    if (error) { console.warn('history fetch error', error); return []; }
    return (data || []).map(r => ({ ...r, data: r.snapshot || {} }));
  }

  return {
    client, ensureAuth, loadState, scheduleSave, flush, signOut, showStatus, subscribeRealtime,
    logAction, fetchAuditLog, fetchHistory,
    get userId() { return userId; },
    get userEmail() { return userEmail; },
    get isAdmin() { return isAdmin; },
    get loaded() { return loaded; }
  };
})();

// Global convenience wrapper used across the UI. Safe to call even before
// cloud auth has completed — it silently noops in that case.
window.logAudit = function(actionType, target, year) {
  try { CLOUD.logAction(actionType, target, year); } catch(e) {}
};


// Wrap save() so every state change is pushed to the cloud
const __origSave = save;
window.save = function() {
  try { __origSave(); } catch(e) { console.warn(e); }
  CLOUD.scheduleSave();
};

// Inject cloud UI into the topbar (logout + user manager for admins)
function __cloudInjectUI() {
  // Dans Digicom : les comptes et la déconnexion se gèrent depuis l'outil, on affiche juste le mode.
  const parent = document.getElementById('logo-meta');
  if (!parent) return;
  const emailTag = document.createElement('span');
  emailTag.className = 'mode-chip ' + (CLOUD.isAdmin ? 'edit' : 'read');
  emailTag.textContent = CLOUD.isAdmin ? '✎ Modification' : '👁 Lecture seule';
  emailTag.title = CLOUD.userEmail;
  parent.appendChild(emailTag);
}

// If the current user is a cloud admin, enable edit mode automatically and
// expose a single "Configuration" button that opens the admin panel directly
// (no separate "Admin" / "Quitter Admin" toggle required).
function __cloudRewireAdminBtn() {
  if (!CLOUD.isAdmin) return;
  STATE.isAdmin = true;
  const old = document.getElementById('btn-admin');
  if (old) {
    const nu = old.cloneNode(true);
    nu.style.display = '';
    nu.textContent = '🛠 Réglages';
    nu.title = 'Canaux, types, couleurs, pictogrammes…';
    nu.classList.remove('active');
    old.parentNode.replaceChild(nu, old);
    nu.addEventListener('click', () => { toggleAdminPanel(); });
  }
  const qbtn = document.getElementById('btn-quit-admin');
  if (qbtn) qbtn.style.display = 'none';
  svInstallAddMenu();
  // Show the "+ Année" button only for admins (hidden by default in HTML).
  const nyBtn = document.getElementById('btn-new-year');
  if (nyBtn) nyBtn.style.display = '';
  // Show History button for admins.
  const histBtn = document.getElementById('btn-history');
  if (histBtn) { histBtn.style.display = ''; histBtn.onclick = openHistoryModal; }
  try { render(); } catch(e) {}
}

// History modal: list and restore previous versions for the current year. Admin-only.
async function openHistoryModal() {
  const year = STATE.currentYear;
  const overlay = ce('div','modal-overlay');
  const modal = ce('div','modal lg');
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">🕓 Historique — ${esc(String(year))}</div>
      <button class="btn-icon close-btn">✕</button>
    </div>
    <div class="modal-body" id="history-body">
      <div style="color:var(--text3);font-size:12px">Chargement…</div>
    </div>
    <div class="modal-footer"><button class="btn active" id="btn-history-close">Fermer</button></div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const close = () => { if(overlay.parentNode) document.body.removeChild(overlay); };
  modal.querySelector('.close-btn').onclick = close;
  document.getElementById('btn-history-close').onclick = close;
  overlay.onclick = ev => { if(ev.target===overlay) close(); };

  const audits = await CLOUD.fetchAuditLog(300);
  const body = document.getElementById('history-body');
  const filteredAudits = (audits || []).filter(a => !a.year || a.year === year);

  if(!filteredAudits.length) {
    body.innerHTML = `<div style="color:var(--text3);font-size:12px">Aucune activité archivée pour ${esc(String(year))}.</div>`;
    return;
  }

  const rowsHtml = filteredAudits.map((a) => {
    const nature = esc(a.action_type || '—') + (a.target ? ' — ' + esc(a.target) : '');
    return `
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:6px 8px;white-space:nowrap">${new Date(a.created_at).toLocaleString('fr-FR')}</td>
        <td style="padding:6px 8px">${esc(a.user_email || '—')}</td>
        <td style="padding:6px 8px">${nature}</td>
      </tr>`;
  }).join('');

  body.innerHTML = `
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">
      Journal des modifications — année ${esc(String(year))} — ${filteredAudits.length} action(s).
    </div>
    <div style="max-height:60vh;overflow-y:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="background:var(--bg2);text-align:left;position:sticky;top:0">
            <th style="padding:6px 8px">Date</th>
            <th style="padding:6px 8px">Utilisateur</th>
            <th style="padding:6px 8px">Nature de la modification</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}

// Boot: authenticate → load shared state from cloud → run original init → render
(async function boot() {
  if (!window.supabase) { alert('Erreur : librairie cloud non chargée'); return; }
  if (!(await CLOUD.ensureAuth())) return;
  await CLOUD.loadState();
  requestAnimationFrame(() => {
    init();
    // Vue préférée de la personne (la vue claire par défaut).
    try {
      const v = localStorage.getItem('planning_view');
      const b = v && v !== 'simple' && document.querySelector(`[data-view="${v}"]`);
      if(b) b.click();
    } catch(e) {}
    __cloudInjectUI();
    __cloudRewireAdminBtn();
    CLOUD.subscribeRealtime();
    CLOUD.showStatus(CLOUD.loaded ? '✓ Connecté · sync temps réel' : '⚠ Planning non chargé : rechargez la page', !CLOUD.loaded);
    requestAnimationFrame(() => render());
  });

})();
</script>
</body>
</html>
