    for(var i=0;i<12;i++){
      var prev=lbeText;
      lbeText=lbeText.replace(/(\d) (\d)/g,'$1$2').replace(/(\d) \. (\d)/g,'$1.$2').replace(/(\d) (\*)/g,'$1$2');
      if(lbeText===prev) break;
    }
    var lbe=lbeText;
    // Find Prudence kWh: non-starred, in range 0.16-0.185 (base) and 0.17-0.21 (HP) and 0.13-0.16 (HC)
    var items=[]; var reKwh=/0\.[\d]{3,}\*?/g; var mk;
    while((mk=reKwh.exec(lbe))!==null){
      var val=parseFloat(mk[0].replace('*',''));
      var starred=mk[0].indexOf('*')>=0;
      items.push({v:val,star:starred});
    }
    var kwhB=items.filter(function(x){return !x.star&&x.v>0.163&&x.v<0.180;});
    var kwhHP=items.filter(function(x){return !x.star&&x.v>0.17&&isHP(x.v);});
    var kwhHC=items.filter(function(x){return !x.star&&x.v>0.13&&x.v<0.155;});
    if(kwhB.length){
      var lbeBase=Math.max.apply(null,kwhB.map(function(x){return x.v;}));
      var curBase=d['kwh_6_base']||0;
      if(!curBase||Math.abs(lbeBase-0.172)<Math.abs(curBase-0.172))
        KVAS.forEach(function(kk){d['kwh_'+kk+'_base']=lbeBase;});
    }
    if(kwhHP.length&&kwhHC.length){
      var hpV=Math.max.apply(null,kwhHP.map(function(x){return x.v;}));
      var hcV=Math.max.apply(null,kwhHC.map(function(x){return x.v;}));
      KVAS.forEach(function(kk){if(!d['hp_'+kk])d['hp_'+kk]=hpV; if(!d['hc_'+kk])d['hc_'+kk]=hcV;});
    }
    // Abos: find TTC increasing sequence starting >14
    var aboRaw=[]; var reAbo=/[1-9]\d\.[\d]{2,}/g; var maA;
    while((maA=reAbo.exec(lbe))!==null){ var v=parseFloat(maA[0]); if(v>11&&v<80)aboRaw.push(v); }
    var ttcA=[]; var bestLen=0;
    for(var s=0;s<aboRaw.length;s++){
      if(aboRaw[s]<14) continue;
      var seq=[aboRaw[s]];
      for(var ii=s+1;ii<aboRaw.length;ii++){
        if(aboRaw[ii]>seq[seq.length-1]*1.02&&aboRaw[ii]<seq[seq.length-1]*2.0) seq.push(aboRaw[ii]); else break;
      }
      if(seq.length>=6&&seq.length>bestLen){bestLen=seq.length; ttcA=seq;}
    }
    var aboMap=['6','9','12','15','18','24','30','36'];
    ttcA.slice(0,8).forEach(function(v,i){ if(aboMap[i]&&!d['abo_'+aboMap[i]+'_base'])d['abo_'+aboMap[i]+'_base']=v; });
  })();

  // ── Octopus standalone HP/HC post-pass ────────────────────────
  if(d['kwh_6_base']&&!d['hp_6']){
    for(var li=0;li<linesS.length;li++){
      var nv=gnf(linesS[li]);
      if(nv.length===1&&nv[0]>0.19&&isHP(nv[0])&&!d['hp_6']){ KVAS.forEach(function(kk){d['hp_'+kk]=nv[0];}); }
    }
    for(var li=0;li<linesS.length;li++){
      var nv=gnf(linesS[li]);
      if(nv.length===1&&isHC(nv[0])&&!d['hc_6']&&d['hp_6']){ KVAS.forEach(function(kk){d['hc_'+kk]=nv[0];}); break; }
    }
  }

  // ── Primeo TTC section ────────────────────────────────────────
  if(!d['abo_6_base']){
    var idx2=rawNorm.indexOf('Tarif TTC'); if(idx2>=0){
      var ps=rawNorm.substring(idx2); var rePrimeo=/(3|6|9|12|15|18|24|30|36)\s*k[Vv][Aa]\s+([\d.]+)/g; var mp;
      while((mp=rePrimeo.exec(ps))!==null){ var kk=mp[1],abo=parseFloat(mp[2]); if(isAbo(abo)){if(!d['abo_'+kk+'_base'])d['abo_'+kk+'_base']=abo; if(!d['abo_'+kk+'_hc'])d['abo_'+kk+'_hc']=abo;} }
    }
    // Primeo kWh TTC: look for "0.1940" and "0.1927" in TTC section
    if(rawNorm.indexOf('Tarif TTC')>=0){
      var ttcIdx=rawNorm.indexOf('Tarif TTC');
      var ttcSection=rawNorm.substring(ttcIdx);
      // Base kWh: 0.1940 for 3-6kVA, 0.1927 for 9+kVA
      var kwhMatches=ttcSection.match(/0\.[12]\d{3}/g)||[];
      var kwhUniq=[]; kwhMatches.forEach(function(v){ if(kwhUniq.indexOf(v)<0)kwhUniq.push(v); });
      // First unique kWh = base 3-6kVA, second = base 9-36kVA
      if(kwhUniq.length>=1&&isKwh(parseFloat(kwhUniq[0]))){
        var k1=parseFloat(kwhUniq[0]);
        ['3','6'].forEach(function(k){ if(!d['kwh_'+k+'_base'])d['kwh_'+k+'_base']=k1; });
        if(kwhUniq.length>=2&&isKwh(parseFloat(kwhUniq[1]))&&parseFloat(kwhUniq[1])!==k1){
          var k2=parseFloat(kwhUniq[1]);
          ['9','12','15','18','24','30','36'].forEach(function(k){ if(!d['kwh_'+k+'_base'])d['kwh_'+k+'_base']=k2; });
        } else {
          ['9','12','15','18','24','30','36'].forEach(function(k){ if(!d['kwh_'+k+'_base'])d['kwh_'+k+'_base']=k1; });
        }
      }
      // HP/HC: look for HP ~0.2065, HC ~0.1579
      if(!d['hp_6']){
        var hpM=ttcSection.match(/0\.20\d{2}/g); var hcM=ttcSection.match(/0\.1[5-6]\d{2}/g);
        if(hpM) KVAS.forEach(function(k){ if(!d['hp_'+k])d['hp_'+k]=parseFloat(hpM[0]); });
        if(hcM) KVAS.forEach(function(k){ if(!d['hc_'+k])d['hc_'+k]=parseFloat(hcM[hcM.length-1]); });
      }
    }
  }

  console.log('BEFORE_CLEANUP kwh6:', d['kwh_6_base']);
  }

  // ── Final cleanup ─────────────────────────────────────────────
  Object.keys(d).forEach(function(k){
    if(d[k]&&(k.startsWith('kwh_')||k.startsWith('hp_')||k.startsWith('hc_'))&&d[k]>1) d[k]=d[k]/100;
    if(d[k]) d[k]=+d[k].toPrecision(6);
  });
  return d;
}



// ── ALTERNA (gaz): grille nationale par code postal, TTC uniquement ────
// Sépare deux nombres décimaux collés sans espace par l'extraction PDF
// (ex: pdf.js peut produire "0.16820.1231" au lieu de "0.1682 0.1231").
function despacePasteDecimals(text) {
  for (var i = 0; i < 6; i++) {
    var next = text.replace(/(\d+\.\d+)(\d+\.\d+)/g, '$1 $2');
    if (next === text) break;
    text = next;
  }
  return text;
}

// Format: "Mon gaz naturel" + "Tarifs TTC" + lignes "CP NOM_COMMUNE abo_b0 kwh_b0 abo_b1 kwh_b1"
// Pas de zonage dans cette grille : on cible Paris 15e (75015),
// et à défaut on retombe sur la première ligne valide (valeur générique),
// en dupliquant la valeur kWh sur les 6 zones puisqu'il n'existe qu'une seule valeur.
function parseAlternaGas(rawText) {
  if (!/Mon gaz naturel/i.test(rawText)) return null;
  // NB: on cible le vrai en-tête de section TTC ("Tarifs TTC-applicables"),
  // pas la mention "Voir les tarifs TTC" (lien texte) qui apparaît en page 1.
  var ttcIdx = rawText.search(/Tarifs\s+TTC[\s-]*applicables/i);
  if (ttcIdx < 0) return null; // on ne prend que la section TTC, jamais HT
  var section = rawText.substring(ttcIdx);
  var norm = despacePasteDecimals(section.replace(/,/g, '.'));
  var lines = norm.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  var reRow = /^(\d{5})\s+(.+?)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s*$/;
  var parisRow = null, firstRow = null;
  for (var i = 0; i < lines.length; i++) {
    var m = reRow.exec(lines[i]);
    if (!m) continue;
    var cp = m[1];
    var aboB0 = parseFloat(m[3]), kwhB0 = parseFloat(m[4]);
    var aboB1 = parseFloat(m[5]), kwhB1 = parseFloat(m[6]);
    if (!(aboB0 > 5 && aboB0 < 40)) continue;
    if (!(kwhB0 > 0.05 && kwhB0 < 0.30)) continue;
    if (!(aboB1 > 10 && aboB1 < 80)) continue;
    if (!(kwhB1 > 0.03 && kwhB1 < 0.25)) continue;
    var row = { aboB0: aboB0, kwhB0: kwhB0, aboB1: aboB1, kwhB1: kwhB1 };
    if (!firstRow) firstRow = row;
    if (cp === '75015') { parisRow = row; break; }
  }
  var chosen = parisRow || firstRow;
  if (!chosen) return null;
  var result = { g_abo_b0: chosen.aboB0, g_abo_b1: chosen.aboB1 };
  for (var zn = 1; zn <= 6; zn++) {
    result['g_abo_b0_z' + zn] = chosen.aboB0;
    result['g_kwh_b0_z' + zn] = chosen.kwhB0;
    result['g_abo_b1_z' + zn] = chosen.aboB1;
    result['g_kwh_b1_z' + zn] = chosen.kwhB1;
  }
  return result;
}

// ── EDF (gaz): grille "Avantage Gaz" — lignes "Zone N  abo_c1 kwh_c1  abo_c2 kwh_c2  abo_c3 kwh_c3" ──
// CONSO1 (cuisson/eau chaude, <4000 kWh/an) -> mappé sur B0 (conso réf. outil: 2500 kWh/an)
// CONSO3 (chauffage, >11000 kWh/an)         -> mappé sur B1 (conso réf. outil: 13500 kWh/an)
// Les 6 zones de la grille EDF sont toutes extraites (Zone 1 à Zone 6).
function parseEDFGas(rawText) {
  if (!/Avantage\s+Gaz/i.test(rawText)) return null;
  var norm = despacePasteDecimals(rawText.replace(/,/g, '.'));
  var lines = norm.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  var reZone = /^Zone\s*(\d)\b(.*)$/i;
  var zones = {};
  for (var i = 0; i < lines.length; i++) {
    var m = reZone.exec(lines[i]);
    if (!m) continue;
    var zoneNum = parseInt(m[1]);
    if (zoneNum < 1 || zoneNum > 6) continue;
    var nums = (m[2].match(/[\d]+\.[\d]+/g) || []).map(parseFloat);
    if (nums.length < 6) continue;
    zones[zoneNum] = { aboC1: nums[0], kwhC1: nums[1], aboC3: nums[4], kwhC3: nums[5] };
  }
  var z1 = zones[1];
  if (!z1) return null;
  var result = { g_abo_b0: z1.aboC1, g_abo_b1: z1.aboC3 };
  for (var zn = 1; zn <= 6; zn++) {
    var row = zones[zn] || z1; // repli sur Zone1 si une zone est absente de la grille lue
    result['g_abo_b0_z' + zn] = row.aboC1;
    result['g_kwh_b0_z' + zn] = row.kwhC1;
    result['g_abo_b1_z' + zn] = row.aboC3;
    result['g_kwh_b1_z' + zn] = row.kwhC3;
  }
  return result;
}

// ── TOTAL ENERGIES (gaz): grille "T1/T2 x Zone 1-6" indexée sur le PRVG ──
// T1 (cuisson/eau chaude, <4 MWh/an) -> B0 ; T2 (chauffage, ≥4 MWh/an) -> B1.
// Chaque ligne "Zone N  abo_HT abo_TTC kwh_HT kwh_TTC" ; les 6 lignes Zone1-6
// du bloc T1 précèdent les 6 lignes Zone1-6 du bloc T2 dans le document.
//
// Particularité constatée à l'extraction PDF réelle (pdf.js) : la dernière valeur (kWh TTC)
// d'une ligne se retrouve parfois sur sa PROPRE ligne, juste AVANT le label "Zone N" suivant,
// au lieu d'apparaître après le label de sa propre zone (léger décalage vertical de rendu sur
// cette cellule précise). Ex. réel : "...0,1649\n0,1682\nZone 6 9,40 12,70 0,1238" — le 0,1682
// appartient à Zone 6 mais apparaît avant son label. On gère ça par report (carry-over) :
// si une fenêtre de zone contient 5 nombres, le 5e est en fait la valeur de la zone SUIVANTE ;
// si une fenêtre n'en contient que 3, on complète avec la valeur reportée par la zone précédente.
function parseTotalGas(rawText) {
  // NB: on ne dépend pas de la présence littérale de "TotalEnergies" (parfois uniquement dans un
  // logo/image non extractible, ou sur une page qui pourrait manquer) : la combinaison PRVG + T1/T2
  // est spécifique à la page de grille gaz elle-même et donc plus fiable.
  if (!/Prix\s*Rep[eè]re\s*de\s*Vente\s*de\s*Gaz|PRVG/i.test(rawText)) return null;
  if (!/\bT1\b/.test(rawText) || !/\bT2\b/.test(rawText)) return null;
  var norm = despacePasteDecimals(rawText.replace(/,/g, '.'));
  var reZoneG = /Zone\s*(\d)\b/gi;
  var positions = [];
  var mg;
  while ((mg = reZoneG.exec(norm)) !== null) {
    var zn0 = parseInt(mg[1]);
    if (zn0 < 1 || zn0 > 6) continue;
    positions.push({ zone: zn0, start: mg.index, afterIdx: mg.index + mg[0].length });
  }
  if (!positions.length) return null; // vraiment aucune ligne de zone trouvée
  var matches = [];
  var carry = null; // valeur "fuyante" détectée en trop dans la fenêtre précédente
  for (var i = 0; i < positions.length; i++) {
    var chunkEnd = (i + 1 < positions.length) ? positions[i + 1].start : Math.min(norm.length, positions[i].afterIdx + 300);
    var chunk = norm.substring(positions[i].afterIdx, chunkEnd);
    var allNums = (chunk.match(/[\d]+\.[\d]+/g) || []).map(parseFloat);
    var rowNums = null;
    if (allNums.length >= 5) {
      rowNums = allNums.slice(0, 4);
      carry = allNums[4]; // reportée sur la zone suivante
    } else if (allNums.length === 4) {
      rowNums = allNums;
      carry = null;
    } else if (allNums.length === 3 && carry !== null) {
      rowNums = allNums.concat([carry]); // on complète avec la valeur reportée par la zone précédente
      carry = null;
    } else {
      carry = null;
      continue; // impossible à reconstruire de façon fiable pour cette zone
    }
    // rowNums: [abo_HT, abo_TTC, kwh_HT, kwh_TTC]
    matches.push({ zone: positions[i].zone, abo: rowNums[1], kwh: rowNums[3] });
  }
  // Une fois qu'on a confirmé (via PRVG + T1/T2) qu'il s'agit bien d'une grille TotalEnergies,
  // on ne renvoie plus null même si l'extraction est incomplète (pour éviter tout repli silencieux
  // vers un parseur générique d'un autre fournisseur plus bas dans le code) : on travaille avec
  // ce qui a été trouvé, quitte à ce que certaines zones retombent sur la Zone 1 par défaut.
  if (!matches.length) return null;
  // Découpe en blocs consécutifs : un nouveau bloc démarre dès que le n° de zone ne progresse plus.
  var groups = [];
  var current = [];
  for (var j = 0; j < matches.length; j++) {
    if (current.length && matches[j].zone <= current[current.length - 1].zone) {
      groups.push(current);
      current = [];
    }
    current.push(matches[j]);
  }
  if (current.length) groups.push(current);
  var t1 = groups[0];
  var t2 = groups[1] || t1; // repli sur T1 si le bloc T2 (chauffage) est absent
  function findZone(group, zn) {
    for (var k = 0; k < group.length; k++) { if (group[k].zone === zn) return group[k]; }
    return group[0];
  }
  var result = { g_abo_b0: t1[0].abo, g_abo_b1: t2[0].abo };
  for (var zn = 1; zn <= 6; zn++) {
    var rowB0 = findZone(t1, zn);
    var rowB1 = findZone(t2, zn);
    result['g_abo_b0_z' + zn] = rowB0.abo;
    result['g_kwh_b0_z' + zn] = rowB0.kwh;
    result['g_abo_b1_z' + zn] = rowB1.abo;
    result['g_kwh_b1_z' + zn] = rowB1.kwh;
  }
  return result;
}

// ── ENGIE (gaz): grille décomposée Fourniture + Acheminement + Obligations ──
// B0 = tranche "jusqu'à 3999 kWh" (cuisson/eau chaude), B1 = tranche "de 4000 à 29999 kWh" (chauffage).
// Fourniture et Acheminement ne dépendent pas de la zone ; seules les Obligations varient selon
// le "Groupe de communes" (Gr. A à Gr. H). Zone1→6 de l'outil = Groupe A→F.
// La table "Evolution Maximale Obligations" qui suit reprend les mêmes lettres A→H : c'est un
// plafond futur, pas le tarif actuel, donc on ne garde que le premier cycle A→H rencontré.
function parseEngieGas(rawText) {
  if (!/ENGIE/i.test(rawText)) return null;
  if (!/Obligations/i.test(rawText) || !/Acheminement/i.test(rawText) || !/Fourniture/i.test(rawText)) return null;
  if (!/Gr\.?\s*A\b/i.test(rawText)) return null; // confirme la grille "Groupe de communes A à H", propre à Engie
  // NB: "Fourniture" apparaît aussi dans le texte d'intro générique ("cette offre de fourniture"),
  // bien avant la vraie grille tarifaire (page 4) — on isole d'abord la section "Grille tarifaire"
  // pour ne chercher les en-têtes Fourniture/Acheminement/Obligations que dans le vrai tableau.
  var grilleIdx = rawText.search(/Grille\s*tarifaire/i);
  var gridText = grilleIdx >= 0 ? rawText.substring(grilleIdx) : rawText;
  var norm = despacePasteDecimals(gridText.replace(/,/g, '.'));

  // Extrait, pour une section (Fourniture ou Acheminement), les valeurs TTC (abo, kWh) des
  // tranches "jusqu'à 3999 kWh" (band1) et "de 4000 à 29999 kWh" (band2). Les 4 valeurs d'une
  // bande peuvent apparaître dans un ordre différent selon le rendu PDF (ex: kwh avant abo) ;
  // on les distingue donc par grandeur (abo en €/an >= 1, prix kWh en €/kWh < 1) plutôt que
  // par position fixe.
  function pickAbo(nums) { var v = nums.filter(function(x){ return x >= 1; }); return v.length ? Math.max.apply(null, v) : null; }
  function pickKwh(nums) { var v = nums.filter(function(x){ return x < 1; }); return v.length ? Math.max.apply(null, v) : null; }
  function extractSection(sectionText) {
    var m1 = /jusqu.{0,3}3\s*999/i.exec(sectionText);
    var m2 = /de\s*4\s*000/i.exec(sectionText);
    if (!m1 || !m2) return null;
    var band1Nums = (sectionText.substring(m1.index, m2.index).match(/[\d]+\.[\d]+/g) || []).map(parseFloat);
    var band2Nums = (sectionText.substring(m2.index).match(/[\d]+\.[\d]+/g) || []).slice(0, 4).map(parseFloat);
    if (band1Nums.length < 4 || band2Nums.length < 4) return null;
    var abo1 = pickAbo(band1Nums), kwh1 = pickKwh(band1Nums);
    var abo2 = pickAbo(band2Nums), kwh2 = pickKwh(band2Nums);
    if (abo1 === null || kwh1 === null || abo2 === null || kwh2 === null) return null;
    return { abo1: abo1, kwh1: kwh1, abo2: abo2, kwh2: kwh2 };
  }

  var fournIdx = norm.search(/Fourniture/i);
  var achemIdx = norm.search(/Acheminement/i);
  var obligIdx = norm.search(/Obligations/i);
  if (fournIdx < 0 || achemIdx < 0 || obligIdx < 0) return null;
  var fourniture = extractSection(norm.substring(fournIdx, achemIdx));
  var acheminement = extractSection(norm.substring(achemIdx, obligIdx));
  if (!fourniture || !acheminement) return null;

  // Table Obligations : on ignore la position des labels "Gr. X" (ils flottent de façon
  // imprévisible avant ou après leurs propres valeurs selon le rendu PDF) et on se base
  // uniquement sur l'ordre séquentiel des nombres : la table liste toujours les 8 groupes
  // dans l'ordre A→H, à raison de 6 valeurs par groupe (HT/TTC pour les 3 tranches de conso).
  // On s'arrête avant "Evolution Maximale Obligations" (un plafond futur, pas le tarif actuel).
  var evolIdx = norm.search(/Evolution\s*Maximale/i);
  var obligSection = norm.substring(obligIdx, evolIdx >= 0 ? evolIdx : norm.length);
  var obligNums = (obligSection.match(/[\d]+\.[\d]+/g) || []).map(parseFloat);
  if (obligNums.length < 48) return null; // 8 groupes x 6 valeurs attendues
  var obligRows = [];
  for (var g = 0; g < 8; g++) {
    var row = obligNums.slice(g * 6, g * 6 + 6);
    obligRows.push({ band1TTC: row[1], band2TTC: row[3] });
  }

  var result = {
    g_abo_b0: (fourniture.abo1 + acheminement.abo1) / 12,
    g_abo_b1: (fourniture.abo2 + acheminement.abo2) / 12
  };
  for (var zn = 1; zn <= 6; zn++) {
    var g = obligRows[zn - 1]; // Zone1→6 = Groupe A→F
    result['g_abo_b0_z' + zn] = result.g_abo_b0;
    result['g_kwh_b0_z' + zn] = fourniture.kwh1 + acheminement.kwh1 + g.band1TTC;
    result['g_abo_b1_z' + zn] = result.g_abo_b1;
    result['g_kwh_b1_z' + zn] = fourniture.kwh2 + acheminement.kwh2 + g.band2TTC;
  }
  return result;
}

// Arrondi uniforme appliqué à tous les parseurs gaz : 2 décimales pour les abonnements,
// 4 décimales pour les prix au kWh (utile notamment après une addition Fourniture+Acheminement+
// Obligations, qui peut introduire de petites erreurs de virgule flottante).
function roundGasResult(result) {
  if (!result) return result;
  Object.keys(result).forEach(function(k) {
    if (typeof result[k] !== 'number') return;
    if (k.indexOf('g_abo_') === 0) result[k] = +result[k].toFixed(2);
    else if (k.indexOf('g_kwh_') === 0) result[k] = +result[k].toFixed(4);
  });
  return result;
}

// ── PLENITUDE (gaz): grille "Plenifix" — prix fixe national, sans zonage ──
// Format simple : une seule ligne "< 4 MWh  abo_HT abo_TTC kwh_HT kwh_TTC" (B0)
// et une ligne "≥ 4 MWh  abo_HT abo_TTC kwh_HT kwh_TTC" (B1). Comme Alterna, il n'y a
// pas de zone tarifaire : on duplique la même valeur sur les 6 zones de l'outil.
function parsePlenitudeGas(rawText) {
  if (!/Plenitude|Plenifix/i.test(rawText)) return null;
  var norm = despacePasteDecimals(rawText.replace(/,/g, '.'));
  var reB0 = /<\s*4\s*MWh\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/i;
  var reB1 = /[≥>]=?\s*4\s*MWh\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/i;
  var m0 = reB0.exec(norm);
  var m1 = reB1.exec(norm);
  if (!m0 || !m1) return null;
  // [abo_HT_an, abo_TTC_an, kwh_HT, kwh_TTC]
  var aboB0 = parseFloat(m0[2]) / 12;
  var kwhB0 = parseFloat(m0[4]);
  var aboB1 = parseFloat(m1[2]) / 12;
  var kwhB1 = parseFloat(m1[4]);
  if (isNaN(aboB0) || isNaN(kwhB0) || isNaN(aboB1) || isNaN(kwhB1)) return null;
  var result = { g_abo_b0: aboB0, g_abo_b1: aboB1 };
  for (var zn = 1; zn <= 6; zn++) {
    result['g_abo_b0_z' + zn] = aboB0;
    result['g_kwh_b0_z' + zn] = kwhB0;
    result['g_abo_b1_z' + zn] = aboB1;
    result['g_kwh_b1_z' + zn] = kwhB1;
  }
  return result;
}

// ── OHM ÉNERGIE (gaz): grille "Extra Eco Gaz" — Plage de Base / Plage B0 / Plage B1-B2i ──
// Prix du kWh donnés en centimes d'euro. Base et B0 ont des valeurs identiques -> B0 de l'outil.
// Plage B1/B2i -> B1 de l'outil. La "Zone ELD" (Bordeaux/Strasbourg/Colmar) n'est pas utilisée
// (l'outil ne gère que les Zones 1 à 6). On utilise un motif à 2 décimales strictes (format
// monétaire) plutôt que despacePasteDecimals, car "15,61" et "23,50" peuvent se retrouver collés
// sans espace ("15,6123,50") de façon ambiguë pour un simple découpage générique.
function parseOhmGas(rawText) {
  if (!/Ohm\s*[EÉ]nergie/i.test(rawText)) return null;
  if (!/Plage\s*B0/i.test(rawText) || !/Plage\s*B1/i.test(rawText)) return null;
  // "Zones 1 à 6" est parfois suivi immédiatement, sans espace, du premier nombre de la ligne
  // abonnement (ex: "à 67,99" pour "à 6" + "7,99") : on force un espace après le "6" isolé.
  var fixed = rawText.replace(/à\s*6(\d)/i, 'à 6 $1');
  var norm = fixed.replace(/,/g, '.');
  var reNum = /\d{1,3}\.\d{2}/g;

  var aboIdx = norm.search(/Zones\s*1\s*à\s*6/i);
  if (aboIdx < 0) return null;
  var zone1Idx = norm.indexOf('Zone 1', aboIdx);
  var aboWindow = norm.substring(aboIdx, zone1Idx >= 0 ? zone1Idx : Math.min(norm.length, aboIdx + 200));
  var aboNums = (aboWindow.match(reNum) || []).map(parseFloat);
  if (aboNums.length < 6) return null;
  var aboB0 = aboNums[1]; // TTC, identique pour Base et B0
  var aboB1 = aboNums[5]; // TTC B1/B2i

  var reZone = /Zone\s*(\d)\b/gi;
  var positions = [];
  var mz;
  while ((mz = reZone.exec(norm)) !== null) {
    var zn0 = parseInt(mz[1]);
    if (zn0 < 1 || zn0 > 6) continue;
    positions.push({ zone: zn0, start: mz.index, afterIdx: mz.index + mz[0].length });
  }
  if (positions.length < 6) return null;

  var result = { g_abo_b0: aboB0, g_abo_b1: aboB1 };
  for (var zn = 1; zn <= 6; zn++) {
    result['g_abo_b0_z' + zn] = aboB0;
    result['g_abo_b1_z' + zn] = aboB1;
  }
  for (var i = 0; i < positions.length; i++) {
    var chunkEnd = (i + 1 < positions.length) ? positions[i + 1].start : Math.min(norm.length, positions[i].afterIdx + 100);
    var chunk = norm.substring(positions[i].afterIdx, chunkEnd);
    var nums = (chunk.match(reNum) || []).slice(0, 6).map(parseFloat);
    if (nums.length < 6) continue;
    result['g_kwh_b0_z' + positions[i].zone] = nums[1] / 100; // TTC en cts -> €/kWh
    result['g_kwh_b1_z' + positions[i].zone] = nums[5] / 100;
  }
  return result;
}

// ── OCTOPUS ENERGY (gaz): grille "Gaz Fixe" — Cuisson/eau chaude (B0) + Chauffage (B1) x Zone 1-6 ──
function parseOctopusGas(rawText) {
  if (!/Octopus/i.test(rawText)) return null;
  if (!/Cuisson/i.test(rawText) || !/Chauffage/i.test(rawText)) return null;
  var norm = despacePasteDecimals(rawText.replace(/,/g, '.'));

  var aboIdx = norm.search(/Abonnement\s*\(/i);
  var zone1Idx = norm.search(/Zone\s*1\b/i);
  if (aboIdx < 0 || zone1Idx < 0 || zone1Idx <= aboIdx) return null;
  var aboNums = (norm.substring(aboIdx, zone1Idx).match(/[\d]+\.[\d]+/g) || []).map(parseFloat);
  if (aboNums.length < 4) return null;
  var aboB0 = aboNums[1]; // TTC
  var aboB1 = aboNums[3]; // TTC

  var reZone = /Zone\s*(\d)\b/gi;
  var positions = [];
  var mz;
  while ((mz = reZone.exec(norm)) !== null) {
    var zn0 = parseInt(mz[1]);
    if (zn0 < 1 || zn0 > 6) continue;
    positions.push({ zone: zn0, start: mz.index, afterIdx: mz.index + mz[0].length });
  }
  if (positions.length < 6) return null;

  var result = { g_abo_b0: aboB0, g_abo_b1: aboB1 };
  for (var zn = 1; zn <= 6; zn++) {
    result['g_abo_b0_z' + zn] = aboB0;
    result['g_abo_b1_z' + zn] = aboB1;
  }
  for (var i = 0; i < positions.length; i++) {
    var chunkEnd = (i + 1 < positions.length) ? positions[i + 1].start : Math.min(norm.length, positions[i].afterIdx + 100);
    var chunk = norm.substring(positions[i].afterIdx, chunkEnd);
    var nums = (chunk.match(/[\d]+\.[\d]+/g) || []).slice(0, 4).map(parseFloat);
    if (nums.length < 4) continue;
    result['g_kwh_b0_z' + positions[i].zone] = nums[1]; // TTC B0 (déjà en €/kWh)
    result['g_kwh_b1_z' + positions[i].zone] = nums[3]; // TTC B1
  }
  return result;
}

// ── HAPP-E by ENGIE (gaz): grille "Niveau 1-6" — B0 fixe (0-3999 kWh) + B1 par niveau (4000-29999 kWh) ──
// La tranche "30000-300000 kWh" répète les mêmes valeurs de kWh par niveau (ignorée, non utilisée).
// Niveau 1→6 de la grille happ-e = Zone 1→6 de l'outil.
function parseHappeGas(rawText) {
  if (!/happ.?e/i.test(rawText)) return null;
  if (!/Niveau/i.test(rawText)) return null;
  var grilleIdx = rawText.search(/Grille\s*tarifaire/i);
  var gridText = grilleIdx >= 0 ? rawText.substring(grilleIdx) : rawText;
  var norm = despacePasteDecimals(gridText.replace(/,/g, '.'));

  // B0 : ligne "0 - 3999 kWh  ...  abo_HT abo_TTC kwh_HT kwh_TTC"
  var b0Idx = norm.search(/0\s*-\s*3999\s*kWh/i);
  if (b0Idx < 0) return null;
  var b0Nums = (norm.substring(b0Idx).match(/[\d]+\.[\d]+/g) || []).slice(0, 4).map(parseFloat);
  if (b0Nums.length < 4) return null;
  var aboB0 = b0Nums[1] / 12;
  var kwhB0 = b0Nums[3];

  // B1 : abo constant "4000 – 29999 kWh ... abo_HT abo_TTC", kWh par Niveau 1-6
  var b1AboIdx = norm.search(/4000\s*[-–]\s*29999\s*kWh/i);
  if (b1AboIdx < 0) return null;
  var b1AboNums = (norm.substring(b1AboIdx).match(/[\d]+\.[\d]+/g) || []).slice(0, 2).map(parseFloat);
  if (b1AboNums.length < 2) return null;
  var aboB1 = b1AboNums[1] / 12;

  // Niveau 1-6 : le label peut apparaître avant OU après ses propres valeurs (fuite déjà
  // rencontrée chez Engie/Total) ; comme la grille liste Niveau 1-6 deux fois (une fois par
  // tranche de conso, avec des valeurs identiques), on garde la 1ère occurrence complète trouvée.
  var reNiveau = /Niveau\s*(\d)\b/gi;
  var positions = [];
  var mn;
  while ((mn = reNiveau.exec(norm)) !== null) {
    var nv = parseInt(mn[1]);
    if (nv < 1 || nv > 6) continue;
    positions.push({ niveau: nv, start: mn.index, afterIdx: mn.index + mn[0].length });
  }
  var kwhB1ByNiveau = {};
  for (var i = 0; i < positions.length; i++) {
    if (kwhB1ByNiveau[positions[i].niveau]) continue;
    var chunkEnd = (i + 1 < positions.length) ? positions[i + 1].start : Math.min(norm.length, positions[i].afterIdx + 100);
    var chunk = norm.substring(positions[i].afterIdx, chunkEnd);
    var nums = (chunk.match(/[\d]+\.[\d]+/g) || []).slice(0, 2).map(parseFloat);
    if (nums.length >= 2) kwhB1ByNiveau[positions[i].niveau] = nums[1]; // TTC
  }
  if (Object.keys(kwhB1ByNiveau).length < 6) return null;

  var result = { g_abo_b0: aboB0, g_abo_b1: aboB1 };
  for (var zn = 1; zn <= 6; zn++) {
    result['g_abo_b0_z' + zn] = aboB0;
    result['g_kwh_b0_z' + zn] = kwhB0;
    result['g_abo_b1_z' + zn] = aboB1;
    result['g_kwh_b1_z' + zn] = kwhB1ByNiveau[zn];
  }
  return result;
}

function parseGasTariffs(rawText) {
  var alterna = parseAlternaGas(rawText);
  if (alterna) return roundGasResult(alterna);
  var edf = parseEDFGas(rawText);
  if (edf) return roundGasResult(edf);
  var total = parseTotalGas(rawText);
  if (total) return roundGasResult(total);
  var engie = parseEngieGas(rawText);
  if (engie) return roundGasResult(engie);
  var plenitude = parsePlenitudeGas(rawText);
  if (plenitude) return roundGasResult(plenitude);
  var ohm = parseOhmGas(rawText);
  if (ohm) return roundGasResult(ohm);
  var octopus = parseOctopusGas(rawText);
  if (octopus) return roundGasResult(octopus);
  var happe = parseHappeGas(rawText);
  if (happe) return roundGasResult(happe);

  var d = {};
  function pf(s) { var v = parseFloat(String(s).replace(/,/g,'.')); return isNaN(v) ? null : v; }
  var norm = rawText.replace(/,/g,'.').replace(/\r/g,'');
  var lines = norm.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);

  // ── ENGIE: flat line-by-line, no nested functions ─────────────────
  var engie_fou_b0_abo=0, engie_fou_b0_kwh=0;
  var engie_ach_b0_abo=0, engie_ach_b0_kwh=0;
  var engie_fou_b1_abo=0, engie_fou_b1_kwh=0;
  var engie_ach_b1_abo=0, engie_ach_b1_kwh=0;
  var engie_ob0=0.02255;
  var engie_ob1=[0.02801,0.02903,0.03212,0.03546,0.03907,0.04176];

  for(var ei=0;ei<lines.length;ei++){
    var el=lines[ei];
    var en=(el.match(/\b[\d]+\.[\d]+\b/g)||[]).map(pf).filter(function(v){return v!==null;});

    // B0 lines: "jusqu'à 3 999 kWh  HT  TTC  kwh_HT  kwh_TTC"
    if(en.length===4 && (el.indexOf('jusqu')>=0||el.indexOf('3 999')>=0)){
      var et=en[1], ek=en[3];
      if(en[0]>40&&en[0]<300&&et>en[0]&&en[2]>0.03&&ek>0.04&&ek<0.12){
        if(et<75){ engie_fou_b0_abo=et; engie_fou_b0_kwh=ek; }
        else      { engie_ach_b0_abo=et; engie_ach_b0_kwh=ek; }
      }
    }

    // B1 Acheminement: "de 4 000  HT  TTC  kwh_HT  kwh_TTC" (HT>100)
    if(en.length===4 && (el.indexOf('4 000')>=0||el.indexOf('4000')>=0)){
      if(en[0]>100&&en[1]>en[0]&&en[2]>0.01&&en[3]>0.01&&en[3]<0.06){
        engie_ach_b1_abo=en[1]; engie_ach_b1_kwh=en[3];
      }
    }

    // B1 Fourniture: "de 4 000  kwh_HT  kwh_TTC" (2 values, abo on next line)
    if(en.length===2 && (el.indexOf('4 000')>=0||el.indexOf('4000')>=0)){
      if(en[0]>0.03&&en[1]>0.05&&en[1]<0.12){
        engie_fou_b1_kwh=en[1];
        for(var ej=ei+1;ej<Math.min(ei+4,lines.length);ej++){
          var en2=(lines[ej].match(/\b[\d]+\.[\d]+\b/g)||[]).map(pf).filter(function(v){return v&&v>50&&v<200;});
          if(en2.length>=1){
            engie_fou_b1_abo=en2[en2.length-1]; // take largest (TTC)
            break;
          }
        }
      }
    }

    // Obligations: 6 small values 0.01-0.06
    if(en.length===6&&en[0]>0.01&&en[0]<0.025&&en[5]>0.01&&en[5]<0.06){
      if(engie_ob0===0.02255&&en[1]>0.02&&en[1]<0.03) engie_ob0=en[1];
      if(engie_ob1[0]===0.02801&&en[3]>0.02&&en[3]<0.05) {
        engie_ob1=[];
        for(var eo=0;eo<6&&ei+eo<lines.length;eo++){
          var eon=(lines[ei+eo].match(/\b[\d]+\.[\d]+\b/g)||[]).map(pf).filter(function(v){return v!==null;});
          if(eon.length===6&&eon[3]>0.02&&eon[3]<0.06) engie_ob1.push(eon[3]);
        }
        if(engie_ob1.length<6) engie_ob1=[0.02801,0.02903,0.03212,0.03546,0.03907,0.04176];
      }
    }
  }

  if(engie_fou_b0_abo>0&&engie_ach_b0_abo>0&&engie_fou_b1_abo>0&&engie_ach_b1_abo>0){
    d.g_abo_b0=(engie_fou_b0_abo+engie_ach_b0_abo)/12;
    d.g_abo_b1=(engie_fou_b1_abo+engie_ach_b1_abo)/12;
    var eb0k=engie_fou_b0_kwh+engie_ach_b0_kwh;
    var eb1k=engie_fou_b1_kwh+engie_ach_b1_kwh;
    for(var ez=1;ez<=6;ez++) d['g_kwh_b0_z'+ez]=+((eb0k+engie_ob0).toPrecision(5));
    for(var ez=1;ez<=6;ez++) d['g_kwh_b1_z'+ez]=+((eb1k+(engie_ob1[ez-1]||engie_ob1[0])).toPrecision(5));
    return d;
  }

  // ── HAPPE: line "TTC HTT TTC 159.39 0.10124 0.14116 0.10723 0.10795..." ──
  for (var li = 0; li < lines.length; li++) {
    var l = lines[li];
    if (l.indexOf('0.14116') < 0 && l.indexOf('0.10723') < 0) continue;
    var nums = (l.match(/\b\d+\.\d+\b/g)||[]).map(pf).filter(function(v){return v!==null;});
    // Find 159.39 followed by kWh values
    for (var i = 0; i < nums.length-3; i++) {
      if (nums[i]>100&&nums[i]<300 && nums[i+1]>0.05&&nums[i+1]<0.15 && nums[i+2]>0.10&&nums[i+2]<0.20) {
        d.g_abo_b0 = nums[i]/12;
        for (var z=1;z<=6;z++) d['g_kwh_b0_z'+z] = nums[i+2]; // 0.14116
        var b1kwh = nums.slice(i+3).filter(function(v){return v>0.10&&v<0.12;});
        b1kwh.sort(function(a,b){return a-b;});
        b1kwh.slice(0,6).forEach(function(v,j){d['g_kwh_b1_z'+(j+1)]=v;});
        break;
      }
    }
    // B1 abo: find "355.78482.14" pattern on another line
    for (var li2=0;li2<lines.length;li2++) {
      var m = lines[li2].match(/\b(\d{3,4}\.\d{2})(\d{3,4}\.\d{2})\b/);
      if (m) {
        var a=pf(m[1]),b=pf(m[2]);
        if (a&&b&&a>200&&a<700&&b>200&&b<700&&b>a) {
          // Happe: a=355.78 (B1 plage 4000-29999), b=482.14 (B1 plage 4000-29999... wait)
          // Actually from PDF: "0-3999kWh: 119.3/159.39", "4000-29999: 355.78/482.14"
          // B0=159.39/12=13.28, B1=482.14/12=40.18
          // So b=482.14 is B1 abo TTC
          d.g_abo_b1 = b/12; break;
        }
      }
    }
    if (d.g_abo_b0 && d.g_kwh_b0_z1) return d;
  }

  // ── EDF: "Zone N9.870.138523.290.1080..." (numbers joined without spaces) ──
  for (var li = 0; li < lines.length; li++) {
    var m = lines[li].match(/^Zone\s*(\d)([\d.]+)/);
    if (!m) continue;
    var zn = parseInt(m[1]);
    // Split joined numbers like "9.870.138523.290.1080": alternating abo (N.NN) and kwh (0.NNNN)
    var tail = m[2];
    var nums = (tail.match(/\d{1,2}\.\d{2}(?=0\.)|0\.\d{4}/g)||[]).map(pf).filter(function(v){return v!==null;});
    if(!nums.length) nums = (tail.match(/\d+\.\d+/g)||[]).map(pf).filter(function(v){return v!==null;});
    if (nums.length >= 4 && nums[0]>5&&nums[0]<50 && nums[1]>0.05&&nums[1]<0.3 &&
        nums[2]>5&&nums[2]<50 && nums[3]>0.05&&nums[3]<0.3) {
      if (zn===1) { d.g_abo_b0=nums[0]; d.g_abo_b1=nums[2]; }
      d['g_kwh_b0_z'+zn]=nums[1];
      d['g_kwh_b1_z'+zn]=nums[3];
    }
  }
  if (d.g_abo_b0 && d.g_kwh_b0_z1) return d;

  // ── OCTOPUS: 4 single-value lines (abos), then kWh pairs ──────────
  var singles=[];
  for (var li=0;li<lines.length;li++) {
    var m = lines[li].match(/^(\d+\.\d+)$/);
    if (m) singles.push({v:pf(m[1]),li:li});
  }
  for (var i=0;i<singles.length-3;i++) {
    var sv=singles.slice(i,i+4).map(function(x){return x.v;});
    if(sv[0]>5&&sv[0]<15&&sv[1]>10&&sv[1]<20&&sv[2]>15&&sv[2]<25&&sv[3]>20&&sv[3]<40){
      d.g_abo_b0=sv[1]; d.g_abo_b1=sv[3];
      var z=1;
      for(var j=i+4;j+3<singles.length&&z<=6;j+=4){
        var kv=singles.slice(j,j+4).map(function(x){return x.v;});
        if(kv[0]>0.05&&kv[0]<0.25&&kv[3]>0.05&&kv[3]<0.25){
          d['g_kwh_b0_z'+z]=kv[1]; d['g_kwh_b1_z'+z]=kv[3]; z++;
        } else break;
      }
      if(d.g_kwh_b0_z1) return d;
      break;
    }
  }

  // ── TOTAL ENERGIES: big line with "12.27 0.1118 0.1538 9.10 12.27..." ──
  for (var li=0;li<lines.length;li++) {
    var l=lines[li];
    if(l.indexOf('12.27')<0||l.indexOf('0.1538')<0) continue;
    var nums=(l.match(/\b\d+\.\d+\b/g)||[]).map(pf).filter(function(v){return v!==null;});
    for(var i=0;i<nums.length-2;i++){
      if(Math.abs(nums[i]-12.27)<0.1&&nums[i+1]>0.08&&nums[i+1]<0.15&&nums[i+2]>0.13){
        var ns=nums.slice(i),j=0;
        var b0a=ns[j++]; j++; var b0z1=ns[j++]; var b0kwh=[b0z1];
        for(var z=0;z<5&&j+3<ns.length;z++){
          if(ns[j]>5&&ns[j]<20&&ns[j+1]>ns[j]&&ns[j+2]>0.08&&ns[j+3]>0.13){b0kwh.push(ns[j+3]);j+=4;}else break;
        }
        var b1a=ns[j++]; j++; var b1z1=ns[j++]; var b1kwh=[b1z1];
        for(var z=0;z<5&&j+3<ns.length;z++){
          if(ns[j]>10&&ns[j]<30&&ns[j+1]>ns[j]&&ns[j+2]>0.05&&ns[j+3]>0.09){b1kwh.push(ns[j+3]);j+=4;}else break;
        }
        if(b0a>5&&b0a<20&&b1a>15&&b1a<45){
          d.g_abo_b0=b0a; d.g_abo_b1=b1a;
          for(var z=0;z<b0kwh.length;z++) d['g_kwh_b0_z'+(z+1)]=b0kwh[z];
          for(var z=0;z<b1kwh.length;z++) d['g_kwh_b1_z'+(z+1)]=b1kwh[z];
          return d;
        }
        break;
      }
    }
  }

  // ── OHM: "Zone N 9.62 13.51 9.62 13.51 6.45 9.71" ─────────────────
  var ohmZ={};
  for(var li=0;li<lines.length;li++){
    var m=lines[li].match(/^Zone\s+(\d)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
    if(!m) continue;
    var zn=parseInt(m[1]),v=[pf(m[2]),pf(m[3]),pf(m[4]),pf(m[5]),pf(m[6]),pf(m[7])];
    if(v[0]&&v[0]>5&&v[0]<20&&v[5]&&v[5]>5&&v[5]<20) ohmZ[zn]={b0:v[3]/100,b1:v[5]/100};
  }
  if(Object.keys(ohmZ).length>0){
    // Ohm abo: search for literal "10.95" and "27.73" in text
    var ohmB0m=norm.match(/10\.95/); var ohmB1m=norm.match(/27\.73/);
    if(ohmB0m) d.g_abo_b0=10.95;
    if(ohmB1m) d.g_abo_b1=27.73;
    if(!d.g_abo_b0){
      // Fallback: find two monthly abos in abo section
      for(var li=0;li<lines.length;li++){
        var nums=(lines[li].match(/\d+\.\d+/g)||[]).map(pf).filter(function(v){return v&&v>9&&v<35;});
        var uniq=nums.filter(function(v,i,a){return a.indexOf(v)===i;});
        if(uniq.length>=2){uniq.sort(function(a,b){return a-b;});d.g_abo_b0=uniq[0];d.g_abo_b1=uniq[uniq.length-1];break;}
      }
    }
    for(var zn=1;zn<=6;zn++) if(ohmZ[zn]){d['g_kwh_b0_z'+zn]=ohmZ[zn].b0;d['g_kwh_b1_z'+zn]=ohmZ[zn].b1;}
    if(d.g_abo_b0) return d;
  }

  // ── ENI / ALTERNA: single-value lines ──────────────────────────────
  // Collect all single-value lines
  var sv_annual=[], sv_kwh_eur=[], sv_kwh_cts=[];
  for(var li=0;li<lines.length;li++){
    var m=lines[li].match(/^\s*([\d.]+)\s*$/);
    if(!m) continue;
    var v=pf(m[1]); if(!v||v<=0) continue;
    if(v>50&&v<700) sv_annual.push(v);
    else if(v>0.05&&v<0.25) sv_kwh_eur.push(v);
    else if(v>5&&v<25) sv_kwh_cts.push(v);
  }
  // Also check big line for Alterna: "119.17 159.23 10.20 14.21 ..."
  var altBigLine=null;
  for(var li=0;li<lines.length;li++){
    if(lines[li].indexOf('119.17')>=0||lines[li].indexOf('159.23')>=0) {altBigLine=lines[li];break;}
  }
  if(altBigLine){
    var nums=(altBigLine.match(/\b[\d.]+\b/g)||[]).map(pf).filter(function(v){return v!==null;});
    // Find annual pairs
    var annuals=nums.filter(function(v){return v>50&&v<700;});
    annuals=annuals.filter(function(v,i,a){return a.indexOf(v)===i;});
    annuals.sort(function(a,b){return a-b;});
    if(annuals.length>=4){ d.g_abo_b0=+(annuals[1]/12).toFixed(2); d.g_abo_b1=+(annuals[3]/12).toFixed(2); }
    else if(annuals.length>=2){ d.g_abo_b0=+(annuals[0]/12).toFixed(2); d.g_abo_b1=+(annuals[annuals.length-1]/12).toFixed(2); }
    // B0 kwh: find 14.21cts in nums
    var b0cts=nums.filter(function(v){return v>=13&&v<=18;});
    if(b0cts.length) for(var z=1;z<=6;z++) d['g_kwh_b0_z'+z]=Math.max.apply(null,b0cts)/100;
    // B1 kwh zones from nums
    var b1cts=nums.filter(function(v){return v>10.5&&v<13;});
    // Also from separate single-value lines (7.71-8.00 are HT, 11.22-11.57 are TTC)
    b1cts=b1cts.concat(sv_kwh_cts.filter(function(v){return v>10&&v<13;}));
    b1cts=b1cts.filter(function(v,i,a){return a.indexOf(v)===i;});
    b1cts.sort(function(a,b){return a-b;});
    // If missing zone 1, try to infer: HT=7.71→TTC should be ~11.22
    // From separate lines: 7.71,7.77,7.83,7.88,7.94,8.00 are HT; find corresponding TTC in bigLine
    if(!b1cts.length){
      // Look for cts 10.5-13 in the big line
      b1cts=nums.filter(function(v){return v>10.5&&v<13;});
      b1cts.sort(function(a,b){return a-b;});
    }
    b1cts.slice(0,6).forEach(function(v,i){if(!d['g_kwh_b1_z'+(i+1)])d['g_kwh_b1_z'+(i+1)]=v/100;});
    if(d.g_abo_b0) return d;
  }

  // ENI: single value lines
  if(sv_annual.length>=2){
    sv_annual=sv_annual.filter(function(v,i,a){return a.indexOf(v)===i;});
    sv_annual.sort(function(a,b){return a-b;});
    // Pairs: (HT_B0,TTC_B0,HT_B1,TTC_B1) → take TTC (pos 1 and 3 when 4 values)
    if(sv_annual.length>=4){ d.g_abo_b0=sv_annual[1]/12; d.g_abo_b1=sv_annual[3]/12; }
    else if(sv_annual.length>=2){ d.g_abo_b0=sv_annual[0]/12; d.g_abo_b1=sv_annual[sv_annual.length-1]/12; }
  }
  if(sv_kwh_eur.length>=2){
    sv_kwh_eur.sort(function(a,b){return b-a;});
    for(var z=1;z<=6;z++){ d['g_kwh_b0_z'+z]=sv_kwh_eur[0]; d['g_kwh_b1_z'+z]=sv_kwh_eur[1]; }
  } else if(sv_kwh_eur.length===1){
    for(var z=1;z<=6;z++) d['g_kwh_b0_z'+z]=sv_kwh_eur[0];
  }

  return d;
}


function applyExtracted(data) {
  Object.keys(data).forEach(function(k) {
    var inp = document.getElementById(k);
    if(inp) {
      var v = data[k];
      // Format: 2 decimals for abo, 4 for kWh
      if(typeof v === 'number') {
        if(k.startsWith('g_abo_') || k.startsWith('abo_')) {
          inp.value = v.toFixed(2);
        } else if(k.startsWith('g_kwh_') || k.startsWith('kwh_') || k.startsWith('hp_') || k.startsWith('hc_')) {
          inp.value = v.toFixed(4);
        } else {
          inp.value = v;
        }
      } else {
        inp.value = v;
      }
      inp.classList.add('extracted');
    }
  });
}

function calcElecCost(d, kva, type, conso_or_hp, conso_hc) {
  const abo = d['abo_'+kva+'_'+type];
  if (type==='base') {
    const kwh = d['kwh_'+kva+'_'+type];
    if(!abo||!kwh) return null;
    return abo*12 + kwh*conso_or_hp;
  } else {
    const hp=d['hp_'+kva], hc=d['hc_'+kva];
    if(!abo||!hp||!hc) return null;
    return abo*12 + hp*conso_or_hp + hc*conso_hc;
  }
}
function calcGasCost(d, band, conso) {
  const abo=d['g_abo_'+band], kwh=d['g_kwh_'+band+'_z1'];
  if(!abo||!kwh) return null;
  return abo*12 + kwh*conso;
}

function ecartCell(v) {
  if(v===null||v===undefined||isNaN(v))return '<td class="ecart">—</td>';
  if(v===0)return '<td class="ecart zero">—</td>';
  const cls=v>0?'pos':'neg', sign=v>0?'+':'';
  return `<td class="ecart ${cls}">${sign}${v.toFixed(2)}</td>`;
}

var _workingSuppliers = null, _workingSuppliersGaz = null, _workingREF = null;

function loadMonth(key){
  currentMonthKey = key;
  editingHistory = false;
  if(key === null) {
    // Return to working (empty) state
    if(_workingSuppliers !== null) {
      suppliers = _workingSuppliers;
      suppliersGaz = _workingSuppliersGaz;
      Object.assign(REF.elec, _workingREF.elec||{});
      Object.assign(REF.gas, _workingREF.gas||{});
      _workingSuppliers = null;
    } else {
      // No saved working state: reset to empty
      suppliers = SUPPLIERS.map(function(n){ return {name:n,url:'',elec:{data:{},status:'empty',pdfName:null,decomposed:false}}; });
      suppliersGaz = SUPPLIERS_GAZ.map(function(n){ return {name:n,url:'',gas:{data:{},status:'empty',pdfName:null,decomposed:false}}; });
    }
    currentSupplier = null;
    renderSidebar(); renderContent();
    return;
  }
  var m = history[key];
  if(m) {
    // Save current working state if not already saved
    if(_workingSuppliers === null) {
      _workingSuppliers = JSON.parse(JSON.stringify(suppliers));
      _workingSuppliersGaz = JSON.parse(JSON.stringify(suppliersGaz));
      _workingREF = JSON.parse(JSON.stringify(REF));
    }
    // Load history month
    if(m.suppliers) suppliers = JSON.parse(JSON.stringify(m.suppliers));
    if(m.suppliersGaz) suppliersGaz = JSON.parse(JSON.stringify(m.suppliersGaz));
    if(m.REF) {
      if(m.REF.elec) Object.assign(REF.elec, m.REF.elec);
      if(m.REF.gas) Object.assign(REF.gas, m.REF.gas);
    }
    currentSupplier = null;
    currentTab = 'results'; // Afficher le classement du mois chargé
  }
  renderSidebar(); renderContent();
}

function fmtE(v,decimals) {

  if(Math.abs(v)<0.000001) return '<span style="color:var(--text3)">—</span>';
  var sign=v>0?'+':'';

// Code promo (montant en € déduit UNE fois du coût annuel)
function promoOf(d){
  if(!d) return 0;
  var raw = d.promo;
  if(raw===null||raw===undefined||raw==='') return 0;
  var v = parseFloat(String(raw).replace(',','.').replace(/[^0-9.\-]/g,''));
  return isFinite(v) ? v : 0;
}

function computeElecRankings() {
  var r = getActiveREF('elec');
  var sups = getActiveSuppliers();
  var SELF = 'Alterna énergie';

  // Annual cost calculation
  function cost6b(d)  { var a=d.abo_6_base, k=d.kwh_6_base;   if(!a||!k) return null; return a*12 + k*CONSOS.elec_6_base - promoOf(d); }
  function cost9b(d)  { var a=d.abo_9_base, k=d.kwh_9_base;   if(!a||!k) return null; return a*12 + k*CONSOS.elec_9_base - promoOf(d); }
  function cost12b(d) { var a=d.abo_12_base,k=d.kwh_12_base;  if(!a||!k) return null; return a*12 + k*CONSOS.elec_12_base - promoOf(d); }
  function cost15b(d) { var a=d.abo_15_base,k=d.kwh_15_base;  if(!a||!k) return null; return a*12 + k*CONSOS.elec_15_base - promoOf(d); }
  function cost18b(d) { var a=d.abo_18_base,k=d.kwh_18_base;  if(!a||!k) return null; return a*12 + k*CONSOS.elec_18_base - promoOf(d); }
  function cost6h(d)  { var a=d.abo_6_hc,   hp=d.hp_6, hc=d.hc_6; if(!a||!hp||!hc) return null; return a*12 + hp*CONSOS.elec_6_hc_hp + hc*CONSOS.elec_6_hc_hc - promoOf(d); }
  function cost9h(d)  { var a=d.abo_9_hc,   hp=d.hp_9, hc=d.hc_9; if(!a||!hp||!hc) return null; return a*12 + hp*CONSOS.elec_9_hc_hp + hc*CONSOS.elec_9_hc_hc - promoOf(d); }
  function cost12h(d) { var a=d.abo_12_hc,  hp=d.hp_12,hc=d.hc_12;if(!a||!hp||!hc) return null; return a*12 + hp*CONSOS.elec_12_hc_hp + hc*CONSOS.elec_12_hc_hc - promoOf(d); }
  function cost15h(d) { var a=d.abo_15_hc,  hp=d.hp_15,hc=d.hc_15;if(!a||!hp||!hc) return null; return a*12 + hp*CONSOS.elec_15_hc_hp + hc*CONSOS.elec_15_hc_hc - promoOf(d); }
  function cost18h(d) { var a=d.abo_18_hc,  hp=d.hp_18,hc=d.hc_18;if(!a||!hp||!hc) return null; return a*12 + hp*CONSOS.elec_18_hc_hp + hc*CONSOS.elec_18_hc_hc - promoOf(d); }

  };
  var vCosts = { e6b:cost6b(refD), e9b:cost9b(refD), e12b:cost12b(refD), e15b:cost15b(refD), e18b:cost18b(refD), e6h:cost6h(refD), e9h:cost9h(refD), e12h:cost12h(refD), e15h:cost15h(refD), e18h:cost18h(refD) };

function computeGasRankings() {
  var r = getActiveREF('gas');
  var sups = getActiveSuppliers();
  var SELF = 'Alterna énergie';
  function gasCost(abo, kwh, conso, promo) { return (abo&&kwh) ? abo*12 + kwh*conso - (promo||0) : null; }
  var BANDS = ['base','b0','b1','b2i'];
  var ZONES = [1,2,3,4,5,6];
  var CONSO_BY_BAND = { base: CONSOS.gas_base, b0: CONSOS.gas_b0, b1: CONSOS.gas_b1, b2i: CONSOS.gas_b2i };
  var offerName = r.offerName || '';
  var selfUrl = r.url || '';
  var selfPct = r.pctKwhVsTrv || '';
  var res = {};
  // Init and push self reference for each band×zone
  BANDS.forEach(function(b){
    ZONES.forEach(function(z){
      var key = b+'z'+z;
      var rAbo = r['abo_'+b+'_z'+z]!=null ? r['abo_'+b+'_z'+z] : r['abo_'+b];
      var rKwh = r['kwh_'+b+'_z'+z];
      var rCost = gasCost(rAbo, rKwh, CONSO_BY_BAND[b], promoOf(r));
      res[key] = [];
      res[key].push({name:SELF, offer:offerName, isSelf:true, promo:promoOf(r), abo:rAbo, kwh:rKwh, annuel:rCost, ecart:0, url:selfUrl, pctKwhVsTrv:selfPct});
      res[key]._refCost = rCost;
      res[key]._refAbo = rAbo;
      res[key]._refKwh = rKwh;
    });
  });
  sups.forEach(function(s){
    if (s.name===SELF) return;
    if (!s.gas || s.gas.status!=='done') return;
    var d = s.gas.data;
    var base = {name:s.name, offer:d.offer||'—', url:s.url||'', pctKwhVsTrv:d.pctKwhVsTrv||'', promo:promoOf(d), isSelf:false};
    BANDS.forEach(function(b){
      ZONES.forEach(function(z){
        var key = b+'z'+z;
        var dAbo = d['g_abo_'+b+'_z'+z]!=null ? d['g_abo_'+b+'_z'+z] : d['g_abo_'+b];
        var dKwh = d['g_kwh_'+b+'_z'+z];
        var cost = gasCost(dAbo, dKwh, CONSO_BY_BAND[b], promoOf(d));
        if (cost===null) return;
        var refCost = res[key]._refCost, refAbo = res[key]._refAbo, refKwh = res[key]._refKwh;
        res[key].push(Object.assign({}, base, {
          abo:dAbo, kwh:dKwh, annuel:cost,
          ecart_abo:(dAbo||0)-(refAbo||0),
          ecart_kwh:(dKwh||0)-(refKwh||0),
          ecart: refCost!==null ? cost-refCost : null
        }));
      });
    });
  });
  Object.keys(res).forEach(function(k){
    delete res[k]._refCost; delete res[k]._refAbo; delete res[k]._refKwh;
    res[k].sort(function(a,b){ return (a.ecart||0)-(b.ecart||0); });
  });
  return res;
}


// ── PREV MONTH HELPERS ──
function _normName(n){ return (n||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function getPrevMonthKeyForEnergy(currentKey, energy){
  var keys = Object.keys(history).filter(function(k){
    return k !== 'en_cours' && monthHasEnergy(k, energy);
  }).sort(function(a,b){
    var da = history[a] && history[a].savedAt ? new Date(history[a].savedAt).getTime() : 0;
    var db = history[b] && history[b].savedAt ? new Date(history[b].savedAt).getTime() : 0;
    if (da !== db) return da - db;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
  if (!currentKey) return keys.length ? keys[keys.length-1] : null;
  var idx = keys.indexOf(currentKey);
  return idx > 0 ? keys[idx-1] : null;
}
function computeRankingsForMonth(monthKey, energy){
  if (!monthKey || !history[monthKey]) return null;
  var savedKey = currentMonthKey;
  currentMonthKey = monthKey;
  try {
    return energy === 'elec' ? computeElecRankings() : computeGasRankings();
  } finally {
    currentMonthKey = savedKey;
  }
}
function buildPrevRankMap(prevArr){
  if (!prevArr) return null;
  var sorted = prevArr.slice().sort(function(a,b){ return (a.annuel||0)-(b.annuel||0); });
  var map = {};
  sorted.forEach(function(row, i){ map[_normName(row.name)] = i+1; });
  return map;
}
function rankDeltaHTML(name, currentRank, prevMap){
  if (!prevMap) return '';
  var prev = prevMap[_normName(name)];
  if (!prev) return ' <span style="font-size:9px;color:#555;font-weight:600;background:#eef;padding:1px 4px;border-radius:3px;">New</span>';
  var diff = prev - currentRank;
  if (diff === 0) return ' <span style="font-size:9px;color:#888;font-weight:600;">=</span>';
  if (diff > 0) return ' <span style="font-size:9px;color:#1a8a5a;font-weight:700;">▲'+diff+'</span>';
  return ' <span style="font-size:9px;color:#c0392b;font-weight:700;">▼'+Math.abs(diff)+'</span>';
}

// ── RANK TABLE ──
function rankTable(data, cols, refSupplier, prevData) {
  refSupplier = refSupplier || {name:'EDF (TRV)', label:'TRV'};
  if (!data.length) return '<p style="font-size:12px;color:var(--text3);padding:8px 0;">Aucune donnée</p>';
  var prevMap = buildPrevRankMap(prevData);
  var isHC = cols.includes('HP (€/kWh)');
  var headerCells = cols.map(function(c,i){
    if(i<=2) return '<th>'+c+'</th>';
    var ecartLabel = c.replace('kWh (€/kWh)','Écart kWh').replace('HP (€/kWh)','Écart HP').replace('HC (€/kWh)','Écart HC').replace('Coût annuel €','Écart annuel vs Alterna*');
    return '<th><span style="color:var(--text3);font-size:9px;display:block;font-weight:400;">★ '+c+'</span><span style="font-size:9px;display:block;font-weight:400;color:var(--text3)"># '+ecartLabel+'</span></th>';
  });
  headerCells.splice(3, 0,
    '<th>Code promo</th>',
    '<th>% du kWh HT VS '+refSupplier.label+' (affiché)</th>',
    '<th>% TTC vs '+refSupplier.label+' (réél)</th>'
  );
  var headers = headerCells.join('');

  // Trouver la ligne de la référence tarifaire réglementée pour calcul %
  // refSupplier.names : noms possibles, par ordre de priorité (ex: 'Engie (PRVG)' avant 'Engie')
  var refNames = refSupplier.names || [refSupplier.name];
  var trvRow = null;
  for(var ri=0; ri<refNames.length && !trvRow; ri++){
    trvRow = data.find(function(r){return r.name===refNames[ri] && !r.isSelf;}) || null;
  }
  var trvAnnuel = trvRow ? trvRow.annuel : null;
  var trvKwhRef = trvRow ? (isHC ? trvRow.hp : trvRow.kwh) : null;

  // Calculer le vrai rang de chaque ligne (référence et Alterna inclus dans le rang)
  var sorted = data.slice().sort(function(a,b){return (a.annuel||0)-(b.annuel||0);});

  var rows = data.map(function(row, i) {
    var isSelf = row.isSelf;
    var isTRV = !isSelf && trvRow && row === trvRow;
    var realRank = sorted.indexOf(row) + 1;

    // Styles
    var rowStyle = '';
    var rankLabel = '';
    if(isSelf){
      rowStyle = 'background:#e8f7f0;';
      rankLabel = '#'+realRank;
    } else if(isTRV){
      rowStyle = 'background:#e8f0ff;';
      rankLabel = refSupplier.label;
    } else {
      rankLabel = '#'+realRank;
    }

    var rankCls = isSelf ? 'rank self' : (realRank<=3 ? 'rank top' : 'rank');
    var nameCls = isSelf ? 'supplier-cell self' : (isTRV ? 'supplier-cell' : 'supplier-cell');
    var deltaHTML = rankDeltaHTML(row.name, realRank, prevMap);

    var cells = '<td class="'+rankCls+'" style="'+(isTRV?'color:#2255cc;font-weight:700;':isSelf?'color:#1a8a5a;font-weight:700;':'')+'">'+rankLabel+deltaHTML+'</td>'
      + '<td class="'+nameCls+'" style="'+(isTRV?'color:#2255cc;font-weight:600;':isSelf?'color:#1a8a5a;font-weight:600;':'')+'">'+row.name+(isTRV?' <span class="ref-badge" style="background:#2255cc;color:white;padding:1px 4px;border-radius:3px;">'+refSupplier.label+'</span>':'')+'</td>'
      + '<td class="offer-cell">'+(row.offer||'—')+'</td>';

    // Code promo (montant déduit une fois du coût annuel)
    var promoVal = +(row.promo||0);
    cells += '<td class="num">'+(promoVal ? '<span class="pct-note">-'+promoVal.toFixed(2).replace(/[.,]00$/,'').replace('.',',')+' €</span>' : '—')+'</td>';

    // % du kWh HT vs TRV — valeur saisie manuellement dans la fiche fournisseur
    var pctKwhTxt = (row.pctKwhVsTrv||'').toString().trim();
    cells += '<td class="num">'+(pctKwhTxt ? '<span class="pct-note">'+pctKwhTxt+'</span>' : '—')+'</td>';

    // % TTC vs la référence réglementée (TRV/PRVG)
    var pct = (trvAnnuel && row.annuel!=null) ? ((row.annuel - trvAnnuel)/trvAnnuel*100) : null;
    cells += '<td class="num">'+(pct!=null ? '<span class="pct-note">'+(pct>=0?'+':'')+pct.toFixed(1).replace('.',',')+'%</span>' : '—')+'</td>';

    if(isSelf){
      // Valeurs absolues uniquement pour Alterna (la référence du classement)
      function fmtV(v){if(v===null||v===undefined||isNaN(v)||v==='')return '—';return +v;}
      cells += '<td class="num">'+fmtV(row.abo)+'</td>';
      if(isHC){
        cells += '<td class="num">'+fmtV(row.hp)+'</td>';
        cells += '<td class="num">'+fmtV(row.hc)+'</td>';
      } else {
        cells += '<td class="num">'+fmtV(row.kwh)+'</td>';
      }
      var totHTML = '—';
      if(row.annuel!=null){
        totHTML = Math.round(row.annuel)+' €';
        if(promoVal) totHTML = '<span style="text-decoration:line-through;color:var(--text3);font-weight:400;">'+Math.round(row.annuel+promoVal)+' €</span> '+totHTML;
      }
      cells += '<td class="num">'+totHTML+'</td>';
    } else {
      // Écarts vs Alterna pour tous les autres acteurs, y compris la ligne TRV/PRVG elle-même.
      cells += '<td class="num">'+fmtE(row.ecart_abo,2)+'</td>';
      if(isHC){
        cells += '<td class="num">'+fmtE(row.ecart_hp,4)+'</td>';
        cells += '<td class="num">'+fmtE(row.ecart_hc,4)+'</td>';
      } else {
        cells += '<td class="num">'+fmtE(row.ecart_kwh,4)+'</td>';
      }
      var ecHTML = fmtE(row.ecart,0);
      if(promoVal && row.ecart!=null) ecHTML = '<span style="text-decoration:line-through;color:var(--text3);font-weight:400;">'+fmtE(row.ecart+promoVal,0)+'</span> '+ecHTML;
      cells += '<td class="num">'+ecHTML+'</td>';
    }
    return '<tr style="'+rowStyle+'">'+cells+'</tr>';
  }).join('');
  return '<table class="rank-table"><thead><tr>'+headers+'</tr></thead><tbody>'+rows+'</tbody></table>';
}


function renderResultsHTML() {
  var isElec=currentEnergy==='elec';
  var monthBar=buildMonthBar();
  var saveBtn=isEditor?'<button class="save-btn editor-only" onclick="saveCurrentMonth()">💾 Sauvegarder</button>':'';
  var pdfBtn='<button class="pdf-btn" onclick="lancerExportPDF()">↓ PDF</button>';
  var csvBtn='<button class="btn-export" onclick="'+(isElec?'exportElec':'exportGas')+'()">↓ CSV</button>';
  var title=isElec?'Classement ⚡ Électricité':'Classement 🔥 Gaz';
  var subtitle='★ = Alterna énergie (référence) · négatif = moins cher'
    +(currentMonthKey?' · <span style="color:var(--accent);font-weight:500">'+getMonthLabel(currentMonthKey)+'</span>':' · données en cours');
  var accentColor = isElec ? 'var(--accent)' : 'var(--orange)';
  var bgColor = isElec ? 'var(--accent-light)' : 'var(--orange-light)';
  var borderColor = isElec ? '#B8D8D6' : '#F0C090';
  var header=monthBar
    +'<div class="results-header" style="border-bottom:3px solid '+accentColor+';padding-bottom:12px;margin-bottom:16px;">'
    +'<div>'
    +'<div class="results-title" style="color:'+accentColor+';">'+title+'</div>'
    +'<div style="font-size:12px;color:var(--text2);margin-top:2px;">'+subtitle+'</div>'
    +'</div>'
    +'<div style="display:flex;gap:6px;">'+saveBtn+pdfBtn+csvBtn+'</div>'
    +'</div>';
  if(isElec){
    var r=computeElecRankings();
    var prevKey = getPrevMonthKeyForEnergy(currentMonthKey, 'elec');
    var p = prevKey ? computeRankingsForMonth(prevKey, 'elec') : null;
    var C_BASE=['#','Fournisseur','Offre','Abo (€/mois)','kWh (€/kWh)','Coût annuel €'];
    var C_HC  =['#','Fournisseur','Offre','Abo (€/mois)','HP (€/kWh)','HC (€/kWh)','Coût annuel €'];
    function sec(label, table){ return '<div class="pdf-section" data-pdf-section><div class="segment-label">'+label+'</div>'+table+'</div>'; }
  return header
      + sec('6 kVA Option Base — conso moy. '+CONSOS.elec_6_base+' kWh/an', rankTable(r.e6b,C_BASE,null,p&&p.e6b))
      + sec('9 kVA Option Base — conso moy. '+CONSOS.elec_9_base+' kWh/an', rankTable(r.e9b,C_BASE,null,p&&p.e9b))
      + sec('6 kVA Option HP/HC — conso moy. '+(CONSOS.elec_6_hc_hp+CONSOS.elec_6_hc_hc)+' kWh/an', rankTable(r.e6h,C_HC,null,p&&p.e6h))
      + sec('9 kVA Option HP/HC — conso moy. '+(CONSOS.elec_9_hc_hp+CONSOS.elec_9_hc_hc)+' kWh/an', rankTable(r.e9h,C_HC,null,p&&p.e9h));
  } else {
    var r=computeGasRankings();
    var prevKey = getPrevMonthKeyForEnergy(currentMonthKey, 'gas');
    var p = prevKey ? computeRankingsForMonth(prevKey, 'gas') : null;
    var C_GAS=['#','Fournisseur','Offre','Abo (€/mois)','kWh (€/kWh)','Coût annuel €'];
    var GAS_REF = {names:['Engie (PRVG)','Engie'], label:'PRVG'};
    var gasStyle='background:var(--orange-light);border-radius:10px;padding:16px;margin-bottom:20px;border:1px solid #F0C090;';
    var BAND_META = {
      base: { lbl:'BASE', desc:'< 1 MWh', conso:CONSOS.gas_base },
      b0:   { lbl:'B0',   desc:'1 / 6 MWh — Cuisine & Eau chaude', conso:CONSOS.gas_b0 },
      b1:   { lbl:'B1',   desc:'6 / 30 MWh — Chauffage individuel', conso:CONSOS.gas_b1 },
      b2i:  { lbl:'B2i',  desc:'30 / 300 MWh', conso:CONSOS.gas_b2i }
    };
    function gsec(label, table){
      return '<div class="pdf-section" data-pdf-section style="'+gasStyle+'">'
        +'<div class="segment-label" style="color:var(--orange);border-color:#F0C090;">'+label+'</div>'
        +table+'</div>';
    }
    var out = header;
    // Classements gaz limités à B0 et B1 en Zone 1 et Zone 2 uniquement
    ['b0','b1'].forEach(function(b){
      var meta = BAND_META[b];
      [1,2].forEach(function(z){
        var key = b+'z'+z;
        var rows = r[key] || [];
        var hasCompetitor = rows.some(function(x){ return !x.isSelf; });
        if(!hasCompetitor) return;
        var lbl = '🔥 '+meta.lbl+' Zone '+z+' — '+meta.desc+' — conso moy. '+meta.conso+' kWh/an';
        out += gsec(lbl, rankTable(rows, C_GAS, GAS_REF, p && p[key]));
      });
    });

    return out;
  }
}

async function lancerExportPDF() {

    pdf.setFont('helvetica','normal'); pdf.setFontSize(12);
    pdf.text(' energie', textX + wAlterna, HEADER_H/2-0.5);
    // Sous-titre
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
    pdf.setTextColor(230,240,238);
    pdf.text(titre, textX, HEADER_H/2+5);
    // Date à droite
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(9.5);
    pdf.text(monthLabel + '  ·  Généré le ' + new Date().toLocaleDateString('fr-FR'), PW-M, HEADER_H/2+1.4, {align:'right'});
  }
  function drawFooter(pageNum, total){
    pdf.setDrawColor(accentHex); pdf.setLineWidth(0.4);
    pdf.line(M, PH-FOOTER_H+2, PW-M, PH-FOOTER_H+2);
    pdf.setTextColor(120,120,120);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    pdf.text('Benchmark Énergie — Alterna énergie', M, PH-2);
    pdf.text('Page '+pageNum+' / '+total, PW-M, PH-2, {align:'right'});
  }

  // ── Stage off-screen enrichi — fontes UNIFIÉES entre en-têtes et cellules ──
  var stage = document.createElement('div');
  stage.style.cssText = 'position:fixed;left:-10000px;top:0;width:1200px;background:#fff;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;';
  var styleTag = document.createElement('style');
  styleTag.textContent = ''
    + '.pdf-stage .seg-title{font-size:24px;font-weight:700;color:'+accentHex+';letter-spacing:.01em;margin:0 0 16px;padding:14px 20px;background:'+accentLight+';border-left:6px solid '+accentHex+';border-radius:8px;}'
    + '.pdf-stage table{width:100%;border-collapse:separate;border-spacing:0;font-size:20px !important;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);font-variant-numeric:tabular-nums;}'
    + '.pdf-stage thead th{background:'+accentHex+';color:#fff;font-weight:600;text-align:left;padding:12px 14px;font-size:18px !important;letter-spacing:0;text-transform:none;border:none;vertical-align:middle;line-height:1.35;}'
    + '.pdf-stage thead th:nth-child(n+4){text-align:right;}'
    + '.pdf-stage tbody td{padding:10px 14px;border-top:1px solid #eef1f4;font-size:20px !important;color:#1f2937;line-height:1.3;font-variant-numeric:tabular-nums;}'
    + '.pdf-stage tbody td:nth-child(n+4){text-align:right;}'
    + '.pdf-stage tbody tr:nth-child(even) td{background:#fafbfc;}'
    + '.pdf-stage tbody tr td:first-child{font-weight:700;color:'+accentHex+';width:56px;text-align:center;}'
    + '.pdf-stage tbody tr td:nth-child(2){font-weight:600;}'
    + '.pdf-stage thead th span{font-size:18px !important;color:#fff !important;font-weight:600 !important;display:block;line-height:1.35;letter-spacing:0;}'
    + '.pdf-stage .pct-note{font-size:20px !important;opacity:0.85;}'
    + '.pdf-stage .ref-badge{font-size:14px !important;}'
  ;
  stage.appendChild(styleTag);
  stage.className = 'pdf-stage';
  document.body.appendChild(stage);

  var y = HEADER_H + 4;
  var pages = [];
  pages.push(function(n,t){drawHeader(n); drawFooter(n,t);});

  try {
    for (var i=0; i<sections.length; i++){
      var srcSec = sections[i];
      // Extraire titre + table de la section source
      var srcLabel = srcSec.querySelector('.segment-label');
      var srcTable = srcSec.querySelector('table');
      // Wrapper enrichi
      var wrap = document.createElement('div');
      wrap.style.cssText = 'margin-bottom:20px;';
      if (srcLabel) {
        var t = document.createElement('div');
        t.className = 'seg-title';
        t.textContent = srcLabel.textContent;
        wrap.appendChild(t);
      }
      if (srcTable) {
        wrap.appendChild(srcTable.cloneNode(true));
      } else {
        wrap.appendChild(srcSec.cloneNode(true));
      }
      stage.innerHTML = '';
      stage.appendChild(styleTag);
      stage.appendChild(wrap);
      // Laisser le layout se poser
      await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});

      var canvas = await html2canvas(wrap, {scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false});
      var wPx = canvas.width, hPx = canvas.height;
      var wMM = CW;
      var hMM = hPx * (wMM / wPx);
      var maxH = PH - HEADER_H - FOOTER_H - 8;
      if (hMM > maxH){
        hMM = maxH;
        wMM = wPx * (hMM / hPx);
      }
      var remaining = PH - FOOTER_H - y;
      if (hMM > remaining && y > HEADER_H + 4){
        pdf.addPage();
        pages.push(function(n,t){drawHeader(n); drawFooter(n,t);});
        y = HEADER_H + 4;
      }
      var xImg = M + (CW - wMM)/2;
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', xImg, y, wMM, hMM, undefined, 'FAST');
      y += hMM + 5;
    }
  } finally {
    document.body.removeChild(stage);
  }

  // Draw headers/footers now that total pages is known
  var total = pdf.internal.getNumberOfPages();
  for (var p=1; p<=total; p++){
    pdf.setPage(p);
    drawHeader(p);
    drawFooter(p, total);
  }

  var fname = 'benchmark_'+(isElec?'elec':'gaz')+'_'+monthLabel.replace(/\s+/g,'_').toLowerCase()+'.pdf';

  showToast('✓ PDF téléchargé', 'success');

// ── DECOMPOSED TARIFF PARSER (Engie-style: Fourniture+Acheminement+Obligations) ──────
function parseDecomposedElec(text) {
  // Normalize: commas to dots, clean up
  var norm = text.replace(/,/g,'.').replace(/\s+/g,' ');
  var result = {};
  
  // Helper: find a number near a keyword
  function findNum(str, keyword, after) {
    var idx = str.indexOf(keyword);
    if (idx < 0) return null;
    var sub = after ? str.substring(idx) : str.substring(0, idx+keyword.length+60);
    if (!after) sub = str.substring(idx);
    var nums = sub.match(/\b(\d+\.\d+)\b/g);
    if (!nums) return null;
    for (var i=0; i<nums.length; i++) {
      var v = parseFloat(nums[i]);
      if (v > 0) return v;
    }
    return null;
  }
  
  // Detect if this is a decomposed format
  var hasAcheminement = /Acheminement/i.test(text);
  var hasFourniture = /Fourniture/i.test(text);
  var hasObligation = /Obligation/i.test(text);
  
  if (!hasAcheminement || !hasFourniture) return result; // not decomposed
  
  // ── Extract by kVA ─────────────────────────────────────────────
  // Parse all rows: "6 38,90 46,68 0,08755 0,14208"
  // We need: for each kVA [3,6,9,12,15,18], extract:
  // - Fourniture CS: abo/an TTC, kWh TTC
  // - Fourniture HP/HC: abo/an TTC, HP TTC, HC TTC  
  // - Acheminement CU (base): abo/an TTC, kWh TTC
  // - Acheminement MUDT (HP/HC): abo/an TTC, HP TTC, HC TTC
  // - Obligation CS: kWh_souscription TTC
  // - Obligation HP/HC: kWh_souscription TTC
  
  var kvas = ['3','6','9','12','15','18'];
  
  // Split into sections by detecting section headers
  var lines = text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  
  // Section detection
  var sections = {
    fourn_base: [], fourn_hphc: [],
    ach_base: [], ach_mudt: [],
    oblig_base: [], oblig_hphc: []
  };
  
  var curSection = null;
  for (var i=0; i<lines.length; i++) {
    var line = lines[i];
    var ln = line.toLowerCase();
    
    if (/fourniture.*comptage simple|fourniture comptage s/i.test(line)) { curSection='fourn_base'; continue; }
    if (/fourniture.*heures|fourniture.*hp.hc/i.test(line)) { curSection='fourn_hphc'; continue; }
    if (/acheminement.*courte utilisation.*cu|acheminement sans diff/i.test(line)) { curSection='ach_base'; continue; }
    if (/acheminement.*mudt|acheminement.*moyenne utilisation.*mudt|acheminement.*2 plages/i.test(line)) { curSection='ach_mudt'; continue; }
    if (/obligation.*comptage simple|obligation cs/i.test(line)) { curSection='oblig_base'; continue; }
    if (/obligation.*heures|obligation.*hp.hc/i.test(line)) { curSection='oblig_hphc'; continue; }
    // Skip header rows
    if (/puissance|HTT|TTC|abonnement|prix|kVA/i.test(line) && !/^\d/.test(line)) continue;
    
    if (curSection) {
      // Try to extract row: kVA num num num ...
      var row = line.replace(/,/g,'.').match(/^(\d+)\s+([\d.]+)\s+([\d.]+)(?:\s+([\d.]+))?(?:\s+([\d.]+))?(?:\s+([\d.]+))?(?:\s+([\d.]+))?(?:\s+([\d.]+))?(?:\s+([\d.]+))?/);
      if (row && kvas.includes(row[1])) {
        sections[curSection].push({
          kva: row[1],
          v: [row[2],row[3],row[4],row[5],row[6],row[7],row[8],row[9]].map(function(x){return x?parseFloat(x):null;})
        });
      }
    }
  }
  
  // ── Compute totals per kVA ──────────────────────────────────────
  kvas.forEach(function(k) {
    var fb = sections.fourn_base.find(function(r){return r.kva===k;});
    var fh = sections.fourn_hphc.find(function(r){return r.kva===k;});
    var ab = sections.ach_base.find(function(r){return r.kva===k;});
    var am = sections.ach_mudt.find(function(r){return r.kva===k;});
    var ob = sections.oblig_base.find(function(r){return r.kva===k;});
    var oh = sections.oblig_hphc.find(function(r){return r.kva===k;});
    
    // BASE option:
    // abo_base (€/mois) = (Fourn_CS_abo_TTC + Ach_CU_abo_TTC) / 12
    // kwh_base = Fourn_CS_kWh_TTC + Ach_CU_kWh_TTC + Oblig_CS_kWh_TTC_souscription
    if (fb && ab) {
      // fb.v = [HTT_abo, TTC_abo, HTT_kwh, TTC_kwh] (yearly)
      // ab.v = [HTT_abo, TTC_abo, HTT_kwh, TTC_kwh] (yearly)
      var fourn_abo = fb.v[1]; // TTC yearly abo
      var ach_abo   = ab.v[1]; // TTC yearly abo
      var fourn_kwh = fb.v[3]; // TTC kWh
      var ach_kwh   = ab.v[3]; // TTC kWh
      var oblig_kwh = ob ? ob.v[1] : 0; // TTC subscription price
      
      if (fourn_abo && ach_abo) {
        result['df_ab_'+k+'_b'] = fourn_abo;
        result['da_ab_'+k+'_b'] = ach_abo;
        result['abo_'+k+'_base'] = Math.round((fourn_abo+ach_abo)/12*100)/100;
      }
      if (fourn_kwh) result['df_kw_'+k+'_b'] = fourn_kwh;
      if (ach_kwh)   result['da_kw_'+k+'_b'] = ach_kwh;
      if (oblig_kwh) result['do_kw_'+k+'_b'] = oblig_kwh;
      if (fourn_kwh && ach_kwh) {
        result['kwh_'+k+'_base'] = Math.round((fourn_kwh + ach_kwh + (oblig_kwh||0))*10000)/10000;
      }
    }
    
    // HP/HC option:
    // abo_hc (€/mois) = (Fourn_HPHC_abo_TTC + Ach_MUDT_abo_TTC) / 12
    // kwh_hp = Fourn_HP_TTC + Ach_MUDT_HP_TTC + Oblig_HP_TTC (largest values)
    // kwh_hc = Fourn_HC_TTC + Ach_MUDT_HC_TTC + Oblig_HC_TTC (smallest values)
    if (fh && am) {
      // fh.v = [HTT_abo, TTC_abo, HTT_hp, TTC_hp, HTT_hc, TTC_hc]
      // am.v = [HTT_abo, TTC_abo, HTT_hp, TTC_hp, HTT_hc, TTC_hc]
      var fourn_abo_h = fh.v[1];
      var ach_abo_h   = am.v[1];
      var fourn_hp = fh.v[3]; // TTC HP
      var fourn_hc = fh.v[5]; // TTC HC
      var ach_hp   = am.v[3]; // TTC HP (MUDT HP = Heures Pleines)
      var ach_hc   = am.v[5]; // TTC HC (MUDT HC = Heures Creuses)
      var oblig_hp = oh ? oh.v[1] : 0; // Oblig HP TTC (subscription)
      var oblig_hc = oh ? oh.v[1] : 0; // same value used for both per spec
      
      if (fourn_abo_h && ach_abo_h) {
        result['df_ab_'+k+'_h'] = fourn_abo_h;
        result['da_ab_'+k+'_h'] = ach_abo_h;
        result['abo_'+k+'_hc'] = Math.round((fourn_abo_h+ach_abo_h)/12*100)/100;
      }
      if (fourn_hp) result['df_hp_'+k] = fourn_hp;
      if (fourn_hc) result['df_hc_'+k] = fourn_hc;
      if (ach_hp)   result['da_hp_'+k] = ach_hp;
      if (ach_hc)   result['da_hc_'+k] = ach_hc;
      if (oblig_hp) result['do_hp_'+k] = oblig_hp;
      if (oblig_hc) result['do_hc_'+k] = oblig_hc;
      
      if (fourn_hp && ach_hp) {
        result['hp_'+k] = Math.round((fourn_hp + ach_hp + (oblig_hp||0))*10000)/10000;
      }
      if (fourn_hc && ach_hc) {
        result['hc_'+k] = Math.round((fourn_hc + ach_hc + (oblig_hc||0))*10000)/10000;
      }
    }
  });
  
  return result;
}

// Apply decomposed data to form fields
function applyDecomposed(data) {
  // Switch to decomposed mode and re-render
  if (currentSupplier !== null) {
    var sup = getSuppliersList()[currentSupplier];
    sup.elec.decomposed = true;
    // Store data
    Object.keys(data).forEach(function(k){ sup.elec.data[k] = data[k]; });
    renderContent();
    // Trigger recalc for all kVAs
    ['3','6','9','12','15','18'].forEach(function(k){ rcBase(k); rcHC(k); });
  }
}

function processPastedText() {
  var ta = document.getElementById('pasteInput');
  if (!ta || !ta.value.trim()) return;
  var text = ta.value;
  
  if (currentEnergy === 'elec') {
    // Try to parse decomposed Engie-style format
    var decomp = parseDecomposedElec(text);
    if (decomp && Object.keys(decomp).length > 0) {
      // Switch to decomposed mode
      if (currentSupplier !== null) {
        getSuppliersList()[currentSupplier].elec.decomposed = true;
      }
      applyDecomposed(decomp);
      if (currentSupplier !== null) getSuppliersList()[currentSupplier][currentEnergy].pdfName = 'Texte collé';
      showToast('✓ Tarif décomposé extrait et calculé', 'success');
    } else {
      // Fall back to simple mode
      var extracted = parseElecTariffs(text);
      var count = Object.keys(extracted).length;
      if (count > 0) {
        // Sauvegarder dans supplier.data d'abord
        if (currentSupplier !== null) {
          var sup = getSuppliersList()[currentSupplier];
          Object.assign(sup[currentEnergy].data, extracted);
          sup[currentEnergy].status = 'done';
          sup[currentEnergy].pdfName = 'Texte collé';
        }
        applyExtracted(extracted);
        showToast('✓ '+count+' valeurs extraites du texte', 'success');
      } else {
        showToast('⚠️ Aucune valeur détectée dans ce texte', 'error');
        return;
      }
    }
  } else {
    var extracted = parseGasTariffs(text);
    var count = Object.keys(extracted).length;
    if (count > 0) {
      applyExtracted(extracted);
      if (currentSupplier !== null) getSuppliersList()[currentSupplier][currentEnergy].pdfName = 'Texte collé';
      showToast('✓ '+count+' valeurs gaz extraites', 'success');
    } else {
      showToast('⚠️ Aucune valeur détectée', 'error');
      return;
    }
  }
  
  var info = document.getElementById('infoBox');
  if (info) { info.style.display=''; info.textContent='✓ Tarifs extraits du texte collé. Vérifiez les valeurs avant de valider.'; }
  document.getElementById('pasteArea').style.display = 'none';
  renderContent();
  renderResults();
}
