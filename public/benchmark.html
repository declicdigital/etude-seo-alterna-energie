// ── Custom prompt modal (replaces blocked window.prompt) ──────────
var _promptModalCallback = null;
function showPromptModal(title, defaultVal, callback) {
  var modal = document.getElementById('promptModal');
  var input = document.getElementById('promptModalInput');
  var titleEl = document.getElementById('promptModalTitle');
  if(!modal) { var r=window.prompt(title,defaultVal); callback(r); return; }
  titleEl.textContent = title;
  input.value = defaultVal || '';
  modal.style.display = 'flex';
  setTimeout(function(){ input.focus(); input.select(); }, 50);
  _promptModalCallback = callback;
  input.onkeydown = function(e){
    if(e.key==='Enter') promptModalOk();
    if(e.key==='Escape') promptModalCancel();
  };
}
function promptModalOk() {
  var val = document.getElementById('promptModalInput').value.trim();
  document.getElementById('promptModal').style.display = 'none';
  if(_promptModalCallback) { _promptModalCallback(val || null); _promptModalCallback=null; }
}
function promptModalCancel() {
  document.getElementById('promptModal').style.display = 'none';
  if(_promptModalCallback) { _promptModalCallback(null); _promptModalCallback=null; }
}

// ── Custom confirm modal (replaces blocked window.confirm) ────────
var _confirmModalCallback = null;
function showConfirmModal(message, callback) {
  var modal = document.getElementById('confirmModal');
  var msgEl = document.getElementById('confirmModalMsg');
  if(!modal) { callback(window.confirm(message)); return; }
  msgEl.textContent = message;
  modal.style.display = 'flex';
  _confirmModalCallback = callback;
}
function confirmModalOk() {
  document.getElementById('confirmModal').style.display = 'none';
  if(_confirmModalCallback) { _confirmModalCallback(true); _confirmModalCallback=null; }
}
function confirmModalCancel() {
  document.getElementById('confirmModal').style.display = 'none';
  if(_confirmModalCallback) { _confirmModalCallback(false); _confirmModalCallback=null; }
}

// ══════════ MOBILE APP SHELL ══════════
function isMobileView(){ return window.matchMedia('(max-width:820px)').matches; }
function openDrawer(){
  var sb = document.getElementById('sidebar'), bd = document.getElementById('drawerBackdrop');
  if(!sb || !bd) return;
  sb.classList.add('open'); bd.classList.add('open');
  document.body.style.overflow = 'hidden';
  syncMobileNav();
}
function closeDrawer(){
  var sb = document.getElementById('sidebar'), bd = document.getElementById('drawerBackdrop');
  if(sb) sb.classList.remove('open');
  if(bd) bd.classList.remove('open');
  document.body.style.overflow = '';
  syncMobileNav();
}
function mobileGo(tab){
  currentTab = tab;
  closeDrawer();
  renderContent();
  syncMobileNav();
  try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){ window.scrollTo(0,0); }
}
function syncMobileNav(){
  var sb = document.getElementById('sidebar');
  var drawerOpen = !!(sb && sb.classList.contains('open'));
  var map = {'mnav-results': (!drawerOpen && currentTab === 'results'),
             'mnav-entry':   (!drawerOpen && currentTab === 'entry'),
             'mnav-drawer':  drawerOpen};
  Object.keys(map).forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.classList.toggle('active', map[id]);
  });
}
function enhanceMobileTables(){
  var root = document.getElementById('mainContent');
  if(!root) return;
  root.querySelectorAll('table').forEach(function(t){
    var p = t.parentElement;
    if(p && p.classList.contains('tscroll')) return;
    if(t.closest('.tscroll')) return;
    var w = document.createElement('div');
    w.className = 'tscroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
}
(function initMobileShell(){
  var run = function(){
    var root = document.getElementById('mainContent');
    if(!root) return;
    enhanceMobileTables();
    syncMobileNav();
    try {
      new MutationObserver(function(){ enhanceMobileTables(); syncMobileNav(); })
        .observe(root, {childList:true, subtree:true});
    } catch(e){}
    if(typeof selectSupplier === 'function'){
      var orig = selectSupplier;
      selectSupplier = function(i){ orig(i); closeDrawer(); syncMobileNav(); };
      window.selectSupplier = selectSupplier;
    }
    window.addEventListener('resize', function(){ if(!isMobileView()) closeDrawer(); });
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 0); });
  else setTimeout(run, 0);
})();

</script>

<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--surface,#fff);border-radius:12px;padding:24px;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <div id="confirmModalMsg" style="font-size:14px;font-weight:500;margin-bottom:16px;color:var(--text1,#111);"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="confirmModalCancel()" style="padding:7px 16px;border:1px solid var(--border,#ddd);background:transparent;border-radius:6px;cursor:pointer;font-size:13px;">Annuler</button>
      <button onclick="confirmModalOk()" style="padding:7px 16px;background:#c00;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;">Supprimer</button>
    </div>
  </div>
</div>
<div id="promptModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--surface,#fff);border-radius:12px;padding:24px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <div id="promptModalTitle" style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text1,#111);"></div>
    <input id="promptModalInput" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border,#ddd);border-radius:6px;font-size:13px;font-family:var(--sans,'DM Sans'),sans-serif;outline:none;" />
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end;">
      <button onclick="promptModalCancel()" style="padding:7px 16px;border:1px solid var(--border,#ddd);background:transparent;border-radius:6px;cursor:pointer;font-size:13px;">Annuler</button>
      <button onclick="promptModalOk()" style="padding:7px 16px;background:var(--accent,#006a5e);color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;">OK</button>
    </div>
  </div>
</div>

<div id="calcPop" style="display:none;position:absolute;z-index:10000;background:var(--surface,#fff);border:1px solid var(--border,#ddd);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.18);padding:10px;width:236px;font-family:var(--sans,'DM Sans'),sans-serif;">
  <input id="calcExpr" type="text" inputmode="text" placeholder="ex: 12.5*1.2" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border,#ddd);border-radius:8px;font-size:15px;outline:none;text-align:right;font-variant-numeric:tabular-nums;">
  <div id="calcPrev" style="height:16px;text-align:right;font-size:12px;color:var(--text2,#777);margin:4px 2px 6px;"></div>
  <div id="calcKeys" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;"></div>
</div>
<script>
(function(){
  var target=null;
  var pop=document.getElementById('calcPop'), expr=document.getElementById('calcExpr'),
      prev=document.getElementById('calcPrev'), keys=document.getElementById('calcKeys');
  var layout=['7','8','9','C','4','5','6','/','1','2','3','*','0','.','-','+','(',')','⌫','='];
  layout.forEach(function(k){
    var b=document.createElement('button');
    b.type='button'; b.textContent=k;
    var accent=(k==='=');
    b.style.cssText='padding:8px 0;border:1px solid var(--border,#ddd);border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;background:'+(accent?'var(--accent,#006a5e)':'transparent')+';color:'+(accent?'#fff':'var(--text1,#111)')+';';
    b.onmousedown=function(e){e.preventDefault();};
    b.onclick=function(){
      if(k==='C'){expr.value='';}
      else if(k==='⌫'){expr.value=expr.value.slice(0,-1);}
      else if(k==='='){applyCalc();return;}
      else{expr.value+=k;}
      updatePrev(); expr.focus();
    };
    keys.appendChild(b);
  });
  function evalExpr(v){
    v=(v||'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').trim();
    if(!v) return null;
    if(!/^[0-9+\-*/().\s]+$/.test(v)) return null;
    try{ var r=Function('"use strict";return ('+v+')')(); return (typeof r==='number'&&isFinite(r))?r:null; }catch(e){ return null; }
  }
  function updatePrev(){
    var r=evalExpr(expr.value);
    prev.textContent = r===null?'':'= '+(Math.round(r*1e6)/1e6);
  }
  function applyCalc(){
    var r=evalExpr(expr.value);
    if(r===null){ prev.textContent='expression invalide'; return; }
    if(target){
      var dec = (target.id||'').indexOf('abo')>=0 ? 4 : 6;
      target.value = String(Math.round(r*Math.pow(10,dec))/Math.pow(10,dec));
      target.dispatchEvent(new Event('input',{bubbles:true}));
      target.dispatchEvent(new Event('change',{bubbles:true}));
    }
    closeCalc();
  }
  function closeCalc(){ pop.style.display='none'; target=null; }
  window.closeCalcPop=closeCalc;
  document.addEventListener('dblclick', function(e){
    if(!isEditor) return;
    var el=e.target;
    if(!(el instanceof HTMLInputElement) || el.type!=='number') return;
    target=el;
    expr.value = el.value ? String(el.value) : '';
    updatePrev();
    pop.style.display='block';
    var r=el.getBoundingClientRect();
    var top=r.bottom+window.scrollY+6;
    var left=Math.min(r.left+window.scrollX, window.scrollX+document.documentElement.clientWidth-248);
    pop.style.top=top+'px'; pop.style.left=Math.max(8,left)+'px';
    expr.focus(); expr.select();
  });
  expr.addEventListener('input', updatePrev);
  expr.addEventListener('keydown', function(e){
    if(e.key==='Enter'){e.preventDefault();applyCalc();}
    else if(e.key==='Escape'){e.preventDefault();closeCalc();}
  });
  document.addEventListener('mousedown', function(e){
    if(pop.style.display==='block' && !pop.contains(e.target) && e.target!==target) closeCalc();
  });
})();
</script>
</body>
